hud.name = PBZMoHUD
hud.about = Arcs de HP et de Sha-Chi réglables séparément pour Phantom Blade Zero, avec icônes de potions, d'Essence de Sha-Chi et de Source obscure. Lit les valeurs du joueur sans modifier les données du jeu.
hud.group.preset = Préréglages
hud.group.behavior = Comportement
hud.group.hpArc = Arc de HP
hud.group.qiArc = Arc de Sha-Chi
hud.group.look = Apparence commune
hud.group.icons = Icônes
hud.group.native = Barres natives
hud.group.advanced = Avancé

hud.Layout = Disposition
hud.Layout.tip = Choisir l'emplacement des arcs de HP et de Sha-Chi.
hud.Layout.normal = Normale
hud.Layout.mirror = Miroir
hud.Layout.ipsilateral = Même côté

hud.FollowCharacter = Suivre le personnage
hud.FollowCharacter.tip = Les arcs suivent la position du personnage à l'écran. Désactiver pour utiliser une ancre fixe.
hud.FollowSmoothing = Lissage du suivi
hud.FollowSmoothing.tip = Durée de lissage de la position pendant le suivi du personnage. 0 pour un suivi immédiat.
hud.FixedAnchorX = Ancre fixe X
hud.FixedAnchorX.tip = Position horizontale de l'ancre en fraction de la largeur de l'écran, hors suivi. 0.5 correspond au centre.
hud.FixedAnchorY = Ancre fixe Y
hud.FixedAnchorY.tip = Position verticale de l'ancre en fraction de la hauteur de l'écran, hors suivi. 0.5 correspond au centre.
hud.AnchorHeight = Hauteur de l'ancre
hud.AnchorHeight.tip = Décalage en hauteur au-dessus de l'origine du personnage, en unités du monde Unreal (environ 1 cm chacune) et non en pixels. Une valeur positive élève l'ancre.
hud.AnchorOffsetX = Décalage horizontal global
hud.AnchorOffsetX.tip = Déplace les deux arcs horizontalement ; une valeur positive va vers la droite. S'ajoute au décalage propre de chaque arc.
hud.AnchorOffsetY = Décalage vertical global
hud.AnchorOffsetY.tip = Déplace les deux arcs verticalement ; une valeur positive va vers le bas. S'ajoute au décalage propre de chaque arc.
hud.Visibility = Affichage
hud.Visibility.tip = Suivre l'affichage du HUD du jeu, ou masquer aussi chaque arc resté plein. Les valeurs pleines ne masquent pas les icônes.
hud.Visibility.hud = Suivre le HUD du jeu
hud.Visibility.dynamic = Masquer si plein
hud.HideDelay = Délai de masquage
hud.HideDelay.tip = Durée pendant laquelle un arc doit rester plein avant d'être masqué. Il réapparaît dès que la valeur baisse.

hud.HpArcEnabled = Afficher l'arc de HP
hud.HpArcEnabled.tip = Affiche l'arc de HP sans toucher aux icônes ni aux barres natives du jeu.
hud.HpArcSide = Côté de l'arc de HP
hud.HpArcSide.tip = Côté de l'arc avant rotation. Les deux arcs peuvent partager un côté ; séparez-les avec le rayon ou le décalage.
hud.HpArcSide.left = Gauche
hud.HpArcSide.right = Droite
hud.HpRadius = Rayon de l'arc de HP
hud.HpRadius.tip = Distance entre l'arc de HP et son centre. Une valeur plus grande élargit l'arc.
hud.HpThickness = Épaisseur de l'arc de HP
hud.HpThickness.tip = Largeur des traits de pinceau de l'arc de HP.
hud.HpArcSpan = Étendue de l'arc de HP
hud.HpArcSpan.tip = Angle couvert par l'arc de HP. Une valeur plus grande allonge l'arc.
hud.HpSegments = Segments de l'arc de HP
hud.HpSegments.tip = Plus de segments donnent un arc plus lisse, mais coûtent plus de performances.
hud.HpRotation = Rotation de l'arc de HP
hud.HpRotation.tip = Fait pivoter tout l'arc de HP autour de son centre, traînée et pointe de pinceau comprises. Une valeur positive tourne dans le sens horaire.
hud.HpFillDirection = Sens de remplissage HP
hud.HpFillDirection.tip = Normal suit l'ordre des segments par défaut de l'arc ; Inversé suit l'ordre opposé. La rotation ne modifie pas ce choix.
hud.HpFillDirection.normal = Normal
hud.HpFillDirection.reverse = Inversé
hud.HpOffsetX = Décalage horizontal HP
hud.HpOffsetX.tip = Déplace l'arc de HP horizontalement après rotation ; une valeur positive va vers la droite. Basé sur 1080p, suit l'échelle de l'interface.
hud.HpOffsetY = Décalage vertical HP
hud.HpOffsetY.tip = Déplace l'arc de HP verticalement après rotation ; une valeur positive va vers le bas. Basé sur 1080p, suit l'échelle de l'interface.
hud.HpColor = Couleur des HP
hud.HpColor.tip = Couleur de base de l'arc de HP. Argent pâle par défaut.
hud.HpTrackColor = Couleur du fond HP
hud.HpTrackColor.tip = Couleur du fond affiché derrière l'arc de HP.
hud.HpWarnColor = Couleur d'alerte HP bas
hud.HpWarnColor.tip = Couleur utilisée quand les HP passent sous le seuil d'alerte.
hud.WarnThresholdHp = Seuil HP bas
hud.WarnThresholdHp.tip = La couleur d'alerte s'applique sous cette proportion de HP. Par défaut : 30%.
hud.HpBarOpacity = Opacité du remplissage HP
hud.HpBarOpacity.tip = Opacité de la partie remplie de l'arc de HP. Plus la valeur est haute, plus il est visible.
hud.HpTrackOpacity = Opacité du fond HP
hud.HpTrackOpacity.tip = Opacité du fond de l'arc de HP. 0 pour une transparence totale.
hud.HpShowGhost = Afficher la traînée HP
hud.HpShowGhost.tip = Laisse une traînée qui se résorbe quand les HP baissent, pour mieux voir la perte.
hud.HpGhostOpacity = Opacité de la traînée HP
hud.HpGhostOpacity.tip = Opacité de la traînée laissée quand les HP baissent.
hud.HpGhostColor = Couleur de la traînée HP
hud.HpGhostColor.tip = Couleur de la traînée laissée quand les HP baissent. Rouge sombre par défaut.
hud.HpShowTip = Pointe de pinceau HP
hud.HpShowTip.tip = Affiche une pointe de pinceau au bout du remplissage HP. Elle reste visible même à 0 HP.
hud.HpTipScale = Taille de la pointe HP
hud.HpTipScale.tip = Échelle de la pointe de pinceau au bout du remplissage HP.
hud.HpTipAngle = Angle de la pointe HP
hud.HpTipAngle.tip = Angle de la pointe de pinceau HP par rapport à la tangente de l'arc.

hud.QiArcEnabled = Afficher l'arc de Sha-Chi
hud.QiArcEnabled.tip = Affiche l'arc de Sha-Chi sans toucher aux icônes ni aux barres natives du jeu.
hud.QiArcSide = Côté de l'arc de Sha-Chi
hud.QiArcSide.tip = Côté de l'arc avant rotation. Les deux arcs peuvent partager un côté ; séparez-les avec le rayon ou le décalage.
hud.QiArcSide.left = Gauche
hud.QiArcSide.right = Droite
hud.QiRadius = Rayon de l'arc de Sha-Chi
hud.QiRadius.tip = Distance entre l'arc de Sha-Chi et son centre. Des rayons différents séparent deux arcs du même côté.
hud.QiThickness = Épaisseur de l'arc de Sha-Chi
hud.QiThickness.tip = Largeur des traits de pinceau de l'arc de Sha-Chi.
hud.QiArcSpan = Étendue de l'arc de Sha-Chi
hud.QiArcSpan.tip = Angle couvert par l'arc de Sha-Chi. Une valeur plus grande allonge l'arc.
hud.QiSegments = Segments de l'arc de Sha-Chi
hud.QiSegments.tip = Plus de segments donnent un arc plus lisse, mais coûtent plus de performances.
hud.QiRotation = Rotation de l'arc de Sha-Chi
hud.QiRotation.tip = Fait pivoter tout l'arc de Sha-Chi autour de son centre, traînée et pointe de pinceau comprises. Une valeur positive tourne dans le sens horaire.
hud.QiFillDirection = Sens de remplissage Sha-Chi
hud.QiFillDirection.tip = Normal suit l'ordre des segments par défaut de l'arc ; Inversé suit l'ordre opposé. La rotation ne modifie pas ce choix.
hud.QiFillDirection.normal = Normal
hud.QiFillDirection.reverse = Inversé
hud.QiOffsetX = Décalage horizontal Sha-Chi
hud.QiOffsetX.tip = Déplace l'arc de Sha-Chi horizontalement après rotation ; une valeur positive va vers la droite. Basé sur 1080p, suit l'échelle de l'interface.
hud.QiOffsetY = Décalage vertical Sha-Chi
hud.QiOffsetY.tip = Déplace l'arc de Sha-Chi verticalement après rotation ; une valeur positive va vers le bas. Basé sur 1080p, suit l'échelle de l'interface.
hud.QiColor = Couleur du Sha-Chi
hud.QiColor.tip = Couleur de base de l'arc de Sha-Chi. Doré par défaut.
hud.QiTrackColor = Couleur du fond Sha-Chi
hud.QiTrackColor.tip = Couleur du fond affiché derrière l'arc de Sha-Chi.
hud.QiWarnColor = Couleur d'alerte Sha-Chi bas
hud.QiWarnColor.tip = Couleur utilisée sous le seuil d'alerte de Sha-Chi. L'indicateur de garde brisée est prioritaire.
hud.WarnThresholdQi = Seuil Sha-Chi bas
hud.WarnThresholdQi.tip = La couleur d'alerte s'applique sous cette proportion de Sha-Chi. Par défaut : 25%.
hud.QiBarOpacity = Opacité du remplissage Sha-Chi
hud.QiBarOpacity.tip = Opacité de la partie remplie de l'arc de Sha-Chi. Plus la valeur est haute, plus il est visible.
hud.QiTrackOpacity = Opacité du fond Sha-Chi
hud.QiTrackOpacity.tip = Opacité du fond de l'arc de Sha-Chi. 0 pour une transparence totale.
hud.QiShowGhost = Afficher la traînée Sha-Chi
hud.QiShowGhost.tip = Laisse une traînée qui se résorbe quand le Sha-Chi baisse, pour mieux voir la perte.
hud.QiGhostOpacity = Opacité de la traînée Sha-Chi
hud.QiGhostOpacity.tip = Opacité de la traînée laissée quand le Sha-Chi baisse.
hud.QiGhostColor = Couleur de la traînée Sha-Chi
hud.QiGhostColor.tip = Couleur de la traînée laissée quand le Sha-Chi baisse. Doré sombre par défaut. Pendant une garde brisée, la couleur de garde brisée est utilisée.
hud.QiShowTip = Pointe de pinceau Sha-Chi
hud.QiShowTip.tip = Affiche une pointe de pinceau au bout du remplissage Sha-Chi. Elle reste visible même à 0 Sha-Chi.
hud.QiTipScale = Taille de la pointe Sha-Chi
hud.QiTipScale.tip = Échelle de la pointe de pinceau au bout du remplissage Sha-Chi.
hud.QiTipAngle = Angle de la pointe Sha-Chi
hud.QiTipAngle.tip = Angle de la pointe de pinceau Sha-Chi par rapport à la tangente de l'arc.
hud.BreakHint = Indicateur de garde brisée
hud.BreakHint.tip = Change la couleur de l'arc de Sha-Chi tant que la garde du personnage est brisée ; elle revient aussitôt après. Désactiver pour ne plus détecter la garde brisée.
hud.QiBreakColor = Couleur de garde brisée
hud.QiBreakColor.tip = Couleur de l'arc de Sha-Chi pendant une garde brisée. Prioritaire sur la couleur d'alerte Sha-Chi bas.
hud.QiBreakTrackColor = Fond de garde brisée
hud.QiBreakTrackColor.tip = Couleur du fond de l'arc de Sha-Chi pendant une garde brisée. Revient à la couleur du fond à la fin.
hud.BreakDemo = Aperçu de garde brisée
hud.BreakDemo.tip = Masque le panneau, vide l'arc de Sha-Chi et affiche la couleur de garde brisée pendant 3 secondes, puis tout se rétablit et le panneau revient. La garde du personnage n'est pas réellement brisée.
hud.BreakDemo.run = Lancer l'aperçu

hud.BrushJitter = Tremblement du pinceau
hud.BrushJitter.tip = Variation aléatoire des traits de pinceau des deux arcs. 0 pour les bords les plus nets.
hud.StrokeOverlap = Chevauchement des traits
hud.StrokeOverlap.tip = Longueur du trait en multiple de la longueur d'un segment. Augmenter masque les jointures ; réduire fait ressortir les segments.
hud.GhostSpeed = Durée de résorption
hud.GhostSpeed.tip = Durée de résorption de la traînée des deux arcs. Plus la valeur est basse, plus elle rattrape vite la valeur actuelle.
hud.GhostDelay = Délai de résorption
hud.GhostDelay.tip = Après une perte, la traînée reste figée ce temps avant de se résorber, pour voir ce qui a été perdu. Les coups successifs relancent ce délai ; 0 la résorbe aussitôt.
hud.WarnFlashSpeed = Vitesse de clignotement
hud.WarnFlashSpeed.tip = Fréquence de clignotement des alertes HP bas et Sha-Chi bas. Plus la valeur est haute, plus c'est rapide.
hud.WarnFlashAmount = Intensité du clignotement
hud.WarnFlashAmount.tip = Variation de luminosité pendant les alertes de valeur basse. 0 pour ne pas clignoter.

hud.NativeBars = HUD natif du jeu
hud.NativeBars.tip = Fixer la longueur des barres de HP et de Sha-Chi du jeu (en bas à gauche), les laisser telles quelles ou les masquer entièrement. La longueur fixe est rétablie quand le jeu recrée les barres.
hud.NativeBars.pin = Longueur fixe
hud.NativeBars.dynamic = Inchangées
hud.NativeBars.hide = Masquer les barres
hud.HudBarWidth = Largeur fixe des barres
hud.HudBarWidth.tip = -1 garde la longueur initiale de chaque barre. Une largeur personnalisée doit valoir au moins 48, en unités d'interface du jeu. La longueur fixe est rétablie quand le jeu recrée les barres.
hud.NativePinRecover = Rétablir la longueur fixe
hud.NativePinRecover.tip = Tente de rétablir la longueur fixe si elle cesse de fonctionner, en général en 1.5 s environ. Désactiver pour seulement journaliser les anomalies, utile au diagnostic. Fonctionne en modes fixe et masqué.
hud.HudNumbers = Valeurs sur les barres
hud.HudNumbers.tip = Affiche les valeurs actuelles et maximales, même quand les barres natives sont masquées.
hud.HudNumberStyle = Style des valeurs
hud.HudNumberStyle.tip = Centré affiche un texte blanc dans chaque barre. Dessus et dessous place les HP au-dessus de leur barre et le Sha-Chi en dessous de la sienne.
hud.HudNumberStyle.center = Centré dans la barre
hud.HudNumberStyle.side = Dessus et dessous

hud.MedicineHud = Afficher les potions
hud.MedicineHud.tip = Affiche les icônes et le nombre des potions équipées.
hud.PureIcon = Afficher l'Essence de Sha-Chi
hud.PureIcon.tip = Affiche l'icône et le nombre d'Essences de Sha-Chi.
hud.BulletIcon = Afficher la Source obscure
hud.BulletIcon.tip = Affiche l'icône et le nombre de Sources obscures, à la même position de groupe que l'Essence de Sha-Chi.
hud.UltChargeBar = Charge de l'Essence
hud.UltChargeBar.tip = Remplit l'icône d'Essence de Sha-Chi selon sa progression de charge. Sans effet sur l'icône de Source obscure.
hud.IconScale = Échelle des icônes
hud.IconScale.tip = Met à l'échelle icônes, chiffres et espacements ensemble, en gardant le bord inférieur en place.
hud.MedicineHudX = Groupe potions X
hud.MedicineHudX.tip = Position horizontale du groupe de potions. -1 utilise la disposition automatique centrée en bas de l'écran. Réglable aussi en mode déplacement.
hud.MedicineHudY = Groupe potions Y
hud.MedicineHudY.tip = Position verticale du groupe de potions. -1 utilise la disposition automatique centrée en bas de l'écran. Réglable aussi en mode déplacement.
hud.UltHudX = Essence et Source obscure X
hud.UltHudX.tip = Position horizontale commune de l'Essence de Sha-Chi et de la Source obscure. -1 utilise la disposition automatique.
hud.UltHudY = Essence et Source obscure Y
hud.UltHudY.tip = Position verticale commune de l'Essence de Sha-Chi et de la Source obscure. -1 utilise la disposition automatique.
hud.Med1OffX = Potion 1 décalage horizontal
hud.Med1OffX.tip = Décalage horizontal de la première potion dans son groupe. En mode déplacement, faites-la glisser avec le clic droit pour la régler seule.
hud.Med1OffY = Potion 1 décalage vertical
hud.Med1OffY.tip = Décalage vertical de la première potion dans son groupe. En mode déplacement, faites-la glisser avec le clic droit pour la régler seule.
hud.Med2OffX = Potion 2 décalage horizontal
hud.Med2OffX.tip = Décalage horizontal de la deuxième potion dans son groupe. En mode déplacement, faites-la glisser avec le clic droit pour la régler seule.
hud.Med2OffY = Potion 2 décalage vertical
hud.Med2OffY.tip = Décalage vertical de la deuxième potion dans son groupe. En mode déplacement, faites-la glisser avec le clic droit pour la régler seule.
hud.Ult1OffX = Essence décalage horizontal
hud.Ult1OffX.tip = Décalage horizontal de l'icône d'Essence de Sha-Chi dans son groupe.
hud.Ult1OffY = Essence décalage vertical
hud.Ult1OffY.tip = Décalage vertical de l'icône d'Essence de Sha-Chi dans son groupe.
hud.Ult2OffX = Source obscure décalage horizontal
hud.Ult2OffX.tip = Décalage horizontal de l'icône de Source obscure dans son groupe.
hud.Ult2OffY = Source obscure décalage vertical
hud.Ult2OffY.tip = Décalage vertical de l'icône de Source obscure dans son groupe.

hud.Debug = Journal de débogage
hud.Debug.tip = Écrit des informations détaillées dans Scripts/PBZMoHUD.log. Joignez ce fichier pour signaler un problème.
hud.DragIcons = Déplacer les icônes
hud.DragIcons.tip = Masque temporairement le panneau. Clic gauche pour déplacer tout le groupe, clic droit pour une seule icône, clic molette pour rétablir les positions par défaut. Appuyez sur ESC pour revenir au panneau.
hud.DragIcons.run = Lancer le déplacement
hud.dragTip = Appuyez sur ESC pour quitter le mode déplacement
