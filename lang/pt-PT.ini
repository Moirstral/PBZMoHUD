hud.name = PBZMoHUD
hud.about = Arcos de HP e Sha-Chi ajustáveis individualmente para Phantom Blade Zero, com ícones de poções, Essência de Sha-Chi e Fonte Sombria. Apenas lê os valores do jogador, sem alterar os dados do jogo.
hud.group.preset = Predefinições
hud.group.behavior = Comportamento
hud.group.hpArc = Arco de HP
hud.group.qiArc = Arco de Sha-Chi
hud.group.look = Aspeto partilhado
hud.group.icons = Ícones
hud.group.native = Barras nativas
hud.group.advanced = Avançado

hud.Layout = Disposição
hud.Layout.tip = Escolha onde ficam os arcos de HP e de Sha-Chi.
hud.Layout.normal = Normal
hud.Layout.mirror = Espelhado
hud.Layout.ipsilateral = Mesmo lado

hud.FollowCharacter = Seguir a personagem
hud.FollowCharacter.tip = Os arcos acompanham a posição da personagem no ecrã. Desative para usar uma âncora fixa no ecrã.
hud.FollowSmoothing = Suavização do seguimento
hud.FollowSmoothing.tip = Tempo de suavização da posição ao seguir a personagem. Com 0, segue de imediato.
hud.FixedAnchorX = Âncora fixa X
hud.FixedAnchorX.tip = Posição horizontal da âncora, em fração da largura do ecrã, quando não segue a personagem. 0.5 é o centro.
hud.FixedAnchorY = Âncora fixa Y
hud.FixedAnchorY.tip = Posição vertical da âncora, em fração da altura do ecrã, quando não segue a personagem. 0.5 é o centro.
hud.AnchorHeight = Altura da âncora
hud.AnchorHeight.tip = Desvio de altura no mundo acima da origem da personagem (unidades do Unreal, cerca de 1 cm cada), não em píxeis do ecrã. Valores positivos sobem a âncora.
hud.AnchorOffsetX = Desvio horizontal geral
hud.AnchorOffsetX.tip = Move ambos os arcos na horizontal; valores positivos movem para a direita. Soma-se ao desvio próprio de cada arco.
hud.AnchorOffsetY = Desvio vertical geral
hud.AnchorOffsetY.tip = Move ambos os arcos na vertical; valores positivos movem para baixo. Soma-se ao desvio próprio de cada arco.
hud.Visibility = Visibilidade
hud.Visibility.tip = Segue a visibilidade da HUD do jogo ou oculta também cada arco que se mantenha cheio. Os ícones não são ocultados por valores cheios.
hud.Visibility.hud = Seguir a HUD do jogo
hud.Visibility.dynamic = Ocultar quando cheio
hud.HideDelay = Atraso ao ocultar cheio
hud.HideDelay.tip = Tempo que cada arco tem de ficar cheio antes de ser ocultado. Volta a aparecer quando o valor desce.

hud.HpArcEnabled = Mostrar arco de HP
hud.HpArcEnabled.tip = Mostra o arco de HP, sem afetar os ícones nem as barras nativas do jogo.
hud.HpArcSide = Lado do arco de HP
hud.HpArcSide.tip = Escolha o lado do arco antes da rotação. Ambos os arcos podem ficar no mesmo lado, separados pelo raio ou pelo desvio.
hud.HpArcSide.left = Esquerda
hud.HpArcSide.right = Direita
hud.HpRadius = Raio do arco de HP
hud.HpRadius.tip = Distância do arco de HP ao seu centro. Valores maiores tornam o arco mais largo.
hud.HpThickness = Espessura do arco de HP
hud.HpThickness.tip = Largura das pinceladas do arco de HP.
hud.HpArcSpan = Amplitude do arco de HP
hud.HpArcSpan.tip = Ângulo abrangido pelo arco de HP. Valores maiores tornam o arco mais comprido.
hud.HpSegments = Segmentos do arco de HP
hud.HpSegments.tip = Mais segmentos tornam o arco mais suave, mas exigem mais desempenho.
hud.HpRotation = Rotação do arco de HP
hud.HpRotation.tip = Roda todo o arco de HP em torno do centro, incluindo o rasto e a ponta do pincel. Valores positivos rodam no sentido dos ponteiros do relógio.
hud.HpFillDirection = Sentido de enchimento do HP
hud.HpFillDirection.tip = Normal segue a ordem predefinida dos segmentos do arco; Invertido usa a ordem oposta. A rotação não altera esta escolha.
hud.HpFillDirection.normal = Normal
hud.HpFillDirection.reverse = Invertido
hud.HpOffsetX = Desvio horizontal do HP
hud.HpOffsetX.tip = Move o arco de HP na horizontal após a rotação; valores positivos movem para a direita. Usa 1080p como referência e acompanha a escala da interface.
hud.HpOffsetY = Desvio vertical do HP
hud.HpOffsetY.tip = Move o arco de HP na vertical após a rotação; valores positivos movem para baixo. Usa 1080p como referência e acompanha a escala da interface.
hud.HpColor = Cor do HP
hud.HpColor.tip = Cor base do arco de HP. Prateado pálido por predefinição.
hud.HpTrackColor = Cor do fundo do HP
hud.HpTrackColor.tip = Cor da faixa de fundo por trás do arco de HP.
hud.HpWarnColor = Cor de aviso de HP baixo
hud.HpWarnColor.tip = Cor usada quando o HP desce abaixo do limiar de aviso.
hud.WarnThresholdHp = Limiar de HP baixo
hud.WarnThresholdHp.tip = Abaixo desta proporção de HP é usada a cor de aviso. A predefinição é 30%.
hud.HpBarOpacity = Opacidade do HP
hud.HpBarOpacity.tip = Opacidade da parte preenchida do arco de HP. Valores maiores tornam-no mais visível.
hud.HpTrackOpacity = Opacidade do fundo do HP
hud.HpTrackOpacity.tip = Opacidade da faixa de fundo do HP. Com 0 fica totalmente transparente.
hud.HpShowGhost = Mostrar rasto do HP
hud.HpShowGhost.tip = Deixa um rasto que vai recolhendo quando o HP desce, para ver melhor quanto se perdeu.
hud.HpGhostOpacity = Opacidade do rasto do HP
hud.HpGhostOpacity.tip = Opacidade do rasto deixado quando o HP desce.
hud.HpGhostColor = Cor do rasto do HP
hud.HpGhostColor.tip = Cor do rasto deixado quando o HP desce. Vermelho escuro por predefinição.
hud.HpShowTip = Mostrar ponta do pincel do HP
hud.HpShowTip.tip = Mostra uma ponta de pincel no fim do enchimento do HP. A ponta continua visível mesmo com o HP a zero.
hud.HpTipScale = Tamanho da ponta do HP
hud.HpTipScale.tip = Escala da ponta do pincel no fim do enchimento do HP.
hud.HpTipAngle = Ângulo da ponta do HP
hud.HpTipAngle.tip = Ângulo da ponta do pincel do HP em relação à tangente do arco.

hud.QiArcEnabled = Mostrar arco de Sha-Chi
hud.QiArcEnabled.tip = Mostra o arco de Sha-Chi, sem afetar os ícones nem as barras nativas do jogo.
hud.QiArcSide = Lado do arco de Sha-Chi
hud.QiArcSide.tip = Escolha o lado do arco antes da rotação. Ambos os arcos podem ficar no mesmo lado, separados pelo raio ou pelo desvio.
hud.QiArcSide.left = Esquerda
hud.QiArcSide.right = Direita
hud.QiRadius = Raio do arco de Sha-Chi
hud.QiRadius.tip = Distância do arco de Sha-Chi ao seu centro. Use raios diferentes para separar arcos no mesmo lado.
hud.QiThickness = Espessura do arco de Sha-Chi
hud.QiThickness.tip = Largura das pinceladas do arco de Sha-Chi.
hud.QiArcSpan = Amplitude do arco de Sha-Chi
hud.QiArcSpan.tip = Ângulo abrangido pelo arco de Sha-Chi. Valores maiores tornam o arco mais comprido.
hud.QiSegments = Segmentos do arco de Sha-Chi
hud.QiSegments.tip = Mais segmentos tornam o arco mais suave, mas exigem mais desempenho.
hud.QiRotation = Rotação do arco de Sha-Chi
hud.QiRotation.tip = Roda todo o arco de Sha-Chi em torno do centro, incluindo o rasto e a ponta do pincel. Valores positivos rodam no sentido dos ponteiros do relógio.
hud.QiFillDirection = Sentido de enchimento do Sha-Chi
hud.QiFillDirection.tip = Normal segue a ordem predefinida dos segmentos do arco; Invertido usa a ordem oposta. A rotação não altera esta escolha.
hud.QiFillDirection.normal = Normal
hud.QiFillDirection.reverse = Invertido
hud.QiOffsetX = Desvio horizontal do Sha-Chi
hud.QiOffsetX.tip = Move o arco de Sha-Chi na horizontal após a rotação; valores positivos movem para a direita. Usa 1080p como referência e acompanha a escala da interface.
hud.QiOffsetY = Desvio vertical do Sha-Chi
hud.QiOffsetY.tip = Move o arco de Sha-Chi na vertical após a rotação; valores positivos movem para baixo. Usa 1080p como referência e acompanha a escala da interface.
hud.QiColor = Cor do Sha-Chi
hud.QiColor.tip = Cor base do arco de Sha-Chi. Dourado por predefinição.
hud.QiTrackColor = Cor do fundo do Sha-Chi
hud.QiTrackColor.tip = Cor da faixa de fundo por trás do arco de Sha-Chi.
hud.QiWarnColor = Cor de aviso de Sha-Chi baixo
hud.QiWarnColor.tip = Cor usada abaixo do limiar de aviso do Sha-Chi. O aviso de quebra de guarda tem prioridade.
hud.WarnThresholdQi = Limiar de Sha-Chi baixo
hud.WarnThresholdQi.tip = Abaixo desta proporção de Sha-Chi é usada a cor de aviso. A predefinição é 25%.
hud.QiBarOpacity = Opacidade do Sha-Chi
hud.QiBarOpacity.tip = Opacidade da parte preenchida do arco de Sha-Chi. Valores maiores tornam-no mais visível.
hud.QiTrackOpacity = Opacidade do fundo do Sha-Chi
hud.QiTrackOpacity.tip = Opacidade da faixa de fundo do Sha-Chi. Com 0 fica totalmente transparente.
hud.QiShowGhost = Mostrar rasto do Sha-Chi
hud.QiShowGhost.tip = Deixa um rasto que vai recolhendo quando o Sha-Chi desce, para ver melhor quanto se perdeu.
hud.QiGhostOpacity = Opacidade do rasto do Sha-Chi
hud.QiGhostOpacity.tip = Opacidade do rasto deixado quando o Sha-Chi desce.
hud.QiGhostColor = Cor do rasto do Sha-Chi
hud.QiGhostColor.tip = Cor do rasto deixado quando o Sha-Chi desce. Dourado escuro por predefinição. Durante uma quebra de guarda usa a cor da quebra de guarda.
hud.QiShowTip = Mostrar ponta do pincel do Sha-Chi
hud.QiShowTip.tip = Mostra uma ponta de pincel no fim do enchimento do Sha-Chi. A ponta continua visível mesmo com o Sha-Chi a zero.
hud.QiTipScale = Tamanho da ponta do Sha-Chi
hud.QiTipScale.tip = Escala da ponta do pincel no fim do enchimento do Sha-Chi.
hud.QiTipAngle = Ângulo da ponta do Sha-Chi
hud.QiTipAngle.tip = Ângulo da ponta do pincel do Sha-Chi em relação à tangente do arco.
hud.BreakHint = Aviso de quebra de guarda
hud.BreakHint.tip = Muda a cor do arco de Sha-Chi enquanto a guarda da personagem está quebrada e repõe-na assim que recupera. Desative para não detetar quebras.
hud.QiBreakColor = Cor da quebra de guarda
hud.QiBreakColor.tip = Cor do arco de Sha-Chi durante uma quebra de guarda. Tem prioridade sobre a cor de aviso de Sha-Chi baixo.
hud.QiBreakTrackColor = Fundo na quebra de guarda
hud.QiBreakTrackColor.tip = Cor do fundo do arco de Sha-Chi durante uma quebra de guarda. Volta à cor de fundo quando a quebra termina.
hud.BreakDemo = Pré-visualizar quebra de guarda
hud.BreakDemo.tip = Oculta temporariamente o painel, esvazia o arco de Sha-Chi e mostra a cor de quebra de guarda durante 3 segundos; depois repõe tudo e reabre o painel. Não quebra realmente a guarda da personagem.
hud.BreakDemo.run = Iniciar demonstração

hud.BrushJitter = Tremor do pincel
hud.BrushJitter.tip = Variação aleatória das pinceladas de ambos os arcos. Com 0 as margens ficam mais limpas.
hud.StrokeOverlap = Sobreposição de pinceladas
hud.StrokeOverlap.tip = Comprimento de cada pincelada como múltiplo do comprimento do segmento. Aumente para cobrir as junções; diminua para destacar os segmentos.
hud.GhostSpeed = Tempo de recolha do rasto
hud.GhostSpeed.tip = Tempo de recolha do rasto de ambos os arcos. Valores menores alcançam mais depressa o valor atual.
hud.GhostDelay = Atraso de recolha do rasto
hud.GhostDelay.tip = Após uma perda, o rasto mantém-se durante este tempo antes de recolher, para ver quanto se perdeu. Golpes seguidos renovam a espera; 0 recolhe de imediato.
hud.WarnFlashSpeed = Velocidade do piscar
hud.WarnFlashSpeed.tip = Frequência do piscar nos avisos de HP e Sha-Chi baixos. Valores maiores piscam mais depressa.
hud.WarnFlashAmount = Intensidade do piscar
hud.WarnFlashAmount.tip = Variação de brilho durante os avisos de valor baixo. Com 0 não pisca.

hud.NativeBars = HUD nativa do jogo
hud.NativeBars.tip = Fixa o comprimento das barras de HP e Sha-Chi no canto inferior esquerdo, mantém-nas como estão ou oculta-as por completo. O comprimento fixo é reposto automaticamente quando o jogo recria as barras.
hud.NativeBars.pin = Comprimento fixo
hud.NativeBars.dynamic = Sem alterações
hud.NativeBars.hide = Ocultar barras
hud.HudBarWidth = Largura fixa das barras
hud.HudBarWidth.tip = -1 usa o comprimento inicial de cada barra no jogo. Uma largura personalizada tem de ser pelo menos 48, em unidades da interface do jogo. O comprimento fixo é reposto quando o jogo recria as barras.
hud.NativePinRecover = Repor comprimento fixo
hud.NativePinRecover.tip = Tenta repor o comprimento fixo se deixar de funcionar, normalmente em cerca de 1.5 segundos. Desative para apenas registar problemas, útil para diagnóstico. Funciona nos modos fixo e oculto.
hud.HudNumbers = Mostrar valores nas barras
hud.HudNumbers.tip = Mostra o valor atual e o máximo. Os números podem continuar visíveis com as barras nativas ocultas.
hud.HudNumberStyle = Estilo dos números
hud.HudNumberStyle.tip = Centrado mostra texto branco dentro de cada barra. Acima e abaixo coloca o HP por cima da barra e o Sha-Chi por baixo.
hud.HudNumberStyle.center = Centrado na barra
hud.HudNumberStyle.side = Acima e abaixo

hud.MedicineHud = Mostrar poções
hud.MedicineHud.tip = Mostra os ícones e quantidades das poções equipadas.
hud.PureIcon = Mostrar Essência de Sha-Chi
hud.PureIcon.tip = Mostra o ícone e a quantidade de Essência de Sha-Chi.
hud.BulletIcon = Mostrar Fonte Sombria
hud.BulletIcon.tip = Mostra o ícone e a quantidade de Fonte Sombria, partilhando a posição do grupo com a Essência de Sha-Chi.
hud.UltChargeBar = Mostrar carga da Essência
hud.UltChargeBar.tip = Preenche o ícone da Essência de Sha-Chi com o progresso da carga. Não afeta o ícone da Fonte Sombria.
hud.IconScale = Escala dos ícones
hud.IconScale.tip = Redimensiona ícones, números e espaçamento em conjunto, mantendo a margem inferior no lugar.
hud.MedicineHudX = Grupo de poções X
hud.MedicineHudX.tip = Posição horizontal do grupo de poções. -1 usa a disposição automática ao centro, na parte inferior do ecrã. Também pode ajustar no modo de arrastar.
hud.MedicineHudY = Grupo de poções Y
hud.MedicineHudY.tip = Posição vertical do grupo de poções. -1 usa a disposição automática ao centro, na parte inferior do ecrã. Também pode ajustar no modo de arrastar.
hud.UltHudX = Essência e Fonte Sombria X
hud.UltHudX.tip = Posição horizontal partilhada pela Essência de Sha-Chi e pela Fonte Sombria. -1 usa a disposição automática.
hud.UltHudY = Essência e Fonte Sombria Y
hud.UltHudY.tip = Posição vertical partilhada pela Essência de Sha-Chi e pela Fonte Sombria. -1 usa a disposição automática.
hud.Med1OffX = Desvio horizontal da poção 1
hud.Med1OffX.tip = Desvio horizontal da primeira poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para o ajustar individualmente.
hud.Med1OffY = Desvio vertical da poção 1
hud.Med1OffY.tip = Desvio vertical da primeira poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para o ajustar individualmente.
hud.Med2OffX = Desvio horizontal da poção 2
hud.Med2OffX.tip = Desvio horizontal da segunda poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para o ajustar individualmente.
hud.Med2OffY = Desvio vertical da poção 2
hud.Med2OffY.tip = Desvio vertical da segunda poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para o ajustar individualmente.
hud.Ult1OffX = Desvio horizontal da Essência
hud.Ult1OffX.tip = Desvio horizontal do ícone da Essência de Sha-Chi dentro do grupo.
hud.Ult1OffY = Desvio vertical da Essência
hud.Ult1OffY.tip = Desvio vertical do ícone da Essência de Sha-Chi dentro do grupo.
hud.Ult2OffX = Desvio horizontal da Fonte Sombria
hud.Ult2OffX.tip = Desvio horizontal do ícone da Fonte Sombria dentro do grupo.
hud.Ult2OffY = Desvio vertical da Fonte Sombria
hud.Ult2OffY.tip = Desvio vertical do ícone da Fonte Sombria dentro do grupo.

hud.Debug = Registo de depuração
hud.Debug.tip = Grava informações detalhadas de execução em Scripts/PBZMoHUD.log. Inclua este ficheiro ao comunicar um problema.
hud.DragIcons = Arrastar ícones
hud.DragIcons.tip = Oculta temporariamente o painel de definições. Arrastar com o botão esquerdo move o grupo inteiro, com o botão direito move um só ícone, e o botão do meio repõe as posições predefinidas. Prima ESC para voltar ao painel.
hud.DragIcons.run = Começar a arrastar
hud.dragTip = Prima ESC para sair do modo de arrastar
