hud.name = PBZMoHUD
hud.about = Arcos de HP e Sha-Chi ajustáveis separadamente para Phantom Blade Zero, com ícones de poções, Essência de Sha-Chi e Fonte Sombria. Lê os valores do jogador sem alterar os dados do jogo.
hud.group.preset = Predefinições
hud.group.behavior = Comportamento
hud.group.hpArc = Arco de HP
hud.group.qiArc = Arco de Sha-Chi
hud.group.look = Aparência compartilhada
hud.group.icons = Ícones
hud.group.native = HUD nativo
hud.group.advanced = Avançado

hud.Layout = Disposição
hud.Layout.tip = Escolha onde ficam os arcos de HP e Sha-Chi.
hud.Layout.normal = Normal
hud.Layout.mirror = Espelhado
hud.Layout.ipsilateral = Mesmo lado

hud.FollowCharacter = Seguir personagem
hud.FollowCharacter.tip = Os arcos acompanham a posição do personagem na tela. Desative para usar uma âncora fixa.
hud.FollowSmoothing = Suavização do seguimento
hud.FollowSmoothing.tip = Tempo de suavização da posição ao seguir o personagem. Use 0 para seguir na hora.
hud.FixedAnchorX = Âncora fixa X
hud.FixedAnchorX.tip = Posição horizontal da âncora como fração da largura da tela, quando não segue o personagem. 0.5 é o centro.
hud.FixedAnchorY = Âncora fixa Y
hud.FixedAnchorY.tip = Posição vertical da âncora como fração da altura da tela, quando não segue o personagem. 0.5 é o centro.
hud.AnchorHeight = Altura da âncora
hud.AnchorHeight.tip = Deslocamento de altura acima da origem do personagem, em unidades do mundo Unreal (cerca de 1 cm cada), não em pixels. Valores positivos elevam a âncora.
hud.AnchorOffsetX = Deslocamento horizontal geral
hud.AnchorOffsetX.tip = Move os dois arcos na horizontal; valores positivos vão para a direita. Soma-se ao deslocamento próprio de cada arco.
hud.AnchorOffsetY = Deslocamento vertical geral
hud.AnchorOffsetY.tip = Move os dois arcos na vertical; valores positivos vão para baixo. Soma-se ao deslocamento próprio de cada arco.
hud.Visibility = Exibição
hud.Visibility.tip = Segue a visibilidade do HUD do jogo ou também oculta cada arco que ficar cheio. Valores cheios não ocultam os ícones.
hud.Visibility.hud = Seguir HUD do jogo
hud.Visibility.dynamic = Ocultar quando cheio
hud.HideDelay = Atraso para ocultar
hud.HideDelay.tip = Quanto tempo cada arco precisa ficar cheio antes de sumir. Ele volta quando o valor cai.

hud.HpArcEnabled = Mostrar arco de HP
hud.HpArcEnabled.tip = Mostra o arco de HP sem afetar os ícones nem as barras nativas do jogo.
hud.HpArcSide = Lado do arco de HP
hud.HpArcSide.tip = Lado do arco antes da rotação. Os dois arcos podem ficar no mesmo lado; separe-os pelo raio ou deslocamento.
hud.HpArcSide.left = Esquerda
hud.HpArcSide.right = Direita
hud.HpRadius = Raio do arco de HP
hud.HpRadius.tip = Distância do arco de HP até o centro. Valores maiores deixam o arco mais largo.
hud.HpThickness = Espessura do arco de HP
hud.HpThickness.tip = Largura das pinceladas do arco de HP.
hud.HpArcSpan = Extensão do arco de HP
hud.HpArcSpan.tip = Ângulo coberto pelo arco de HP. Valores maiores deixam o arco mais longo.
hud.HpSegments = Segmentos do arco de HP
hud.HpSegments.tip = Mais segmentos deixam o arco mais suave, mas exigem mais desempenho.
hud.HpRotation = Rotação do arco de HP
hud.HpRotation.tip = Gira todo o arco de HP em torno do centro, junto com o rastro e a ponta do pincel. Valores positivos giram no sentido horário.
hud.HpFillDirection = Sentido de preenchimento HP
hud.HpFillDirection.tip = Normal segue a ordem padrão dos segmentos do arco; Invertido usa a ordem oposta. A rotação não altera essa escolha.
hud.HpFillDirection.normal = Normal
hud.HpFillDirection.reverse = Invertido
hud.HpOffsetX = Deslocamento horizontal HP
hud.HpOffsetX.tip = Move o arco de HP na horizontal após a rotação; valores positivos vão para a direita. Usa 1080p como base e acompanha a escala da interface.
hud.HpOffsetY = Deslocamento vertical HP
hud.HpOffsetY.tip = Move o arco de HP na vertical após a rotação; valores positivos vão para baixo. Usa 1080p como base e acompanha a escala da interface.
hud.HpColor = Cor do HP
hud.HpColor.tip = Cor base do arco de HP. Prata clara por padrão.
hud.HpTrackColor = Cor do fundo HP
hud.HpTrackColor.tip = Cor do trilho de fundo atrás do arco de HP.
hud.HpWarnColor = Cor de alerta HP baixo
hud.HpWarnColor.tip = Cor usada quando o HP fica abaixo do limite de alerta.
hud.WarnThresholdHp = Limite de HP baixo
hud.WarnThresholdHp.tip = Usa a cor de alerta abaixo desta proporção de HP. O padrão é 30%.
hud.HpBarOpacity = Opacidade do HP
hud.HpBarOpacity.tip = Opacidade da parte preenchida do arco de HP. Valores maiores deixam o arco mais visível.
hud.HpTrackOpacity = Opacidade do fundo HP
hud.HpTrackOpacity.tip = Opacidade do trilho de fundo do HP. Use 0 para transparência total.
hud.HpShowGhost = Mostrar rastro de HP
hud.HpShowGhost.tip = Deixa um rastro que vai encolhendo quando o HP cai, para facilitar ver quanto foi perdido.
hud.HpGhostOpacity = Opacidade do rastro de HP
hud.HpGhostOpacity.tip = Opacidade do rastro deixado quando o HP cai.
hud.HpGhostColor = Cor do rastro de HP
hud.HpGhostColor.tip = Cor do rastro deixado quando o HP cai. Vermelho escuro por padrão.
hud.HpVirtualColor = Cor do dano pendente de HP
hud.HpVirtualColor.tip = Dano adiado que ainda não foi descontado, mostrado no fim do preenchimento de HP. Vermelho-sangue por padrão.
hud.HpShowTip = Ponta do pincel do HP
hud.HpShowTip.tip = Mostra a ponta do pincel no fim do preenchimento de HP. A ponta continua visível mesmo com 0 HP.
hud.HpTipScale = Tamanho da ponta do HP
hud.HpTipScale.tip = Escala da ponta do pincel no fim do preenchimento de HP.
hud.HpTipAngle = Ângulo da ponta do HP
hud.HpTipAngle.tip = Ângulo da ponta do pincel do HP em relação à tangente do arco.

hud.QiArcEnabled = Mostrar arco de Sha-Chi
hud.QiArcEnabled.tip = Mostra o arco de Sha-Chi sem afetar os ícones nem as barras nativas do jogo.
hud.QiArcSide = Lado do arco de Sha-Chi
hud.QiArcSide.tip = Lado do arco antes da rotação. Os dois arcos podem ficar no mesmo lado; separe-os pelo raio ou deslocamento.
hud.QiArcSide.left = Esquerda
hud.QiArcSide.right = Direita
hud.QiRadius = Raio do arco de Sha-Chi
hud.QiRadius.tip = Distância do arco de Sha-Chi até o centro. Use raios diferentes para separar arcos no mesmo lado.
hud.QiThickness = Espessura do arco de Sha-Chi
hud.QiThickness.tip = Largura das pinceladas do arco de Sha-Chi.
hud.QiArcSpan = Extensão do arco de Sha-Chi
hud.QiArcSpan.tip = Ângulo coberto pelo arco de Sha-Chi. Valores maiores deixam o arco mais longo.
hud.QiSegments = Segmentos do arco de Sha-Chi
hud.QiSegments.tip = Mais segmentos deixam o arco mais suave, mas exigem mais desempenho.
hud.QiRotation = Rotação do arco de Sha-Chi
hud.QiRotation.tip = Gira todo o arco de Sha-Chi em torno do centro, junto com o rastro e a ponta do pincel. Valores positivos giram no sentido horário.
hud.QiFillDirection = Sentido de preenchimento Sha-Chi
hud.QiFillDirection.tip = Normal segue a ordem padrão dos segmentos do arco; Invertido usa a ordem oposta. A rotação não altera essa escolha.
hud.QiFillDirection.normal = Normal
hud.QiFillDirection.reverse = Invertido
hud.QiOffsetX = Deslocamento horizontal Sha-Chi
hud.QiOffsetX.tip = Move o arco de Sha-Chi na horizontal após a rotação; valores positivos vão para a direita. Usa 1080p como base e acompanha a escala da interface.
hud.QiOffsetY = Deslocamento vertical Sha-Chi
hud.QiOffsetY.tip = Move o arco de Sha-Chi na vertical após a rotação; valores positivos vão para baixo. Usa 1080p como base e acompanha a escala da interface.
hud.QiColor = Cor do Sha-Chi
hud.QiColor.tip = Cor base do arco de Sha-Chi. Dourado por padrão.
hud.QiTrackColor = Cor do fundo Sha-Chi
hud.QiTrackColor.tip = Cor do trilho de fundo atrás do arco de Sha-Chi.
hud.QiWarnColor = Cor de alerta Sha-Chi baixo
hud.QiWarnColor.tip = Cor usada abaixo do limite de alerta de Sha-Chi. O aviso de quebra de guarda tem prioridade.
hud.WarnThresholdQi = Limite de Sha-Chi baixo
hud.WarnThresholdQi.tip = Usa a cor de alerta abaixo desta proporção de Sha-Chi. O padrão é 25%.
hud.QiBarOpacity = Opacidade do Sha-Chi
hud.QiBarOpacity.tip = Opacidade da parte preenchida do arco de Sha-Chi. Valores maiores deixam o arco mais visível.
hud.QiTrackOpacity = Opacidade do fundo Sha-Chi
hud.QiTrackOpacity.tip = Opacidade do trilho de fundo do Sha-Chi. Use 0 para transparência total.
hud.QiShowGhost = Mostrar rastro de Sha-Chi
hud.QiShowGhost.tip = Deixa um rastro que vai encolhendo quando o Sha-Chi cai, para facilitar ver quanto foi perdido.
hud.QiGhostOpacity = Opacidade do rastro de Sha-Chi
hud.QiGhostOpacity.tip = Opacidade do rastro deixado quando o Sha-Chi cai.
hud.QiGhostColor = Cor do rastro de Sha-Chi
hud.QiGhostColor.tip = Cor do rastro deixado quando o Sha-Chi cai. Dourado escuro por padrão. Durante a quebra de guarda usa a cor da quebra de guarda.
hud.QiShowTip = Ponta do pincel do Sha-Chi
hud.QiShowTip.tip = Mostra a ponta do pincel no fim do preenchimento de Sha-Chi. A ponta continua visível mesmo com 0 de Sha-Chi.
hud.QiTipScale = Tamanho da ponta do Sha-Chi
hud.QiTipScale.tip = Escala da ponta do pincel no fim do preenchimento de Sha-Chi.
hud.QiTipAngle = Ângulo da ponta do Sha-Chi
hud.QiTipAngle.tip = Ângulo da ponta do pincel do Sha-Chi em relação à tangente do arco.
hud.BreakHint = Aviso de quebra de guarda
hud.BreakHint.tip = Muda a cor do arco de Sha-Chi enquanto a guarda do personagem estiver quebrada e restaura ao se recuperar. Desative para não detectar a quebra.
hud.QiBreakColor = Cor da quebra de guarda
hud.QiBreakColor.tip = Cor do arco de Sha-Chi durante a quebra de guarda. Tem prioridade sobre a cor de alerta de Sha-Chi baixo.
hud.QiBreakTrackColor = Fundo da quebra de guarda
hud.QiBreakTrackColor.tip = Cor do trilho de fundo do Sha-Chi durante a quebra de guarda. Volta à cor de fundo quando a quebra termina.
hud.BreakDemo = Prévia da quebra de guarda
hud.BreakDemo.tip = Oculta o painel, esvazia o arco de Sha-Chi e mostra a cor da quebra de guarda por 3 segundos; depois tudo volta e o painel reabre. A guarda do personagem não é quebrada de verdade.
hud.BreakDemo.run = Iniciar prévia

hud.BrushJitter = Tremor do pincel
hud.BrushJitter.tip = Variação aleatória nas pinceladas dos dois arcos. Use 0 para bordas mais limpas.
hud.StrokeOverlap = Sobreposição das pinceladas
hud.StrokeOverlap.tip = Comprimento da pincelada como múltiplo do comprimento do segmento. Aumente para cobrir emendas; reduza para destacar os segmentos.
hud.GhostSpeed = Tempo de recolhimento
hud.GhostSpeed.tip = Tempo para o rastro dos dois arcos se recolher. Valores menores alcançam o valor atual mais rápido.
hud.GhostDelay = Atraso do recolhimento
hud.GhostDelay.tip = Após uma perda, o rastro fica parado por este tempo antes de se recolher, para mostrar quanto foi perdido. Golpes seguidos renovam a espera; 0 recolhe na hora.
hud.WarnFlashSpeed = Velocidade do piscar
hud.WarnFlashSpeed.tip = Frequência do piscar nos alertas de HP e Sha-Chi baixos. Valores maiores piscam mais rápido.
hud.WarnFlashAmount = Intensidade do piscar
hud.WarnFlashAmount.tip = Variação de brilho durante os alertas de valor baixo. Use 0 para não piscar.

hud.ToggleNativeHudKey = Tecla de visibilidade do HUD nativo
hud.ToggleNativeHudKey.tip = Alterna a opção de ocultar o HUD nativo, com as mesmas regras para os valores numéricos. Sem atribuição por padrão. Inativa durante a configuração ou ao arrastar; as alterações não são salvas automaticamente.
hud.HideNativeHud = Ocultar HUD nativo
hud.HideNativeHud.tip = Oculta poções, barras de vida e Sha-Chi e armas do HUD nativo, exceto as barras de vida dos chefes. Ao ativar, desliga os números de vida e Sha-Chi, que podem ser reativados manualmente. Desativar esta opção reativa esses números.
hud.NativeBars = HUD nativo do jogo
hud.NativeBars.tip = Fixa o comprimento das barras de HP e Sha-Chi do jogo (canto inferior esquerdo), mantém como estão ou oculta por completo. O comprimento fixo é restaurado quando o jogo recria as barras.
hud.NativeBars.pin = Comprimento fixo
hud.NativeBars.dynamic = Sem alteração
hud.NativeBars.hide = Ocultar barras
hud.HudBarWidth = Largura fixa das barras
hud.HudBarWidth.tip = -1 usa o comprimento inicial de cada barra. Uma largura personalizada deve ser no mínimo 48, em unidades da interface do jogo. É restaurada quando o jogo recria as barras.
hud.NativePinRecover = Restaurar comprimento fixo
hud.NativePinRecover.tip = Tenta restaurar o comprimento fixo se ele deixar de funcionar, em geral em cerca de 1.5 s. Desative para só registrar problemas, útil para diagnóstico. Funciona nos modos fixo e oculto.
hud.HudNumbers = Valores nas barras
hud.HudNumbers.tip = Mostra os valores atual e máximo, mesmo com as barras nativas ocultas.
hud.HudNumberStyle = Estilo dos valores
hud.HudNumberStyle.tip = Centralizado mostra texto branco dentro de cada barra. Acima e abaixo põe o HP acima da barra e o Sha-Chi abaixo da dele.
hud.HudNumberStyle.center = Centralizado na barra
hud.HudNumberStyle.side = Acima e abaixo
hud.HideNativeMedicine = Ocultar poções do HUD nativo
hud.HideNativeMedicine.tip = Oculta a área de poções do HUD nativo do jogo sem afetar os ícones deste mod.
hud.HideNativeMainWeapon = Ocultar arma do HUD nativo
hud.HideNativeMainWeapon.tip = Oculta a área da arma do HUD nativo do jogo sem afetar os ícones deste mod.
hud.HideNativePhantomEdges = Ocultar ARMAS-FANTASMA do HUD nativo
hud.HideNativePhantomEdges.tip = Oculta a área de ARMAS-FANTASMA do HUD nativo do jogo sem afetar os ícones deste mod.

hud.MedicineHud = Mostrar poções
hud.MedicineHud.tip = Mostra os ícones e a quantidade das poções equipadas.
hud.PureIcon = Mostrar Essência de Sha-Chi
hud.PureIcon.tip = Mostra o ícone e a quantidade de Essência de Sha-Chi.
hud.MainWeaponIcon = Mostrar arma
hud.MainWeaponIcon.tip = Substitui o ícone da Essência de Sha-Chi pelo da arma atual. Desative esta opção para restaurar o ícone original.
hud.BulletIcon = Mostrar Fonte Sombria
hud.BulletIcon.tip = Mostra o ícone e a quantidade de Fonte Sombria, na mesma posição de grupo da Essência de Sha-Chi.
hud.PhantomEdgesIcon = Mostrar ARMAS-FANTASMA
hud.PhantomEdgesIcon.tip = Substitui o ícone da Fonte Sombria pelo das ARMAS-FANTASMA atuais. Desative esta opção para restaurar o ícone original.
hud.UltChargeBar = Carga da Essência
hud.UltChargeBar.tip = Ilumina de baixo para cima o ícone da Essência de Sha-Chi (ou o ícone da arma que o substitui) conforme o progresso da carga. Não afeta a Fonte Sombria nem seu ícone de arma.
hud.WeaponCooldown = Recarga da troca de arma
hud.WeaponCooldown.tip = Exibe um anel de recarga ao trocar de arma e o oculta ao terminar. Nas configurações, a prévia se repete a cada 3 segundos. No modo de arrastar, o anel aparece completo e pode ser movido separadamente com o botão esquerdo ou direito.
hud.WeaponCooldownX = Anel de recarga X
hud.WeaponCooldownX.tip = Coordenada X do canto superior esquerdo. -1 segue o ponto médio interno do arco de Sha-Chi. Arrastar define uma posição fixa.
hud.WeaponCooldownY = Anel de recarga Y
hud.WeaponCooldownY.tip = Coordenada Y do canto superior esquerdo. -1 segue o ponto médio interno do arco de Sha-Chi. O clique do meio restaura as posições padrão.
hud.IconScale = Escala dos ícones
hud.IconScale.tip = Ajusta a escala de ícones, números e espaçamento juntos, mantendo a borda inferior no lugar.
hud.MedicineHudX = Grupo de poções X
hud.MedicineHudX.tip = Posição horizontal do grupo de poções. -1 usa o layout automático centralizado na parte inferior da tela. Também pode ser ajustado no modo de arrastar.
hud.MedicineHudY = Grupo de poções Y
hud.MedicineHudY.tip = Posição vertical do grupo de poções. -1 usa o layout automático centralizado na parte inferior da tela. Também pode ser ajustado no modo de arrastar.
hud.UltHudX = Essência e Fonte Sombria X
hud.UltHudX.tip = Posição horizontal compartilhada da Essência de Sha-Chi e da Fonte Sombria. -1 usa o layout automático.
hud.UltHudY = Essência e Fonte Sombria Y
hud.UltHudY.tip = Posição vertical compartilhada da Essência de Sha-Chi e da Fonte Sombria. -1 usa o layout automático.
hud.Med1OffX = Deslocamento horizontal poção 1
hud.Med1OffX.tip = Deslocamento horizontal da primeira poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para ajustá-lo sozinho.
hud.Med1OffY = Deslocamento vertical poção 1
hud.Med1OffY.tip = Deslocamento vertical da primeira poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para ajustá-lo sozinho.
hud.Med2OffX = Deslocamento horizontal poção 2
hud.Med2OffX.tip = Deslocamento horizontal da segunda poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para ajustá-lo sozinho.
hud.Med2OffY = Deslocamento vertical poção 2
hud.Med2OffY.tip = Deslocamento vertical da segunda poção dentro do grupo. No modo de arrastar, arraste o ícone com o botão direito para ajustá-lo sozinho.
hud.Ult1OffX = Deslocamento horizontal Essência
hud.Ult1OffX.tip = Deslocamento horizontal do ícone da Essência de Sha-Chi dentro do grupo.
hud.Ult1OffY = Deslocamento vertical Essência
hud.Ult1OffY.tip = Deslocamento vertical do ícone da Essência de Sha-Chi dentro do grupo.
hud.Ult2OffX = Deslocamento horizontal Fonte Sombria
hud.Ult2OffX.tip = Deslocamento horizontal do ícone da Fonte Sombria dentro do grupo.
hud.Ult2OffY = Deslocamento vertical Fonte Sombria
hud.Ult2OffY.tip = Deslocamento vertical do ícone da Fonte Sombria dentro do grupo.

hud.Debug = Log de depuração
hud.Debug.tip = Grava informações detalhadas de execução em Scripts/PBZMoHUD.log. Envie este arquivo ao relatar um problema.
hud.DragIcons = Arrastar ícones
hud.DragIcons.tip = Oculta o painel temporariamente. Botão esquerdo arrasta o grupo todo, botão direito arrasta um único ícone e o botão do meio restaura as posições padrão. Pressione ESC para voltar ao painel.
hud.DragIcons.run = Começar a arrastar
hud.dragTip = Pressione ESC para sair do modo de arrastar
