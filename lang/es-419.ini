hud.name = PBZMoHUD
hud.about = Arcos de HP y Sha-Chi ajustables por separado para Phantom Blade Zero, con íconos de pociones, Esencia de Sha-Chi y Fuente Oscura. Solo lee los valores del jugador, sin cambiar datos del juego.
hud.group.preset = Preajustes
hud.group.behavior = Comportamiento
hud.group.hpArc = Arco de HP
hud.group.qiArc = Arco de Sha-Chi
hud.group.look = Apariencia compartida
hud.group.icons = Íconos
hud.group.native = HUD nativo
hud.group.advanced = Avanzado

hud.Layout = Disposición
hud.Layout.tip = Elige dónde se colocan los arcos de HP y Sha-Chi.
hud.Layout.normal = Normal
hud.Layout.mirror = Espejo
hud.Layout.ipsilateral = Mismo lado

hud.FollowCharacter = Seguir al personaje
hud.FollowCharacter.tip = Los arcos siguen la posición del personaje en pantalla. Desactívalo para usar un ancla fija en pantalla.
hud.FollowSmoothing = Suavizado de seguimiento
hud.FollowSmoothing.tip = Tiempo de suavizado de la posición al seguir al personaje. Con 0 lo sigue al instante.
hud.FixedAnchorX = Ancla fija X
hud.FixedAnchorX.tip = Posición horizontal del ancla como fracción del ancho de pantalla cuando no sigue al personaje. 0.5 es el centro.
hud.FixedAnchorY = Ancla fija Y
hud.FixedAnchorY.tip = Posición vertical del ancla como fracción del alto de pantalla cuando no sigue al personaje. 0.5 es el centro.
hud.AnchorHeight = Altura del ancla
hud.AnchorHeight.tip = Desplazamiento de altura sobre el origen del personaje en el mundo (unidades de Unreal, aprox. 1 cm cada una), no en píxeles de pantalla. Los valores positivos lo elevan.
hud.AnchorOffsetX = Desplazamiento horizontal general
hud.AnchorOffsetX.tip = Mueve ambos arcos en horizontal. Los valores positivos los mueven a la derecha; se suma al desplazamiento propio de cada arco.
hud.AnchorOffsetY = Desplazamiento vertical general
hud.AnchorOffsetY.tip = Mueve ambos arcos en vertical. Los valores positivos los mueven hacia abajo; se suma al desplazamiento propio de cada arco.
hud.Visibility = Cuándo mostrar
hud.Visibility.tip = Sigue la visibilidad del HUD del juego o, además, oculta cada arco cuando se mantiene lleno. Los valores llenos no ocultan los íconos.
hud.Visibility.hud = Según el HUD del juego
hud.Visibility.dynamic = Ocultar al estar lleno
hud.HideDelay = Demora para ocultar
hud.HideDelay.tip = Tiempo que cada arco debe seguir lleno antes de ocultarse. Vuelve a aparecer cuando el valor baja.

hud.HpArcEnabled = Mostrar arco de HP
hud.HpArcEnabled.tip = Muestra el arco de HP sin afectar los íconos ni las barras nativas del juego.
hud.HpArcSide = Lado del arco de HP
hud.HpArcSide.tip = Elige el lado del arco antes de rotarlo. Ambos arcos pueden compartir lado; sepáralos con el radio o el desplazamiento.
hud.HpArcSide.left = Izquierda
hud.HpArcSide.right = Derecha
hud.HpRadius = Radio del arco de HP
hud.HpRadius.tip = Distancia del arco de HP a su centro. Con valores mayores el arco se vuelve más ancho.
hud.HpThickness = Grosor del arco de HP
hud.HpThickness.tip = Ancho de los trazos de pincel del arco de HP.
hud.HpArcSpan = Extensión del arco de HP
hud.HpArcSpan.tip = Ángulo que cubre el arco de HP. Con valores mayores el arco es más largo.
hud.HpSegments = Segmentos del arco de HP
hud.HpSegments.tip = Más segmentos dan un arco más suave, pero afectan más el rendimiento.
hud.HpRotation = Rotación del arco de HP
hud.HpRotation.tip = Rota todo el arco de HP alrededor de su centro, incluidas su estela y su punta de pincel. Los valores positivos rotan en sentido horario.
hud.HpFillDirection = Dirección de llenado de HP
hud.HpFillDirection.tip = Normal sigue el orden predeterminado de los segmentos del arco; Invertido usa el orden opuesto. La rotación no cambia esta elección.
hud.HpFillDirection.normal = Normal
hud.HpFillDirection.reverse = Invertido
hud.HpOffsetX = Desplazamiento horizontal de HP
hud.HpOffsetX.tip = Mueve el arco de HP en horizontal después de rotarlo. Los valores positivos lo mueven a la derecha. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.HpOffsetY = Desplazamiento vertical de HP
hud.HpOffsetY.tip = Mueve el arco de HP en vertical después de rotarlo. Los valores positivos lo mueven hacia abajo. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.HpColor = Color de HP
hud.HpColor.tip = Color base del arco de HP. Plateado pálido de forma predeterminada.
hud.HpTrackColor = Color de fondo de HP
hud.HpTrackColor.tip = Color del fondo que queda detrás del arco de HP.
hud.HpWarnColor = Color de alerta de HP bajo
hud.HpWarnColor.tip = Color que se usa cuando el HP baja del umbral de alerta.
hud.WarnThresholdHp = Umbral de HP bajo
hud.WarnThresholdHp.tip = Usa el color de alerta por debajo de esta proporción de HP. El valor predeterminado es 30%.
hud.HpBarOpacity = Opacidad del relleno de HP
hud.HpBarOpacity.tip = Opacidad de la parte llena del arco de HP. Los valores más altos lo hacen más visible.
hud.HpTrackOpacity = Opacidad del fondo de HP
hud.HpTrackOpacity.tip = Opacidad del fondo del arco de HP. Con 0 es totalmente transparente.
hud.HpShowGhost = Mostrar estela de HP
hud.HpShowGhost.tip = Deja una estela que se va reduciendo cuando baja el HP, para ver mejor cuánto se perdió.
hud.HpGhostOpacity = Opacidad de la estela de HP
hud.HpGhostOpacity.tip = Opacidad de la estela que queda cuando baja el HP.
hud.HpGhostColor = Color de la estela de HP
hud.HpGhostColor.tip = Color de la estela que queda cuando baja el HP. Rojo oscuro de forma predeterminada.
hud.HpVirtualColor = Color del daño pendiente de HP
hud.HpVirtualColor.tip = Daño diferido que todavía no se descuenta; se muestra al final del relleno de HP. Rojo sangre de forma predeterminada.
hud.HpShowTip = Mostrar punta de pincel de HP
hud.HpShowTip.tip = Muestra una punta de pincel al final del relleno de HP. La punta sigue visible aunque el HP llegue a cero.
hud.HpTipScale = Tamaño de la punta de HP
hud.HpTipScale.tip = Escala de la punta de pincel al final del relleno de HP.
hud.HpTipAngle = Ángulo de la punta de HP
hud.HpTipAngle.tip = Ángulo de la punta de pincel de HP respecto a la tangente del arco.

hud.QiArcEnabled = Mostrar arco de Sha-Chi
hud.QiArcEnabled.tip = Muestra el arco de Sha-Chi sin afectar los íconos ni las barras nativas del juego.
hud.QiArcSide = Lado del arco de Sha-Chi
hud.QiArcSide.tip = Elige el lado del arco antes de rotarlo. Ambos arcos pueden compartir lado; sepáralos con el radio o el desplazamiento.
hud.QiArcSide.left = Izquierda
hud.QiArcSide.right = Derecha
hud.QiRadius = Radio del arco de Sha-Chi
hud.QiRadius.tip = Distancia del arco de Sha-Chi a su centro. Usa radios distintos para separar arcos del mismo lado.
hud.QiThickness = Grosor del arco de Sha-Chi
hud.QiThickness.tip = Ancho de los trazos de pincel del arco de Sha-Chi.
hud.QiArcSpan = Extensión del arco de Sha-Chi
hud.QiArcSpan.tip = Ángulo que cubre el arco de Sha-Chi. Con valores mayores el arco es más largo.
hud.QiSegments = Segmentos del arco de Sha-Chi
hud.QiSegments.tip = Más segmentos dan un arco más suave, pero afectan más el rendimiento.
hud.QiRotation = Rotación del arco de Sha-Chi
hud.QiRotation.tip = Rota todo el arco de Sha-Chi alrededor de su centro, incluidas su estela y su punta de pincel. Los valores positivos rotan en sentido horario.
hud.QiFillDirection = Dirección de llenado de Sha-Chi
hud.QiFillDirection.tip = Normal sigue el orden predeterminado de los segmentos del arco; Invertido usa el orden opuesto. La rotación no cambia esta elección.
hud.QiFillDirection.normal = Normal
hud.QiFillDirection.reverse = Invertido
hud.QiOffsetX = Desplazamiento horizontal de Sha-Chi
hud.QiOffsetX.tip = Mueve el arco de Sha-Chi en horizontal después de rotarlo. Los valores positivos lo mueven a la derecha. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.QiOffsetY = Desplazamiento vertical de Sha-Chi
hud.QiOffsetY.tip = Mueve el arco de Sha-Chi en vertical después de rotarlo. Los valores positivos lo mueven hacia abajo. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.QiColor = Color de Sha-Chi
hud.QiColor.tip = Color base del arco de Sha-Chi. Dorado de forma predeterminada.
hud.QiTrackColor = Color de fondo de Sha-Chi
hud.QiTrackColor.tip = Color del fondo que queda detrás del arco de Sha-Chi.
hud.QiWarnColor = Color de alerta de Sha-Chi bajo
hud.QiWarnColor.tip = Color que se usa por debajo del umbral de alerta de Sha-Chi. El aviso de ruptura de guardia tiene prioridad.
hud.WarnThresholdQi = Umbral de Sha-Chi bajo
hud.WarnThresholdQi.tip = Usa el color de alerta por debajo de esta proporción de Sha-Chi. El valor predeterminado es 25%.
hud.QiBarOpacity = Opacidad del relleno de Sha-Chi
hud.QiBarOpacity.tip = Opacidad de la parte llena del arco de Sha-Chi. Los valores más altos lo hacen más visible.
hud.QiTrackOpacity = Opacidad del fondo de Sha-Chi
hud.QiTrackOpacity.tip = Opacidad del fondo del arco de Sha-Chi. Con 0 es totalmente transparente.
hud.QiShowGhost = Mostrar estela de Sha-Chi
hud.QiShowGhost.tip = Deja una estela que se va reduciendo cuando baja el Sha-Chi, para ver mejor cuánto se perdió.
hud.QiGhostOpacity = Opacidad de la estela de Sha-Chi
hud.QiGhostOpacity.tip = Opacidad de la estela que queda cuando baja el Sha-Chi.
hud.QiGhostColor = Color de la estela de Sha-Chi
hud.QiGhostColor.tip = Color de la estela que queda cuando baja el Sha-Chi. Dorado oscuro de forma predeterminada. Durante una ruptura de guardia usa el color de ruptura de guardia.
hud.QiShowTip = Mostrar punta de pincel de Sha-Chi
hud.QiShowTip.tip = Muestra una punta de pincel al final del relleno de Sha-Chi. La punta sigue visible aunque el Sha-Chi llegue a cero.
hud.QiTipScale = Tamaño de la punta de Sha-Chi
hud.QiTipScale.tip = Escala de la punta de pincel al final del relleno de Sha-Chi.
hud.QiTipAngle = Ángulo de la punta de Sha-Chi
hud.QiTipAngle.tip = Ángulo de la punta de pincel de Sha-Chi respecto a la tangente del arco.
hud.BreakHint = Aviso de ruptura de guardia
hud.BreakHint.tip = Cambia el color del arco de Sha-Chi mientras la guardia del personaje está rota y lo restaura en cuanto se recupera. Desactívalo para no detectar la ruptura.
hud.QiBreakColor = Color de ruptura de guardia
hud.QiBreakColor.tip = Color del arco de Sha-Chi durante una ruptura de guardia. Tiene prioridad sobre el color de alerta de Sha-Chi bajo.
hud.QiBreakTrackColor = Color de fondo en ruptura
hud.QiBreakTrackColor.tip = Color del fondo del arco de Sha-Chi durante una ruptura de guardia. Vuelve al color de fondo normal cuando termina.
hud.BreakDemo = Vista previa de ruptura
hud.BreakDemo.tip = Oculta el panel temporalmente, vacía el arco de Sha-Chi y muestra el color de ruptura de guardia durante 3 segundos; luego todo se restaura y el panel vuelve a abrirse. No rompe la guardia del personaje.
hud.BreakDemo.run = Iniciar demostración

hud.BrushJitter = Variación del pincel
hud.BrushJitter.tip = Variación aleatoria de los trazos de pincel de ambos arcos. Con 0 los bordes quedan más limpios.
hud.StrokeOverlap = Superposición de trazos
hud.StrokeOverlap.tip = Largo del pincel como múltiplo del largo de cada segmento. Auméntalo para cubrir las uniones; redúcelo para que se noten los segmentos.
hud.GhostSpeed = Tiempo de recuperación de estela
hud.GhostSpeed.tip = Tiempo de recuperación de la estela de ambos arcos. Con valores más bajos alcanza más rápido el valor actual.
hud.GhostDelay = Demora de la estela
hud.GhostDelay.tip = Después de una pérdida, la estela se mantiene este tiempo antes de recuperarse, para que veas cuánto perdiste. Los golpes seguidos reinician la espera; con 0 se recupera al instante.
hud.WarnFlashSpeed = Velocidad del parpadeo de alerta
hud.WarnFlashSpeed.tip = Frecuencia de parpadeo de las alertas de HP y Sha-Chi bajos. Con valores más altos parpadea más rápido.
hud.WarnFlashAmount = Intensidad del parpadeo de alerta
hud.WarnFlashAmount.tip = Variación de brillo durante las alertas de valor bajo. Con 0 no parpadea.

hud.ToggleNativeHudKey = Tecla de visibilidad del HUD nativo
hud.ToggleNativeHudKey.tip = Alterna la opción de ocultar el HUD nativo, con las mismas reglas para los valores numéricos. Sin asignar de forma predeterminada. No funciona durante la configuración ni al arrastrar; los cambios no se guardan automáticamente.
hud.HideNativeHud = Ocultar HUD nativo
hud.HideNativeHud.tip = Oculta las pociones, las barras de salud y Sha-Chi y las armas del HUD nativo, excepto las barras de salud de los jefes. Al activarlo se desactivan los números de salud y Sha-Chi, que puedes volver a activar manualmente. Al desactivarlo, esos números vuelven a activarse.
hud.NativeBars = HUD nativo del juego
hud.NativeBars.tip = Fija el largo de las barras de HP y Sha-Chi de la esquina inferior izquierda, déjalas como están u ocúltalas por completo. El largo fijo se restaura solo cuando el juego vuelve a crear las barras.
hud.NativeBars.pin = Largo fijo
hud.NativeBars.dynamic = Sin cambios
hud.NativeBars.hide = Ocultar barras
hud.HudBarWidth = Ancho fijo de barras nativas
hud.HudBarWidth.tip = -1 usa el largo inicial de cada barra en el juego. Un ancho personalizado debe ser de al menos 48, en unidades de interfaz del juego. El largo fijo se restaura solo cuando el juego vuelve a crear las barras.
hud.NativePinRecover = Recuperar largo fijo
hud.NativePinRecover.tip = Intenta restaurar el largo fijo si deja de funcionar, normalmente en unos 1.5 s. Desactívalo para solo registrar los problemas, útil para diagnosticarlos. Funciona en los modos fijo y oculto.
hud.HudNumbers = Mostrar valores en barras
hud.HudNumbers.tip = Muestra los valores actual y máximo. Los números pueden seguir visibles aunque se oculten las barras nativas.
hud.HudNumberStyle = Estilo de números
hud.HudNumberStyle.tip = Centrado muestra texto blanco dentro de cada barra. Arriba y abajo pone el HP sobre su barra y el Sha-Chi debajo de la suya.
hud.HudNumberStyle.center = Centrado dentro
hud.HudNumberStyle.side = Arriba y abajo
hud.HideNativeMedicine = Ocultar pociones del HUD nativo
hud.HideNativeMedicine.tip = Oculta la zona de pociones del HUD nativo del juego sin afectar los íconos de este mod.
hud.HideNativeMainWeapon = Ocultar arma del HUD nativo
hud.HideNativeMainWeapon.tip = Oculta la zona del arma del HUD nativo del juego sin afectar los íconos de este mod.
hud.HideNativePhantomEdges = Ocultar FILOS ESPECTRALES del HUD nativo
hud.HideNativePhantomEdges.tip = Oculta la zona de FILOS ESPECTRALES del HUD nativo del juego sin afectar los íconos de este mod.

hud.MedicineHud = Mostrar pociones
hud.MedicineHud.tip = Muestra los íconos y la cantidad de las pociones equipadas.
hud.PureIcon = Mostrar Esencia de Sha-Chi
hud.PureIcon.tip = Muestra el ícono y la cantidad de Esencia de Sha-Chi.
hud.MainWeaponIcon = Mostrar arma
hud.MainWeaponIcon.tip = Reemplaza el ícono de Esencia de Sha-Chi por el del arma actual. Desactiva esta opción para restaurar el ícono original.
hud.BulletIcon = Mostrar Fuente Oscura
hud.BulletIcon.tip = Muestra el ícono y la cantidad de Fuente Oscura; comparte la posición de grupo con la Esencia de Sha-Chi.
hud.PhantomEdgesIcon = Mostrar FILOS ESPECTRALES
hud.PhantomEdgesIcon.tip = Reemplaza el ícono de la Fuente Oscura por el de los FILOS ESPECTRALES actuales. Desactiva esta opción para restaurar el ícono original.
hud.UltChargeBar = Mostrar carga de Esencia
hud.UltChargeBar.tip = Ilumina de abajo hacia arriba el ícono de Esencia de Sha-Chi (o el ícono de arma que lo reemplaza) según el progreso de carga. No afecta a la Fuente Oscura ni a su ícono de arma.
hud.WeaponCooldown = Recarga del cambio de arma
hud.WeaponCooldown.tip = Muestra un anillo de recarga al cambiar de arma y lo oculta al terminar. En la configuración, la vista previa se repite cada 3 segundos. En el modo de arrastre se muestra completo y se puede mover por separado con el botón izquierdo o derecho.
hud.WeaponCooldownX = Anillo de recarga X
hud.WeaponCooldownX.tip = Coordenada X de la esquina superior izquierda. -1 sigue el punto medio interior del arco de Sha-Chi. Arrastrar fija la posición.
hud.WeaponCooldownY = Anillo de recarga Y
hud.WeaponCooldownY.tip = Coordenada Y de la esquina superior izquierda. -1 sigue el punto medio interior del arco de Sha-Chi. El clic central restaura las posiciones predeterminadas.
hud.IconScale = Escala de íconos
hud.IconScale.tip = Escala íconos, números y espaciado a la vez, manteniendo fijo el borde inferior.
hud.MedicineHudX = Grupo de pociones X
hud.MedicineHudX.tip = Posición horizontal del grupo de pociones. -1 usa el diseño automático centrado abajo. También puedes ajustarla en el modo de arrastre.
hud.MedicineHudY = Grupo de pociones Y
hud.MedicineHudY.tip = Posición vertical del grupo de pociones. -1 usa el diseño automático centrado abajo. También puedes ajustarla en el modo de arrastre.
hud.UltHudX = Esencia y Fuente Oscura X
hud.UltHudX.tip = Posición horizontal compartida de la Esencia de Sha-Chi y la Fuente Oscura. -1 usa el diseño automático.
hud.UltHudY = Esencia y Fuente Oscura Y
hud.UltHudY.tip = Posición vertical compartida de la Esencia de Sha-Chi y la Fuente Oscura. -1 usa el diseño automático.
hud.Med1OffX = Desplazamiento X de poción 1
hud.Med1OffX.tip = Desplazamiento horizontal de la primera poción dentro de su grupo. En el modo de arrastre, arrastra el ícono con clic derecho para ajustarlo por separado.
hud.Med1OffY = Desplazamiento Y de poción 1
hud.Med1OffY.tip = Desplazamiento vertical de la primera poción dentro de su grupo. En el modo de arrastre, arrastra el ícono con clic derecho para ajustarlo por separado.
hud.Med2OffX = Desplazamiento X de poción 2
hud.Med2OffX.tip = Desplazamiento horizontal de la segunda poción dentro de su grupo. En el modo de arrastre, arrastra el ícono con clic derecho para ajustarlo por separado.
hud.Med2OffY = Desplazamiento Y de poción 2
hud.Med2OffY.tip = Desplazamiento vertical de la segunda poción dentro de su grupo. En el modo de arrastre, arrastra el ícono con clic derecho para ajustarlo por separado.
hud.Ult1OffX = Desplazamiento X de Esencia
hud.Ult1OffX.tip = Desplazamiento horizontal del ícono de Esencia de Sha-Chi dentro de su grupo.
hud.Ult1OffY = Desplazamiento Y de Esencia
hud.Ult1OffY.tip = Desplazamiento vertical del ícono de Esencia de Sha-Chi dentro de su grupo.
hud.Ult2OffX = Desplazamiento X de Fuente Oscura
hud.Ult2OffX.tip = Desplazamiento horizontal del ícono de Fuente Oscura dentro de su grupo.
hud.Ult2OffY = Desplazamiento Y de Fuente Oscura
hud.Ult2OffY.tip = Desplazamiento vertical del ícono de Fuente Oscura dentro de su grupo.

hud.Debug = Registro de depuración
hud.Debug.tip = Escribe información detallada de ejecución en Scripts/PBZMoHUD.log. Incluye este archivo al reportar un problema.
hud.DragIcons = Arrastrar íconos
hud.DragIcons.tip = Oculta temporalmente el panel de configuración. Arrastra con clic izquierdo para mover todo el grupo, con clic derecho para mover un solo ícono, y haz clic central para restablecer las posiciones predeterminadas. Pulsa ESC para volver al panel de configuración.
hud.DragIcons.run = Comenzar a arrastrar
hud.dragTip = Pulsa ESC para salir del modo de arrastre
