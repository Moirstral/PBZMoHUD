hud.name = PBZMoHUD
hud.about = Individually adjustable HP and Sha-Chi arcs for Phantom Blade Zero, with potion, Sha-Chi Essence and Dark Source icons. Reads player values without changing game data.
hud.group.preset = Presets
hud.group.behavior = Behavior
hud.group.hpArc = HP Arc
hud.group.qiArc = Sha-Chi Arc
hud.group.look = Shared Appearance
hud.group.icons = Icons
hud.group.native = Native HUD
hud.group.advanced = Advanced

hud.Layout = Layout
hud.Layout.tip = Choose where the HP and Sha-Chi arcs are placed.
hud.Layout.normal = Normal
hud.Layout.mirror = Mirrored
hud.Layout.ipsilateral = Same side

hud.FollowCharacter = Follow character
hud.FollowCharacter.tip = Move the arcs with the character's screen position. Disable to use a fixed screen anchor.
hud.FollowSmoothing = Follow smoothing time
hud.FollowSmoothing.tip = Position smoothing time while following the character. Set to 0 to follow instantly.
hud.FixedAnchorX = Fixed anchor X
hud.FixedAnchorX.tip = Horizontal anchor position as a fraction of screen width when not following. 0.5 is centered.
hud.FixedAnchorY = Fixed anchor Y
hud.FixedAnchorY.tip = Vertical anchor position as a fraction of screen height when not following. 0.5 is centered.
hud.AnchorHeight = Character anchor height
hud.AnchorHeight.tip = World-space height offset above the character's origin (Unreal world units, roughly 1 cm each), not screen pixels. Positive raises the anchor.
hud.AnchorOffsetX = Overall horizontal offset
hud.AnchorOffsetX.tip = Move both arcs horizontally. Positive values move right; each arc's own offset is added to this.
hud.AnchorOffsetY = Overall vertical offset
hud.AnchorOffsetY.tip = Move both arcs vertically. Positive values move down; each arc's own offset is added to this.
hud.Visibility = Display timing
hud.Visibility.tip = Follow the game's HUD visibility, or also hide each arc after it stays full. Full values do not hide icons.
hud.Visibility.hud = Follow game HUD
hud.Visibility.dynamic = Hide when full
hud.HideDelay = Full-value hide delay
hud.HideDelay.tip = How long each arc must stay full before hiding. It reappears when the value drops.

hud.HpArcEnabled = Show HP arc
hud.HpArcEnabled.tip = Show the HP arc without affecting icons or the game's native bars.
hud.HpArcSide = HP arc side
hud.HpArcSide.tip = Choose the arc's side before rotation. Both arcs can share a side; separate them with radius or offset.
hud.HpArcSide.left = Left
hud.HpArcSide.right = Right
hud.HpRadius = HP arc radius
hud.HpRadius.tip = Distance from the HP arc to its center. Larger values make the arc wider.
hud.HpThickness = HP arc thickness
hud.HpThickness.tip = Width of the HP arc's brush strokes.
hud.HpArcSpan = HP arc span
hud.HpArcSpan.tip = Angle covered by the HP arc. Larger values make the arc longer.
hud.HpSegments = HP arc segments
hud.HpSegments.tip = More segments create a smoother arc but use more performance.
hud.HpRotation = HP arc rotation
hud.HpRotation.tip = Rotate the entire HP arc around its center, including its trail and brush tip. Positive values rotate clockwise.
hud.HpFillDirection = HP fill direction
hud.HpFillDirection.tip = Normal follows the arc's default segment order; Reversed uses the opposite order. Rotation does not change this choice.
hud.HpFillDirection.normal = Normal
hud.HpFillDirection.reverse = Reversed
hud.HpOffsetX = HP horizontal offset
hud.HpOffsetX.tip = Move the HP arc horizontally after rotation. Positive values move right. Uses a 1080p baseline and follows UI scaling.
hud.HpOffsetY = HP vertical offset
hud.HpOffsetY.tip = Move the HP arc vertically after rotation. Positive values move down. Uses a 1080p baseline and follows UI scaling.
hud.HpColor = HP color
hud.HpColor.tip = Base color of the HP arc. Pale silver by default.
hud.HpTrackColor = HP track color
hud.HpTrackColor.tip = Color of the background track behind the HP arc.
hud.HpWarnColor = Low HP warning color
hud.HpWarnColor.tip = Color used when HP falls below the warning threshold.
hud.WarnThresholdHp = Low HP threshold
hud.WarnThresholdHp.tip = Use the warning color below this HP ratio. The default is 30%.
hud.HpBarOpacity = HP fill opacity
hud.HpBarOpacity.tip = Opacity of the filled HP arc. Higher values make it more visible.
hud.HpTrackOpacity = HP track opacity
hud.HpTrackOpacity.tip = Opacity of the HP background track. Set to 0 for full transparency.
hud.HpShowGhost = Show HP trail
hud.HpShowGhost.tip = Leave a shrinking trail when HP decreases to make the amount lost easier to see.
hud.HpGhostOpacity = HP trail opacity
hud.HpGhostOpacity.tip = Opacity of the trail left when HP decreases.
hud.HpGhostColor = HP trail color
hud.HpGhostColor.tip = Color of the trail left when HP decreases. Dark red by default.
hud.HpVirtualColor = HP pending damage color
hud.HpVirtualColor.tip = Delayed damage that hasn't been deducted yet, shown at the end of the HP fill. Blood red by default.
hud.HpShowTip = Show HP brush tip
hud.HpShowTip.tip = Show a brush tip at the end of the HP fill. The tip remains visible even at zero HP.
hud.HpTipScale = HP brush tip size
hud.HpTipScale.tip = Scale of the brush tip at the end of the HP fill.
hud.HpTipAngle = HP brush tip angle
hud.HpTipAngle.tip = Angle of the HP brush tip relative to the arc's tangent.

hud.QiArcEnabled = Show Sha-Chi arc
hud.QiArcEnabled.tip = Show the Sha-Chi arc without affecting icons or the game's native bars.
hud.QiArcSide = Sha-Chi arc side
hud.QiArcSide.tip = Choose the arc's side before rotation. Both arcs can share a side; separate them with radius or offset.
hud.QiArcSide.left = Left
hud.QiArcSide.right = Right
hud.QiRadius = Sha-Chi arc radius
hud.QiRadius.tip = Distance from the Sha-Chi arc to its center. Use different radii to separate arcs on the same side.
hud.QiThickness = Sha-Chi arc thickness
hud.QiThickness.tip = Width of the Sha-Chi arc's brush strokes.
hud.QiArcSpan = Sha-Chi arc span
hud.QiArcSpan.tip = Angle covered by the Sha-Chi arc. Larger values make the arc longer.
hud.QiSegments = Sha-Chi arc segments
hud.QiSegments.tip = More segments create a smoother arc but use more performance.
hud.QiRotation = Sha-Chi arc rotation
hud.QiRotation.tip = Rotate the entire Sha-Chi arc around its center, including its trail and brush tip. Positive values rotate clockwise.
hud.QiFillDirection = Sha-Chi fill direction
hud.QiFillDirection.tip = Normal follows the arc's default segment order; Reversed uses the opposite order. Rotation does not change this choice.
hud.QiFillDirection.normal = Normal
hud.QiFillDirection.reverse = Reversed
hud.QiOffsetX = Sha-Chi horizontal offset
hud.QiOffsetX.tip = Move the Sha-Chi arc horizontally after rotation. Positive values move right. Uses a 1080p baseline and follows UI scaling.
hud.QiOffsetY = Sha-Chi vertical offset
hud.QiOffsetY.tip = Move the Sha-Chi arc vertically after rotation. Positive values move down. Uses a 1080p baseline and follows UI scaling.
hud.QiColor = Sha-Chi color
hud.QiColor.tip = Base color of the Sha-Chi arc. Gold by default.
hud.QiTrackColor = Sha-Chi track color
hud.QiTrackColor.tip = Color of the background track behind the Sha-Chi arc.
hud.QiWarnColor = Low Sha-Chi warning color
hud.QiWarnColor.tip = Color used below the Sha-Chi warning threshold. The guard-break hint takes priority.
hud.WarnThresholdQi = Low Sha-Chi threshold
hud.WarnThresholdQi.tip = Use the warning color below this Sha-Chi ratio. The default is 25%.
hud.QiBarOpacity = Sha-Chi fill opacity
hud.QiBarOpacity.tip = Opacity of the filled Sha-Chi arc. Higher values make it more visible.
hud.QiTrackOpacity = Sha-Chi track opacity
hud.QiTrackOpacity.tip = Opacity of the Sha-Chi background track. Set to 0 for full transparency.
hud.QiShowGhost = Show Sha-Chi trail
hud.QiShowGhost.tip = Leave a shrinking trail when Sha-Chi decreases to make the amount lost easier to see.
hud.QiGhostOpacity = Sha-Chi trail opacity
hud.QiGhostOpacity.tip = Opacity of the trail left when Sha-Chi decreases.
hud.QiGhostColor = Sha-Chi trail color
hud.QiGhostColor.tip = Color of the trail left when Sha-Chi decreases. Dark gold by default. Uses the guard-break color during a guard break.
hud.QiShowTip = Show Sha-Chi brush tip
hud.QiShowTip.tip = Show a brush tip at the end of the Sha-Chi fill. The tip remains visible even at zero Sha-Chi.
hud.QiTipScale = Sha-Chi brush tip size
hud.QiTipScale.tip = Scale of the brush tip at the end of the Sha-Chi fill.
hud.QiTipAngle = Sha-Chi brush tip angle
hud.QiTipAngle.tip = Angle of the Sha-Chi brush tip relative to the arc's tangent.
hud.BreakHint = Guard-break hint
hud.BreakHint.tip = Change the Sha-Chi arc color while the character's guard is broken, restoring it immediately on recovery. Disable to stop detection.
hud.QiBreakColor = Guard-break color
hud.QiBreakColor.tip = Sha-Chi arc color during a guard break. Takes priority over the low Sha-Chi warning color.
hud.QiBreakTrackColor = Guard-break track color
hud.QiBreakTrackColor.tip = Sha-Chi arc track color during a guard break. Returns to the track color when the break ends.
hud.BreakDemo = Preview guard-break color
hud.BreakDemo.tip = Temporarily hide the panel, empty the Sha-Chi arc and show the guard-break color for 3 seconds, then restore and reopen the panel automatically. Does not break the character's guard.
hud.BreakDemo.run = Start demo

hud.BrushJitter = Brush jitter
hud.BrushJitter.tip = Random variation in both arcs' brush strokes. Set to 0 for the cleanest edges.
hud.StrokeOverlap = Stroke overlap
hud.StrokeOverlap.tip = Brush length as a multiple of segment length. Increase to cover seams; decrease to reveal individual segments.
hud.GhostSpeed = Trail recovery time
hud.GhostSpeed.tip = Recovery time for both arcs' trails. Lower values catch up with the current value faster.
hud.GhostDelay = Trail recovery delay
hud.GhostDelay.tip = After a loss, the trail holds for this long before recovering so you can see how much was lost. Consecutive hits refresh the hold; 0 recovers immediately.
hud.WarnFlashSpeed = Warning flash speed
hud.WarnFlashSpeed.tip = Flash frequency for low HP and low Sha-Chi warnings. Higher values flash faster.
hud.WarnFlashAmount = Warning flash strength
hud.WarnFlashAmount.tip = Brightness variation during low-value warnings. Set to 0 to stop flashing.

hud.ToggleNativeHudKey = Toggle native HUD key
hud.ToggleNativeHudKey.tip = Toggle Hide native HUD, with the same linked number settings. Unbound by default. Inactive while configuring or dragging; changes are not saved automatically.
hud.HideNativeHud = Hide native HUD
hud.HideNativeHud.tip = Hide native potions, HP and Sha-Chi bars, and weapons, excluding boss HP bars. Enabling this turns off HP and Sha-Chi numbers, which you can turn back on manually. Disabling it turns those numbers back on.
hud.NativeBars = Native game HUD
hud.NativeBars.tip = Fix the length of the game's lower-left HP and Sha-Chi bars, leave them unchanged, or hide them entirely. Fixed length is restored automatically when the game recreates the bars.
hud.NativeBars.pin = Fixed length
hud.NativeBars.dynamic = Unchanged
hud.NativeBars.hide = Hide entire bars
hud.HudBarWidth = Native bar fixed width
hud.HudBarWidth.tip = -1 uses each bar's initial game length. A custom width must be at least 48, in game UI units. Fixed length is restored automatically when the game recreates the bars.
hud.NativePinRecover = Recover fixed length
hud.NativePinRecover.tip = Try to restore fixed length if it stops working, usually within about 1.5 seconds. Disable to only log problems, useful for troubleshooting. Works in both fixed and hidden modes.
hud.HudNumbers = Show bar values
hud.HudNumbers.tip = Show current and maximum values. Numbers can remain visible after the native bars are hidden.
hud.HudNumberStyle = Number style
hud.HudNumberStyle.tip = Centered shows white text inside each bar. Above and below places HP above its bar and Sha-Chi below its bar.
hud.HudNumberStyle.center = Centered inside
hud.HudNumberStyle.side = Above and below
hud.HideNativeMedicine = Hide native potions
hud.HideNativeMedicine.tip = Hide the game's native potion area without affecting this mod's icons.
hud.HideNativeMainWeapon = Hide native weapon
hud.HideNativeMainWeapon.tip = Hide the game's native weapon area without affecting this mod's icons.
hud.HideNativePhantomEdges = Hide native PHANTOM EDGES
hud.HideNativePhantomEdges.tip = Hide the game's native PHANTOM EDGES area without affecting this mod's icons.

hud.MedicineHud = Show potions
hud.MedicineHud.tip = Show icons and counts for equipped potions.
hud.PureIcon = Show Sha-Chi Essence
hud.PureIcon.tip = Show the Sha-Chi Essence icon and count.
hud.MainWeaponIcon = Show weapon
hud.MainWeaponIcon.tip = Replace the Sha-Chi Essence icon with the current weapon icon. Turn off to restore the original icon.
hud.BulletIcon = Show Dark Source
hud.BulletIcon.tip = Show the Dark Source icon and count, sharing a group position with Sha-Chi Essence.
hud.PhantomEdgesIcon = Show PHANTOM EDGES
hud.PhantomEdgesIcon.tip = Replace the Dark Source icon with the current PHANTOM EDGES icon. Turn off to restore the original icon.
hud.UltChargeBar = Show Essence charge
hud.UltChargeBar.tip = Fill the Sha-Chi Essence icon (or its replacement weapon icon) from bottom to top as charge increases. Does not affect Dark Source or its weapon icon.
hud.WeaponCooldown = Weapon switch cooldown
hud.WeaponCooldown.tip = Show a cooldown ring when switching weapons; hide it when ready. While settings are open, preview a full cycle every 3 seconds. Drag mode shows the full ring. Left- or right-drag moves it independently of other icons.
hud.WeaponCooldownX = Cooldown ring X
hud.WeaponCooldownX.tip = Screen X of the ring's top-left corner. -1 follows the inner midpoint of the Sha-Chi arc; dragging sets a fixed position.
hud.WeaponCooldownY = Cooldown ring Y
hud.WeaponCooldownY.tip = Screen Y of the ring's top-left corner. -1 follows the inner midpoint of the Sha-Chi arc. Middle-click restores default positions.
hud.IconScale = Icon scale
hud.IconScale.tip = Scale icons, numbers and spacing together while keeping the bottom edge in place.
hud.MedicineHudX = Potion group X
hud.MedicineHudX.tip = Horizontal potion group position. -1 uses the automatic bottom-center layout. You can also adjust it in drag mode.
hud.MedicineHudY = Potion group Y
hud.MedicineHudY.tip = Vertical potion group position. -1 uses the automatic bottom-center layout. You can also adjust it in drag mode.
hud.UltHudX = Essence and Dark Source X
hud.UltHudX.tip = Shared horizontal position for Sha-Chi Essence and Dark Source. -1 uses automatic layout.
hud.UltHudY = Essence and Dark Source Y
hud.UltHudY.tip = Shared vertical position for Sha-Chi Essence and Dark Source. -1 uses automatic layout.
hud.Med1OffX = Potion 1 horizontal offset
hud.Med1OffX.tip = First potion's horizontal offset within its group. Right-drag the icon in drag mode to adjust it individually.
hud.Med1OffY = Potion 1 vertical offset
hud.Med1OffY.tip = First potion's vertical offset within its group. Right-drag the icon in drag mode to adjust it individually.
hud.Med2OffX = Potion 2 horizontal offset
hud.Med2OffX.tip = Second potion's horizontal offset within its group. Right-drag the icon in drag mode to adjust it individually.
hud.Med2OffY = Potion 2 vertical offset
hud.Med2OffY.tip = Second potion's vertical offset within its group. Right-drag the icon in drag mode to adjust it individually.
hud.Ult1OffX = Essence horizontal offset
hud.Ult1OffX.tip = Sha-Chi Essence icon's horizontal offset within its group.
hud.Ult1OffY = Essence vertical offset
hud.Ult1OffY.tip = Sha-Chi Essence icon's vertical offset within its group.
hud.Ult2OffX = Dark Source horizontal offset
hud.Ult2OffX.tip = Dark Source icon's horizontal offset within its group.
hud.Ult2OffY = Dark Source vertical offset
hud.Ult2OffY.tip = Dark Source icon's vertical offset within its group.

hud.Debug = Debug logging
hud.Debug.tip = Write detailed runtime information to Scripts/PBZMoHUD.log. Include this file when reporting a problem.
hud.DragIcons = Drag icons
hud.DragIcons.tip = Temporarily hide the configuration panel. Left-drag moves the whole icon group, right-drag moves a single icon, and middle-click restores default positions. Press ESC to return to the configuration panel.
hud.DragIcons.run = Start dragging
hud.dragTip = Press ESC to exit drag mode
