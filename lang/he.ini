hud.name = PBZMoHUD
hud.about = קשתות HP ו-Sha-Chi הניתנות לכוונון נפרד עבור Phantom Blade Zero, עם סמלים לשיקויים, לתמצית Sha-Chi ולמקור אפל. קורא את ערכי השחקן בלבד ואינו משנה נתוני משחק.
hud.group.preset = הגדרות מוכנות
hud.group.behavior = התנהגות
hud.group.hpArc = קשת HP
hud.group.qiArc = קשת Sha-Chi
hud.group.look = מראה משותף
hud.group.icons = סמלים
hud.group.native = פסים מקוריים
hud.group.advanced = מתקדם

hud.Layout = פריסה
hud.Layout.tip = בחר היכן ימוקמו קשתות ה-HP וה-Sha-Chi.
hud.Layout.normal = רגיל
hud.Layout.mirror = תמונת ראי
hud.Layout.ipsilateral = אותו צד

hud.FollowCharacter = מעקב אחר הדמות
hud.FollowCharacter.tip = הקשתות נעות עם מיקום הדמות במסך. כבה כדי להשתמש בעוגן קבוע במסך.
hud.FollowSmoothing = זמן החלקת מעקב
hud.FollowSmoothing.tip = זמן החלקת המיקום בזמן מעקב אחר הדמות. 0 = מעקב מיידי.
hud.FixedAnchorX = עוגן קבוע X
hud.FixedAnchorX.tip = מיקום העוגן האופקי כחלק מרוחב המסך כשאין מעקב. 0.5 = מרכז.
hud.FixedAnchorY = עוגן קבוע Y
hud.FixedAnchorY.tip = מיקום העוגן האנכי כחלק מגובה המסך כשאין מעקב. 0.5 = מרכז.
hud.AnchorHeight = גובה עוגן הדמות
hud.AnchorHeight.tip = היסט גובה במרחב העולם מעל נקודת המוצא של הדמות (יחידות עולם של Unreal, כ-1 ס"מ כל אחת), לא פיקסלים במסך. ערך חיובי מגביה את העוגן.
hud.AnchorOffsetX = היסט אופקי כולל
hud.AnchorOffsetX.tip = מזיז את שתי הקשתות אופקית. ערך חיובי מזיז ימינה; ההיסט של כל קשת מתווסף לכך.
hud.AnchorOffsetY = היסט אנכי כולל
hud.AnchorOffsetY.tip = מזיז את שתי הקשתות אנכית. ערך חיובי מזיז למטה; ההיסט של כל קשת מתווסף לכך.
hud.Visibility = תזמון תצוגה
hud.Visibility.tip = עוקב אחר הצגת ה-HUD של המשחק, או מסתיר גם כל קשת שנשארת מלאה. ערכים מלאים אינם מסתירים סמלים.
hud.Visibility.hud = לפי HUD המשחק
hud.Visibility.dynamic = הסתר כשמלא
hud.HideDelay = השהיית הסתרה כשמלא
hud.HideDelay.tip = כמה זמן כל קשת צריכה להישאר מלאה לפני שתוסתר. היא חוזרת כשהערך יורד.

hud.HpArcEnabled = הצג קשת HP
hud.HpArcEnabled.tip = מציג את קשת ה-HP בלי להשפיע על הסמלים או על הפסים המקוריים של המשחק.
hud.HpArcSide = צד קשת HP
hud.HpArcSide.tip = בחר את צד הקשת לפני הסיבוב. שתי הקשתות יכולות לחלוק צד; הפרד ביניהן ברדיוס או בהיסט.
hud.HpArcSide.left = שמאל
hud.HpArcSide.right = ימין
hud.HpRadius = רדיוס קשת HP
hud.HpRadius.tip = המרחק מקשת ה-HP למרכזה. ערך גבוה יותר מרחיב את הקשת.
hud.HpThickness = עובי קשת HP
hud.HpThickness.tip = רוחב משיכות המכחול של קשת ה-HP.
hud.HpArcSpan = טווח קשת HP
hud.HpArcSpan.tip = הזווית שקשת ה-HP מכסה. ערך גבוה יותר מאריך את הקשת.
hud.HpSegments = מקטעי קשת HP
hud.HpSegments.tip = יותר מקטעים יוצרים קשת חלקה יותר, אך דורשים יותר ביצועים.
hud.HpRotation = סיבוב קשת HP
hud.HpRotation.tip = מסובב את כל קשת ה-HP סביב מרכזה, כולל השובל וקצה המכחול. ערך חיובי מסובב עם כיוון השעון.
hud.HpFillDirection = כיוון מילוי HP
hud.HpFillDirection.tip = רגיל ממלא לפי סדר המקטעים המוגדר של הקשת; הפוך משתמש בסדר ההפוך. הסיבוב אינו משנה את הבחירה.
hud.HpFillDirection.normal = רגיל
hud.HpFillDirection.reverse = הפוך
hud.HpOffsetX = היסט אופקי HP
hud.HpOffsetX.tip = מזיז את קשת ה-HP אופקית אחרי הסיבוב. ערך חיובי מזיז ימינה. מבוסס על 1080p ועוקב אחר קנה המידה של הממשק.
hud.HpOffsetY = היסט אנכי HP
hud.HpOffsetY.tip = מזיז את קשת ה-HP אנכית אחרי הסיבוב. ערך חיובי מזיז למטה. מבוסס על 1080p ועוקב אחר קנה המידה של הממשק.
hud.HpColor = צבע HP
hud.HpColor.tip = צבע הבסיס של קשת ה-HP. ברירת מחדל: כסוף בהיר.
hud.HpTrackColor = צבע מסלול HP
hud.HpTrackColor.tip = צבע מסלול הרקע שמאחורי קשת ה-HP.
hud.HpWarnColor = צבע אזהרת HP נמוך
hud.HpWarnColor.tip = הצבע שמוצג כשה-HP יורד מתחת לסף האזהרה.
hud.WarnThresholdHp = סף HP נמוך
hud.WarnThresholdHp.tip = צבע האזהרה מוצג מתחת ליחס HP זה. ברירת המחדל היא 30%.
hud.HpBarOpacity = אטימות מילוי HP
hud.HpBarOpacity.tip = אטימות החלק המלא של קשת ה-HP. ערך גבוה יותר בולט יותר.
hud.HpTrackOpacity = אטימות מסלול HP
hud.HpTrackOpacity.tip = אטימות מסלול הרקע של ה-HP. 0 = שקוף לחלוטין.
hud.HpShowGhost = הצג שובל HP
hud.HpShowGhost.tip = משאיר שובל מתכווץ כשה-HP יורד, כדי שיהיה קל לראות כמה אבד.
hud.HpGhostOpacity = אטימות שובל HP
hud.HpGhostOpacity.tip = אטימות השובל שנשאר כשה-HP יורד.
hud.HpGhostColor = צבע שובל HP
hud.HpGhostColor.tip = צבע השובל שנשאר כשה-HP יורד. ברירת מחדל: אדום כהה.
hud.HpShowTip = הצג קצה מכחול HP
hud.HpShowTip.tip = מציג קצה מכחול בסוף מילוי ה-HP. הקצה נשאר גלוי גם כשה-HP באפס.
hud.HpTipScale = גודל קצה מכחול HP
hud.HpTipScale.tip = קנה המידה של קצה המכחול בסוף מילוי ה-HP.
hud.HpTipAngle = זווית קצה מכחול HP
hud.HpTipAngle.tip = זווית קצה המכחול של ה-HP ביחס למשיק של הקשת.

hud.QiArcEnabled = הצג קשת Sha-Chi
hud.QiArcEnabled.tip = מציג את קשת ה-Sha-Chi בלי להשפיע על הסמלים או על הפסים המקוריים של המשחק.
hud.QiArcSide = צד קשת Sha-Chi
hud.QiArcSide.tip = בחר את צד הקשת לפני הסיבוב. שתי הקשתות יכולות לחלוק צד; הפרד ביניהן ברדיוס או בהיסט.
hud.QiArcSide.left = שמאל
hud.QiArcSide.right = ימין
hud.QiRadius = רדיוס קשת Sha-Chi
hud.QiRadius.tip = המרחק מקשת ה-Sha-Chi למרכזה. השתמש ברדיוסים שונים כדי להפריד קשתות באותו צד.
hud.QiThickness = עובי קשת Sha-Chi
hud.QiThickness.tip = רוחב משיכות המכחול של קשת ה-Sha-Chi.
hud.QiArcSpan = טווח קשת Sha-Chi
hud.QiArcSpan.tip = הזווית שקשת ה-Sha-Chi מכסה. ערך גבוה יותר מאריך את הקשת.
hud.QiSegments = מקטעי קשת Sha-Chi
hud.QiSegments.tip = יותר מקטעים יוצרים קשת חלקה יותר, אך דורשים יותר ביצועים.
hud.QiRotation = סיבוב קשת Sha-Chi
hud.QiRotation.tip = מסובב את כל קשת ה-Sha-Chi סביב מרכזה, כולל השובל וקצה המכחול. ערך חיובי מסובב עם כיוון השעון.
hud.QiFillDirection = כיוון מילוי Sha-Chi
hud.QiFillDirection.tip = רגיל ממלא לפי סדר המקטעים המוגדר של הקשת; הפוך משתמש בסדר ההפוך. הסיבוב אינו משנה את הבחירה.
hud.QiFillDirection.normal = רגיל
hud.QiFillDirection.reverse = הפוך
hud.QiOffsetX = היסט אופקי Sha-Chi
hud.QiOffsetX.tip = מזיז את קשת ה-Sha-Chi אופקית אחרי הסיבוב. ערך חיובי מזיז ימינה. מבוסס על 1080p ועוקב אחר קנה המידה של הממשק.
hud.QiOffsetY = היסט אנכי Sha-Chi
hud.QiOffsetY.tip = מזיז את קשת ה-Sha-Chi אנכית אחרי הסיבוב. ערך חיובי מזיז למטה. מבוסס על 1080p ועוקב אחר קנה המידה של הממשק.
hud.QiColor = צבע Sha-Chi
hud.QiColor.tip = צבע הבסיס של קשת ה-Sha-Chi. ברירת מחדל: זהב.
hud.QiTrackColor = צבע מסלול Sha-Chi
hud.QiTrackColor.tip = צבע מסלול הרקע שמאחורי קשת ה-Sha-Chi.
hud.QiWarnColor = צבע אזהרת Sha-Chi נמוך
hud.QiWarnColor.tip = הצבע שמוצג מתחת לסף אזהרת ה-Sha-Chi. התראת שבירת ההגנה קודמת לו.
hud.WarnThresholdQi = סף Sha-Chi נמוך
hud.WarnThresholdQi.tip = צבע האזהרה מוצג מתחת ליחס Sha-Chi זה. ברירת המחדל היא 25%.
hud.QiBarOpacity = אטימות מילוי Sha-Chi
hud.QiBarOpacity.tip = אטימות החלק המלא של קשת ה-Sha-Chi. ערך גבוה יותר בולט יותר.
hud.QiTrackOpacity = אטימות מסלול Sha-Chi
hud.QiTrackOpacity.tip = אטימות מסלול הרקע של ה-Sha-Chi. 0 = שקוף לחלוטין.
hud.QiShowGhost = הצג שובל Sha-Chi
hud.QiShowGhost.tip = משאיר שובל מתכווץ כשה-Sha-Chi יורד, כדי שיהיה קל לראות כמה אבד.
hud.QiGhostOpacity = אטימות שובל Sha-Chi
hud.QiGhostOpacity.tip = אטימות השובל שנשאר כשה-Sha-Chi יורד.
hud.QiGhostColor = צבע שובל Sha-Chi
hud.QiGhostColor.tip = צבע השובל שנשאר כשה-Sha-Chi יורד. ברירת מחדל: זהב כהה. בזמן שבירת הגנה משתמש בצבע שבירת ההגנה.
hud.QiShowTip = הצג קצה מכחול Sha-Chi
hud.QiShowTip.tip = מציג קצה מכחול בסוף מילוי ה-Sha-Chi. הקצה נשאר גלוי גם כשה-Sha-Chi באפס.
hud.QiTipScale = גודל קצה מכחול Sha-Chi
hud.QiTipScale.tip = קנה המידה של קצה המכחול בסוף מילוי ה-Sha-Chi.
hud.QiTipAngle = זווית קצה מכחול Sha-Chi
hud.QiTipAngle.tip = זווית קצה המכחול של ה-Sha-Chi ביחס למשיק של הקשת.
hud.BreakHint = התראת שבירת הגנה
hud.BreakHint.tip = משנה את צבע קשת ה-Sha-Chi כשההגנה של הדמות נשברת, ומשחזר אותו מיד עם ההתאוששות. כבה כדי להפסיק את הזיהוי.
hud.QiBreakColor = צבע שבירת הגנה
hud.QiBreakColor.tip = צבע קשת ה-Sha-Chi בזמן שבירת הגנה. קודם לצבע אזהרת Sha-Chi נמוך.
hud.QiBreakTrackColor = צבע מסלול בשבירת הגנה
hud.QiBreakTrackColor.tip = צבע מסלול קשת ה-Sha-Chi בזמן שבירת הגנה. חוזר לצבע המסלול כששבירת ההגנה מסתיימת.
hud.BreakDemo = תצוגה מקדימה של שבירת הגנה
hud.BreakDemo.tip = מסתיר זמנית את הלוח, מרוקן את קשת ה-Sha-Chi ומציג את צבע שבירת ההגנה למשך 3 שניות, ואז משחזר ופותח את הלוח מחדש אוטומטית. ההגנה של הדמות לא נשברת באמת.
hud.BreakDemo.run = התחל הדגמה

hud.BrushJitter = רעד מכחול
hud.BrushJitter.tip = שונות אקראית במשיכות המכחול של שתי הקשתות. 0 = הקצוות הנקיים ביותר.
hud.StrokeOverlap = חפיפת משיכות
hud.StrokeOverlap.tip = אורך המשיכה ככפולה של אורך המקטע. הגדל כדי לכסות תפרים; הקטן כדי לחשוף מקטעים בודדים.
hud.GhostSpeed = זמן התכווצות השובל
hud.GhostSpeed.tip = זמן ההתכווצות של השובל בשתי הקשתות. ערך נמוך יותר משיג את הערך הנוכחי מהר יותר.
hud.GhostDelay = השהיית התכווצות השובל
hud.GhostDelay.tip = אחרי ירידה, השובל נשאר למשך זמן זה לפני שהוא מתכווץ, כדי שתראה כמה אבד. פגיעות רצופות מאפסות את ההמתנה; 0 = התכווצות מיידית.
hud.WarnFlashSpeed = מהירות הבהוב אזהרה
hud.WarnFlashSpeed.tip = תדירות ההבהוב באזהרות HP נמוך ו-Sha-Chi נמוך. ערך גבוה יותר מהבהב מהר יותר.
hud.WarnFlashAmount = עוצמת הבהוב אזהרה
hud.WarnFlashAmount.tip = שינוי הבהירות באזהרות ערך נמוך. 0 = ללא הבהוב.

hud.NativeBars = HUD מקורי של המשחק
hud.NativeBars.tip = קובע את אורך פסי ה-HP וה-Sha-Chi בפינה השמאלית התחתונה של המשחק, משאיר אותם ללא שינוי או מסתיר אותם לגמרי. האורך הקבוע משוחזר אוטומטית כשהמשחק יוצר את הפסים מחדש.
hud.NativeBars.pin = אורך קבוע
hud.NativeBars.dynamic = ללא שינוי
hud.NativeBars.hide = הסתר לגמרי
hud.HudBarWidth = רוחב קבוע לפס מקורי
hud.HudBarWidth.tip = -1 משתמש באורך ההתחלתי של כל פס במשחק. רוחב מותאם חייב להיות לפחות 48, ביחידות ממשק המשחק. האורך הקבוע משוחזר אוטומטית כשהמשחק יוצר את הפסים מחדש.
hud.NativePinRecover = שחזור אורך קבוע
hud.NativePinRecover.tip = מנסה לשחזר את האורך הקבוע אם הוא מפסיק לפעול, בדרך כלל תוך כ-1.5 שניות. כבה כדי רק לרשום בעיות ביומן, שימושי לאיתור תקלות. פועל במצב קבוע ובמצב מוסתר.
hud.HudNumbers = הצג ערכים על הפסים
hud.HudNumbers.tip = מציג ערך נוכחי ומרבי. המספרים יכולים להישאר גלויים גם אחרי הסתרת הפסים המקוריים.
hud.HudNumberStyle = סגנון מספרים
hud.HudNumberStyle.tip = ממורכז מציג טקסט לבן בתוך כל פס. מעל ומתחת ממקם את ה-HP מעל הפס שלו ואת ה-Sha-Chi מתחת לפס שלו.
hud.HudNumberStyle.center = ממורכז בפנים
hud.HudNumberStyle.side = מעל ומתחת

hud.MedicineHud = הצג שיקויים
hud.MedicineHud.tip = מציג סמלים וכמויות של השיקויים המצוידים.
hud.PureIcon = הצג תמצית Sha-Chi
hud.PureIcon.tip = מציג את הסמל והכמות של תמצית Sha-Chi.
hud.BulletIcon = הצג מקור אפל
hud.BulletIcon.tip = מציג את הסמל והכמות של מקור אפל, במיקום קבוצה משותף עם תמצית Sha-Chi.
hud.UltChargeBar = הצג טעינת תמצית
hud.UltChargeBar.tip = ממלא את סמל תמצית Sha-Chi לפי התקדמות הטעינה. אינו משפיע על סמל מקור אפל.
hud.IconScale = קנה מידה לסמלים
hud.IconScale.tip = משנה יחד את גודל הסמלים, המספרים והמרווחים, תוך שמירה על מיקום הקצה התחתון.
hud.MedicineHudX = קבוצת שיקויים X
hud.MedicineHudX.tip = המיקום האופקי של קבוצת השיקויים. -1 משתמש בפריסה האוטומטית במרכז תחתית המסך. אפשר גם לכוונן במצב גרירה.
hud.MedicineHudY = קבוצת שיקויים Y
hud.MedicineHudY.tip = המיקום האנכי של קבוצת השיקויים. -1 משתמש בפריסה האוטומטית במרכז תחתית המסך. אפשר גם לכוונן במצב גרירה.
hud.UltHudX = תמצית ומקור אפל X
hud.UltHudX.tip = מיקום אופקי משותף לתמצית Sha-Chi ולמקור אפל. -1 משתמש בפריסה אוטומטית.
hud.UltHudY = תמצית ומקור אפל Y
hud.UltHudY.tip = מיקום אנכי משותף לתמצית Sha-Chi ולמקור אפל. -1 משתמש בפריסה אוטומטית.
hud.Med1OffX = היסט אופקי שיקוי 1
