hud.Debug.tip = כותב מידע מפורט על הריצה אל Scripts/PBZMoHUD.log. צרף את הקובץ הזה בעת דיווח על בעיה.
hud.DragIcons = גרירת סמלים
hud.DragIcons.tip = מסתיר זמנית את לוח ההגדרות. גרירה בלחצן שמאלי מזיזה את כל קבוצת הסמלים, גרירה בלחצן ימני מזיזה סמל בודד, ולחיצה בלחצן האמצעי משחזרת את מיקומי ברירת המחדל. לחץ ESC כדי לחזור ללוח ההגדרות.
hud.DragIcons.run = התחל גרירה
hud.dragTip = לחץ ESC כדי לצאת ממצב גרירה
