hud.name = PBZMoHUD
hud.about = Arcos de HP y Sha-Chi ajustables por separado para Phantom Blade Zero, con iconos de pociones, Esencia de Sha-Chi y Fuente Oscura. Solo lee los valores del jugador, sin modificar los datos del juego.
hud.group.preset = Preajustes
hud.group.behavior = Comportamiento
hud.group.hpArc = Arco de HP
hud.group.qiArc = Arco de Sha-Chi
hud.group.look = Apariencia compartida
hud.group.icons = Iconos
hud.group.native = Barras nativas
hud.group.advanced = Avanzado

hud.Layout = Disposición
hud.Layout.tip = Elige dónde se colocan los arcos de HP y Sha-Chi.
hud.Layout.normal = Normal
hud.Layout.mirror = Espejo
hud.Layout.ipsilateral = Mismo lado

hud.FollowCharacter = Seguir al personaje
hud.FollowCharacter.tip = Los arcos siguen la posición del personaje en pantalla. Desactívalo para usar un ancla fija en pantalla.
hud.FollowSmoothing = Suavizado de seguimiento
hud.FollowSmoothing.tip = Tiempo de suavizado de la posición al seguir al personaje. Con 0 lo sigue al instante.
hud.FixedAnchorX = Ancla fija X
hud.FixedAnchorX.tip = Posición horizontal del ancla como fracción de la anchura de pantalla cuando no sigue al personaje. 0.5 es el centro.
hud.FixedAnchorY = Ancla fija Y
hud.FixedAnchorY.tip = Posición vertical del ancla como fracción de la altura de pantalla cuando no sigue al personaje. 0.5 es el centro.
hud.AnchorHeight = Altura del ancla
hud.AnchorHeight.tip = Desplazamiento de altura sobre el origen del personaje en el mundo (unidades de Unreal, aprox. 1 cm cada una), no en píxeles de pantalla. Los valores positivos lo elevan.
hud.AnchorOffsetX = Desplazamiento horizontal general
hud.AnchorOffsetX.tip = Mueve ambos arcos en horizontal. Los valores positivos los desplazan a la derecha; se suma al desplazamiento propio de cada arco.
hud.AnchorOffsetY = Desplazamiento vertical general
hud.AnchorOffsetY.tip = Mueve ambos arcos en vertical. Los valores positivos los desplazan hacia abajo; se suma al desplazamiento propio de cada arco.
hud.Visibility = Cuándo mostrar
hud.Visibility.tip = Sigue la visibilidad del HUD del juego o, además, oculta cada arco cuando se mantiene lleno. Los valores llenos no ocultan los iconos.
hud.Visibility.hud = Según el HUD del juego
hud.Visibility.dynamic = Ocultar al estar lleno
hud.HideDelay = Retardo de ocultación
hud.HideDelay.tip = Tiempo que cada arco debe seguir lleno antes de ocultarse. Vuelve a aparecer cuando el valor baja.

hud.HpArcEnabled = Mostrar arco de HP
hud.HpArcEnabled.tip = Muestra el arco de HP sin afectar a los iconos ni a las barras nativas del juego.
hud.HpArcSide = Lado del arco de HP
hud.HpArcSide.tip = Elige el lado del arco antes de girarlo. Ambos arcos pueden compartir lado; sepáralos con el radio o el desplazamiento.
hud.HpArcSide.left = Izquierda
hud.HpArcSide.right = Derecha
hud.HpRadius = Radio del arco de HP
hud.HpRadius.tip = Distancia del arco de HP a su centro. Con valores mayores el arco se hace más ancho.
hud.HpThickness = Grosor del arco de HP
hud.HpThickness.tip = Anchura de los trazos de pincel del arco de HP.
hud.HpArcSpan = Extensión del arco de HP
hud.HpArcSpan.tip = Ángulo que abarca el arco de HP. Con valores mayores el arco es más largo.
hud.HpSegments = Segmentos del arco de HP
hud.HpSegments.tip = Más segmentos dan un arco más suave, pero afectan más al rendimiento.
hud.HpRotation = Giro del arco de HP
hud.HpRotation.tip = Gira todo el arco de HP alrededor de su centro, incluidas su estela y su punta de pincel. Los valores positivos giran en sentido horario.
hud.HpFillDirection = Sentido de llenado de HP
hud.HpFillDirection.tip = Normal sigue el orden de segmentos por defecto del arco; Invertido usa el orden contrario. El giro no cambia esta elección.
hud.HpFillDirection.normal = Normal
hud.HpFillDirection.reverse = Invertido
hud.HpOffsetX = Desplazamiento horizontal de HP
hud.HpOffsetX.tip = Mueve el arco de HP en horizontal tras girarlo. Los valores positivos lo desplazan a la derecha. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.HpOffsetY = Desplazamiento vertical de HP
hud.HpOffsetY.tip = Mueve el arco de HP en vertical tras girarlo. Los valores positivos lo desplazan hacia abajo. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.HpColor = Color de HP
hud.HpColor.tip = Color base del arco de HP. Plateado pálido por defecto.
hud.HpTrackColor = Color de fondo de HP
hud.HpTrackColor.tip = Color del fondo que queda tras el arco de HP.
hud.HpWarnColor = Color de aviso de HP bajo
hud.HpWarnColor.tip = Color que se usa cuando el HP baja del umbral de aviso.
hud.WarnThresholdHp = Umbral de HP bajo
hud.WarnThresholdHp.tip = Usa el color de aviso por debajo de esta proporción de HP. Por defecto es el 30%.
hud.HpBarOpacity = Opacidad del relleno de HP
hud.HpBarOpacity.tip = Opacidad de la parte llena del arco de HP. Los valores más altos lo hacen más visible.
hud.HpTrackOpacity = Opacidad del fondo de HP
hud.HpTrackOpacity.tip = Opacidad del fondo del arco de HP. Con 0 es totalmente transparente.
hud.HpShowGhost = Mostrar estela de HP
hud.HpShowGhost.tip = Deja una estela que se va reduciendo cuando baja el HP, para ver mejor cuánto se ha perdido.
hud.HpGhostOpacity = Opacidad de la estela de HP
hud.HpGhostOpacity.tip = Opacidad de la estela que queda cuando baja el HP.
hud.HpGhostColor = Color de la estela de HP
hud.HpGhostColor.tip = Color de la estela que queda cuando baja el HP. Rojo oscuro por defecto.
hud.HpVirtualColor = Color del daño pendiente de HP
hud.HpVirtualColor.tip = Daño diferido que aún no se ha descontado; se muestra al final del relleno de HP. Rojo sangre por defecto.
hud.HpShowTip = Mostrar punta de pincel de HP
hud.HpShowTip.tip = Muestra una punta de pincel al final del relleno de HP. La punta sigue visible aunque el HP llegue a cero.
hud.HpTipScale = Tamaño de la punta de HP
hud.HpTipScale.tip = Escala de la punta de pincel al final del relleno de HP.
hud.HpTipAngle = Ángulo de la punta de HP
hud.HpTipAngle.tip = Ángulo de la punta de pincel de HP respecto a la tangente del arco.

hud.QiArcEnabled = Mostrar arco de Sha-Chi
hud.QiArcEnabled.tip = Muestra el arco de Sha-Chi sin afectar a los iconos ni a las barras nativas del juego.
hud.QiArcSide = Lado del arco de Sha-Chi
hud.QiArcSide.tip = Elige el lado del arco antes de girarlo. Ambos arcos pueden compartir lado; sepáralos con el radio o el desplazamiento.
hud.QiArcSide.left = Izquierda
hud.QiArcSide.right = Derecha
hud.QiRadius = Radio del arco de Sha-Chi
hud.QiRadius.tip = Distancia del arco de Sha-Chi a su centro. Usa radios distintos para separar arcos del mismo lado.
hud.QiThickness = Grosor del arco de Sha-Chi
hud.QiThickness.tip = Anchura de los trazos de pincel del arco de Sha-Chi.
hud.QiArcSpan = Extensión del arco de Sha-Chi
hud.QiArcSpan.tip = Ángulo que abarca el arco de Sha-Chi. Con valores mayores el arco es más largo.
hud.QiSegments = Segmentos del arco de Sha-Chi
hud.QiSegments.tip = Más segmentos dan un arco más suave, pero afectan más al rendimiento.
hud.QiRotation = Giro del arco de Sha-Chi
hud.QiRotation.tip = Gira todo el arco de Sha-Chi alrededor de su centro, incluidas su estela y su punta de pincel. Los valores positivos giran en sentido horario.
hud.QiFillDirection = Sentido de llenado de Sha-Chi
hud.QiFillDirection.tip = Normal sigue el orden de segmentos por defecto del arco; Invertido usa el orden contrario. El giro no cambia esta elección.
hud.QiFillDirection.normal = Normal
hud.QiFillDirection.reverse = Invertido
hud.QiOffsetX = Desplazamiento horizontal de Sha-Chi
hud.QiOffsetX.tip = Mueve el arco de Sha-Chi en horizontal tras girarlo. Los valores positivos lo desplazan a la derecha. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.QiOffsetY = Desplazamiento vertical de Sha-Chi
hud.QiOffsetY.tip = Mueve el arco de Sha-Chi en vertical tras girarlo. Los valores positivos lo desplazan hacia abajo. Toma 1080p como referencia y sigue la escala de la interfaz.
hud.QiColor = Color de Sha-Chi
hud.QiColor.tip = Color base del arco de Sha-Chi. Dorado por defecto.
hud.QiTrackColor = Color de fondo de Sha-Chi
hud.QiTrackColor.tip = Color del fondo que queda tras el arco de Sha-Chi.
hud.QiWarnColor = Color de aviso de Sha-Chi bajo
hud.QiWarnColor.tip = Color que se usa por debajo del umbral de aviso de Sha-Chi. El aviso de rotura de guardia tiene prioridad.
hud.WarnThresholdQi = Umbral de Sha-Chi bajo
hud.WarnThresholdQi.tip = Usa el color de aviso por debajo de esta proporción de Sha-Chi. Por defecto es el 25%.
hud.QiBarOpacity = Opacidad del relleno de Sha-Chi
hud.QiBarOpacity.tip = Opacidad de la parte llena del arco de Sha-Chi. Los valores más altos lo hacen más visible.
hud.QiTrackOpacity = Opacidad del fondo de Sha-Chi
hud.QiTrackOpacity.tip = Opacidad del fondo del arco de Sha-Chi. Con 0 es totalmente transparente.
hud.QiShowGhost = Mostrar estela de Sha-Chi
hud.QiShowGhost.tip = Deja una estela que se va reduciendo cuando baja el Sha-Chi, para ver mejor cuánto se ha perdido.
hud.QiGhostOpacity = Opacidad de la estela de Sha-Chi
hud.QiGhostOpacity.tip = Opacidad de la estela que queda cuando baja el Sha-Chi.
hud.QiGhostColor = Color de la estela de Sha-Chi
hud.QiGhostColor.tip = Color de la estela que queda cuando baja el Sha-Chi. Dorado oscuro por defecto. Durante una rotura de guardia usa el color de rotura de guardia.
hud.QiShowTip = Mostrar punta de pincel de Sha-Chi
hud.QiShowTip.tip = Muestra una punta de pincel al final del relleno de Sha-Chi. La punta sigue visible aunque el Sha-Chi llegue a cero.
hud.QiTipScale = Tamaño de la punta de Sha-Chi
hud.QiTipScale.tip = Escala de la punta de pincel al final del relleno de Sha-Chi.
hud.QiTipAngle = Ángulo de la punta de Sha-Chi
hud.QiTipAngle.tip = Ángulo de la punta de pincel de Sha-Chi respecto a la tangente del arco.
hud.BreakHint = Aviso de rotura de guardia
hud.BreakHint.tip = Cambia el color del arco de Sha-Chi mientras la guardia del personaje está rota y lo restablece en cuanto se recupera. Desactívalo para no detectar la rotura.
hud.QiBreakColor = Color de rotura de guardia
hud.QiBreakColor.tip = Color del arco de Sha-Chi durante una rotura de guardia. Tiene prioridad sobre el color de aviso de Sha-Chi bajo.
hud.QiBreakTrackColor = Color de fondo en rotura
hud.QiBreakTrackColor.tip = Color del fondo del arco de Sha-Chi durante una rotura de guardia. Vuelve al color de fondo normal cuando termina.
hud.BreakDemo = Vista previa de rotura
hud.BreakDemo.tip = Oculta el panel temporalmente, vacía el arco de Sha-Chi y muestra el color de rotura de guardia durante 3 segundos; después todo se restablece y el panel vuelve a abrirse. No rompe la guardia del personaje.
hud.BreakDemo.run = Iniciar demostración

hud.BrushJitter = Variación del pincel
hud.BrushJitter.tip = Variación aleatoria de los trazos de pincel de ambos arcos. Con 0 los bordes quedan más limpios.
hud.StrokeOverlap = Solapamiento de trazos
hud.StrokeOverlap.tip = Longitud del pincel como múltiplo de la longitud de cada segmento. Auméntalo para tapar las juntas; redúcelo para que se noten los segmentos.
hud.GhostSpeed = Tiempo de recuperación de estela
hud.GhostSpeed.tip = Tiempo de recuperación de la estela de ambos arcos. Con valores más bajos alcanza antes el valor actual.
hud.GhostDelay = Retardo de la estela
hud.GhostDelay.tip = Tras una pérdida, la estela se mantiene este tiempo antes de recuperarse, para que veas cuánto has perdido. Los golpes seguidos reinician la espera; con 0 se recupera al instante.
hud.WarnFlashSpeed = Velocidad del parpadeo de aviso
hud.WarnFlashSpeed.tip = Frecuencia de parpadeo de los avisos de HP y Sha-Chi bajos. Con valores más altos parpadea más rápido.
hud.WarnFlashAmount = Intensidad del parpadeo de aviso
hud.WarnFlashAmount.tip = Variación de brillo durante los avisos de valor bajo. Con 0 no parpadea.

hud.NativeBars = HUD nativo del juego
hud.NativeBars.tip = Fija la longitud de las barras de HP y Sha-Chi de la esquina inferior izquierda, déjalas como están u ocúltalas por completo. La longitud fija se restablece sola cuando el juego vuelve a crear las barras.
hud.NativeBars.pin = Longitud fija
hud.NativeBars.dynamic = Sin cambios
hud.NativeBars.hide = Ocultar barras
hud.HudBarWidth = Anchura fija de barras nativas
hud.HudBarWidth.tip = -1 usa la longitud inicial de cada barra en el juego. Una anchura personalizada debe ser de al menos 48, en unidades de interfaz del juego. La longitud fija se restablece sola cuando el juego vuelve a crear las barras.
hud.NativePinRecover = Recuperar longitud fija
hud.NativePinRecover.tip = Intenta restablecer la longitud fija si deja de funcionar, normalmente en unos 1.5 s. Desactívalo para solo registrar los problemas, útil para diagnosticarlos. Funciona en los modos fijo y oculto.
hud.HudNumbers = Mostrar valores en barras
hud.HudNumbers.tip = Muestra los valores actual y máximo. Los números pueden seguir visibles aunque se oculten las barras nativas.
hud.HudNumberStyle = Estilo de números
hud.HudNumberStyle.tip = Centrado muestra texto blanco dentro de cada barra. Arriba y abajo coloca el HP sobre su barra y el Sha-Chi debajo de la suya.
hud.HudNumberStyle.center = Centrado dentro
hud.HudNumberStyle.side = Arriba y abajo

hud.MedicineHud = Mostrar pociones
hud.MedicineHud.tip = Muestra los iconos y la cantidad de las pociones equipadas.
hud.PureIcon = Mostrar Esencia de Sha-Chi
hud.PureIcon.tip = Muestra el icono y la cantidad de Esencia de Sha-Chi.
hud.BulletIcon = Mostrar Fuente Oscura
hud.BulletIcon.tip = Muestra el icono y la cantidad de Fuente Oscura; comparte la posición de grupo con la Esencia de Sha-Chi.
hud.UltChargeBar = Mostrar carga de Esencia
hud.UltChargeBar.tip = Rellena el icono de Esencia de Sha-Chi según su progreso de carga. No afecta al icono de Fuente Oscura.
hud.IconScale = Escala de iconos
hud.IconScale.tip = Escala iconos, números y espaciado a la vez, manteniendo fijo el borde inferior.
hud.MedicineHudX = Grupo de pociones X
hud.MedicineHudX.tip = Posición horizontal del grupo de pociones. -1 usa el diseño automático centrado abajo. También puedes ajustarla en el modo de arrastre.
hud.MedicineHudY = Grupo de pociones Y
hud.MedicineHudY.tip = Posición vertical del grupo de pociones. -1 usa el diseño automático centrado abajo. También puedes ajustarla en el modo de arrastre.
hud.UltHudX = Esencia y Fuente Oscura X
hud.UltHudX.tip = Posición horizontal compartida de la Esencia de Sha-Chi y la Fuente Oscura. -1 usa el diseño automático.
hud.UltHudY = Esencia y Fuente Oscura Y
hud.UltHudY.tip = Posición vertical compartida de la Esencia de Sha-Chi y la Fuente Oscura. -1 usa el diseño automático.
hud.Med1OffX = Desplazamiento X de poción 1
hud.Med1OffX.tip = Desplazamiento horizontal de la primera poción dentro de su grupo. En el modo de arrastre, arrastra el icono con el botón derecho para ajustarlo por separado.
hud.Med1OffY = Desplazamiento Y de poción 1
hud.Med1OffY.tip = Desplazamiento vertical de la primera poción dentro de su grupo. En el modo de arrastre, arrastra el icono con el botón derecho para ajustarlo por separado.
hud.Med2OffX = Desplazamiento X de poción 2
hud.Med2OffX.tip = Desplazamiento horizontal de la segunda poción dentro de su grupo. En el modo de arrastre, arrastra el icono con el botón derecho para ajustarlo por separado.
hud.Med2OffY = Desplazamiento Y de poción 2
hud.Med2OffY.tip = Desplazamiento vertical de la segunda poción dentro de su grupo. En el modo de arrastre, arrastra el icono con el botón derecho para ajustarlo por separado.
hud.Ult1OffX = Desplazamiento X de Esencia
hud.Ult1OffX.tip = Desplazamiento horizontal del icono de Esencia de Sha-Chi dentro de su grupo.
hud.Ult1OffY = Desplazamiento Y de Esencia
hud.Ult1OffY.tip = Desplazamiento vertical del icono de Esencia de Sha-Chi dentro de su grupo.
hud.Ult2OffX = Desplazamiento X de Fuente Oscura
hud.Ult2OffX.tip = Desplazamiento horizontal del icono de Fuente Oscura dentro de su grupo.
hud.Ult2OffY = Desplazamiento Y de Fuente Oscura
hud.Ult2OffY.tip = Desplazamiento vertical del icono de Fuente Oscura dentro de su grupo.

hud.Debug = Registro de depuración
hud.Debug.tip = Escribe información detallada de ejecución en Scripts/PBZMoHUD.log. Adjunta este archivo al informar de un problema.
hud.DragIcons = Arrastrar iconos
hud.DragIcons.tip = Oculta temporalmente el panel de configuración. Arrastra con el botón izquierdo para mover todo el grupo, con el botón derecho para mover un solo icono, y pulsa el botón central para restablecer las posiciones por defecto. Pulsa ESC para volver al panel de configuración.
hud.DragIcons.run = Empezar a arrastrar
hud.dragTip = Pulsa ESC para salir del modo de arrastre
