hud.name = PBZMoHUD
hud.about = Archi di HP e Sha-Chi regolabili singolarmente per Phantom Blade Zero, con icone di pozioni, Essenza di Sha-Chi e Fonte oscura. Legge solo i valori del giocatore senza modificare i dati di gioco.
hud.group.preset = Preimpostazioni
hud.group.behavior = Comportamento
hud.group.hpArc = Arco HP
hud.group.qiArc = Arco Sha-Chi
hud.group.look = Aspetto comune
hud.group.icons = Icone
hud.group.native = Barre di gioco
hud.group.advanced = Avanzate

hud.Layout = Disposizione
hud.Layout.tip = Scegli dove posizionare gli archi di HP e Sha-Chi.
hud.Layout.normal = Normale
hud.Layout.mirror = Speculare
hud.Layout.ipsilateral = Stesso lato

hud.FollowCharacter = Segui il personaggio
hud.FollowCharacter.tip = Gli archi seguono la posizione a schermo del personaggio. Disattiva per usare un ancoraggio fisso.
hud.FollowSmoothing = Tempo di smussatura
hud.FollowSmoothing.tip = Smussatura della posizione mentre segue il personaggio. 0 segue all'istante.
hud.FixedAnchorX = Ancoraggio fisso X
hud.FixedAnchorX.tip = Posizione orizzontale dell'ancoraggio come frazione della larghezza dello schermo, se non segue il personaggio. 0.5 è al centro.
hud.FixedAnchorY = Ancoraggio fisso Y
hud.FixedAnchorY.tip = Posizione verticale dell'ancoraggio come frazione dell'altezza dello schermo, se non segue il personaggio. 0.5 è al centro.
hud.AnchorHeight = Altezza ancoraggio
hud.AnchorHeight.tip = Scostamento in altezza sopra l'origine del personaggio, in unità del mondo Unreal (circa 1 cm ciascuna), non in pixel. I valori positivi alzano l'ancoraggio.
hud.AnchorOffsetX = Scostamento generale X
hud.AnchorOffsetX.tip = Sposta entrambi gli archi in orizzontale; i valori positivi spostano a destra. Si somma allo scostamento di ogni arco.
hud.AnchorOffsetY = Scostamento generale Y
hud.AnchorOffsetY.tip = Sposta entrambi gli archi in verticale; i valori positivi spostano in basso. Si somma allo scostamento di ogni arco.
hud.Visibility = Visualizzazione
hud.Visibility.tip = Segue la visibilità dell'HUD di gioco o nasconde anche ogni arco che resta pieno. Le icone non si nascondono con valori pieni.
hud.Visibility.hud = Come l'HUD di gioco
hud.Visibility.dynamic = Nascondi se pieno
hud.HideDelay = Ritardo per nascondere
hud.HideDelay.tip = Per quanto tempo un arco deve restare pieno prima di nascondersi. Riappare quando il valore cala.

hud.HpArcEnabled = Mostra arco HP
hud.HpArcEnabled.tip = Mostra l'arco HP senza influire sulle icone o sulle barre di gioco.
hud.HpArcSide = Lato arco HP
hud.HpArcSide.tip = Lato dell'arco prima della rotazione. Entrambi gli archi possono stare sullo stesso lato; separali con raggio o scostamento.
hud.HpArcSide.left = Sinistra
hud.HpArcSide.right = Destra
hud.HpRadius = Raggio arco HP
hud.HpRadius.tip = Distanza dell'arco HP dal suo centro. Valori più alti rendono l'arco più ampio.
hud.HpThickness = Spessore arco HP
hud.HpThickness.tip = Larghezza delle pennellate dell'arco HP.
hud.HpArcSpan = Ampiezza arco HP
hud.HpArcSpan.tip = Angolo coperto dall'arco HP. Valori più alti rendono l'arco più lungo.
hud.HpSegments = Segmenti arco HP
hud.HpSegments.tip = Più segmenti rendono l'arco più fluido, ma richiedono più prestazioni.
hud.HpRotation = Rotazione arco HP
hud.HpRotation.tip = Ruota l'intero arco HP attorno al suo centro, con scia e punta del pennello. I valori positivi ruotano in senso orario.
hud.HpFillDirection = Direzione riempimento HP
hud.HpFillDirection.tip = Normale segue l'ordine predefinito dei segmenti dell'arco; Invertito usa l'ordine opposto. La rotazione non cambia questa scelta.
hud.HpFillDirection.normal = Normale
hud.HpFillDirection.reverse = Invertito
hud.HpOffsetX = Scostamento X HP
hud.HpOffsetX.tip = Sposta l'arco HP in orizzontale dopo la rotazione; i valori positivi spostano a destra. Base 1080p, segue la scala dell'interfaccia.
hud.HpOffsetY = Scostamento Y HP
hud.HpOffsetY.tip = Sposta l'arco HP in verticale dopo la rotazione; i valori positivi spostano in basso. Base 1080p, segue la scala dell'interfaccia.
hud.HpColor = Colore HP
hud.HpColor.tip = Colore base dell'arco HP. Predefinito: argento pallido.
hud.HpTrackColor = Colore sfondo HP
hud.HpTrackColor.tip = Colore della traccia di sfondo dietro l'arco HP.
hud.HpWarnColor = Colore avviso HP bassi
hud.HpWarnColor.tip = Colore usato quando gli HP scendono sotto la soglia di avviso.
hud.WarnThresholdHp = Soglia HP bassi
hud.WarnThresholdHp.tip = Sotto questa percentuale di HP si usa il colore di avviso. Predefinito: 30%.
hud.HpBarOpacity = Opacità HP
hud.HpBarOpacity.tip = Opacità della parte piena dell'arco HP. Valori più alti la rendono più visibile.
hud.HpTrackOpacity = Opacità sfondo HP
hud.HpTrackOpacity.tip = Opacità della traccia di sfondo HP. 0 è del tutto trasparente.
hud.HpShowGhost = Mostra scia HP
hud.HpShowGhost.tip = Quando gli HP calano lascia una scia che si ritira, così la perdita è più facile da vedere.
hud.HpGhostOpacity = Opacità scia HP
hud.HpGhostOpacity.tip = Opacità della scia lasciata quando gli HP calano.
hud.HpGhostColor = Colore scia HP
hud.HpGhostColor.tip = Colore della scia lasciata quando gli HP calano. Predefinito: rosso scuro.
hud.HpVirtualColor = Colore danno HP in sospeso
hud.HpVirtualColor.tip = Danno ritardato non ancora sottratto, mostrato alla fine del riempimento HP. Predefinito: rosso sangue.
hud.HpShowTip = Mostra punta pennello HP
hud.HpShowTip.tip = Mostra una punta del pennello alla fine del riempimento HP. Resta visibile anche a 0 HP.
hud.HpTipScale = Dimensione punta HP
hud.HpTipScale.tip = Scala della punta del pennello alla fine del riempimento HP.
hud.HpTipAngle = Angolo punta HP
hud.HpTipAngle.tip = Angolo della punta del pennello HP rispetto alla tangente dell'arco.

hud.QiArcEnabled = Mostra arco Sha-Chi
hud.QiArcEnabled.tip = Mostra l'arco Sha-Chi senza influire sulle icone o sulle barre di gioco.
hud.QiArcSide = Lato arco Sha-Chi
hud.QiArcSide.tip = Lato dell'arco prima della rotazione. Entrambi gli archi possono stare sullo stesso lato; separali con raggio o scostamento.
hud.QiArcSide.left = Sinistra
hud.QiArcSide.right = Destra
hud.QiRadius = Raggio arco Sha-Chi
hud.QiRadius.tip = Distanza dell'arco Sha-Chi dal suo centro. Usa raggi diversi per separare archi sullo stesso lato.
hud.QiThickness = Spessore arco Sha-Chi
hud.QiThickness.tip = Larghezza delle pennellate dell'arco Sha-Chi.
hud.QiArcSpan = Ampiezza arco Sha-Chi
hud.QiArcSpan.tip = Angolo coperto dall'arco Sha-Chi. Valori più alti rendono l'arco più lungo.
hud.QiSegments = Segmenti arco Sha-Chi
hud.QiSegments.tip = Più segmenti rendono l'arco più fluido, ma richiedono più prestazioni.
hud.QiRotation = Rotazione arco Sha-Chi
hud.QiRotation.tip = Ruota l'intero arco Sha-Chi attorno al suo centro, con scia e punta del pennello. I valori positivi ruotano in senso orario.
hud.QiFillDirection = Direzione riempimento Sha-Chi
hud.QiFillDirection.tip = Normale segue l'ordine predefinito dei segmenti dell'arco; Invertito usa l'ordine opposto. La rotazione non cambia questa scelta.
hud.QiFillDirection.normal = Normale
hud.QiFillDirection.reverse = Invertito
hud.QiOffsetX = Scostamento X Sha-Chi
hud.QiOffsetX.tip = Sposta l'arco Sha-Chi in orizzontale dopo la rotazione; i valori positivi spostano a destra. Base 1080p, segue la scala dell'interfaccia.
hud.QiOffsetY = Scostamento Y Sha-Chi
hud.QiOffsetY.tip = Sposta l'arco Sha-Chi in verticale dopo la rotazione; i valori positivi spostano in basso. Base 1080p, segue la scala dell'interfaccia.
hud.QiColor = Colore Sha-Chi
hud.QiColor.tip = Colore base dell'arco Sha-Chi. Predefinito: oro.
hud.QiTrackColor = Colore sfondo Sha-Chi
hud.QiTrackColor.tip = Colore della traccia di sfondo dietro l'arco Sha-Chi.
hud.QiWarnColor = Colore avviso Sha-Chi basso
hud.QiWarnColor.tip = Colore usato sotto la soglia di avviso Sha-Chi. L'avviso di guardia rotta ha la precedenza.
hud.WarnThresholdQi = Soglia Sha-Chi basso
hud.WarnThresholdQi.tip = Sotto questa percentuale di Sha-Chi si usa il colore di avviso. Predefinito: 25%.
hud.QiBarOpacity = Opacità Sha-Chi
hud.QiBarOpacity.tip = Opacità della parte piena dell'arco Sha-Chi. Valori più alti la rendono più visibile.
hud.QiTrackOpacity = Opacità sfondo Sha-Chi
hud.QiTrackOpacity.tip = Opacità della traccia di sfondo Sha-Chi. 0 è del tutto trasparente.
hud.QiShowGhost = Mostra scia Sha-Chi
hud.QiShowGhost.tip = Quando lo Sha-Chi cala lascia una scia che si ritira, così la perdita è più facile da vedere.
hud.QiGhostOpacity = Opacità scia Sha-Chi
hud.QiGhostOpacity.tip = Opacità della scia lasciata quando lo Sha-Chi cala.
hud.QiGhostColor = Colore scia Sha-Chi
hud.QiGhostColor.tip = Colore della scia lasciata quando lo Sha-Chi cala. Predefinito: oro scuro. A guardia rotta usa il colore guardia rotta.
hud.QiShowTip = Mostra punta pennello Sha-Chi
hud.QiShowTip.tip = Mostra una punta del pennello alla fine del riempimento Sha-Chi. Resta visibile anche a 0 Sha-Chi.
hud.QiTipScale = Dimensione punta Sha-Chi
hud.QiTipScale.tip = Scala della punta del pennello alla fine del riempimento Sha-Chi.
hud.QiTipAngle = Angolo punta Sha-Chi
hud.QiTipAngle.tip = Angolo della punta del pennello Sha-Chi rispetto alla tangente dell'arco.
hud.BreakHint = Avviso guardia rotta
hud.BreakHint.tip = Cambia il colore dell'arco Sha-Chi mentre la guardia del personaggio è rotta e lo ripristina subito dopo. Disattiva per non rilevarla.
hud.QiBreakColor = Colore guardia rotta
hud.QiBreakColor.tip = Colore dell'arco Sha-Chi a guardia rotta. Ha la precedenza sul colore di avviso Sha-Chi basso.
hud.QiBreakTrackColor = Sfondo guardia rotta
hud.QiBreakTrackColor.tip = Colore di sfondo dell'arco Sha-Chi a guardia rotta. Al termine torna al colore di sfondo normale.
hud.BreakDemo = Anteprima guardia rotta
hud.BreakDemo.tip = Nasconde il pannello, svuota l'arco Sha-Chi e mostra il colore di guardia rotta per 3 secondi, poi ripristina tutto e riapre il pannello. Non rompe davvero la guardia del personaggio.
hud.BreakDemo.run = Avvia anteprima

hud.BrushJitter = Tremolio pennello
hud.BrushJitter.tip = Variazione casuale delle pennellate di entrambi gli archi. 0 dà i bordi più netti.
hud.StrokeOverlap = Sovrapposizione tratti
hud.StrokeOverlap.tip = Lunghezza del tratto come multiplo della lunghezza del segmento. Aumenta per coprire le giunture, riduci per far vedere i segmenti.
hud.GhostSpeed = Tempo di ritiro scia
hud.GhostSpeed.tip = Tempo di ritiro della scia di entrambi gli archi. Valori più bassi raggiungono prima il valore attuale.
hud.GhostDelay = Ritardo ritiro scia
hud.GhostDelay.tip = Dopo una perdita la scia resta ferma per questo tempo, così si vede quanto è stato perso. Colpi ravvicinati rinnovano l'attesa; 0 la ritira subito.
hud.WarnFlashSpeed = Velocità lampeggio
hud.WarnFlashSpeed.tip = Frequenza di lampeggio degli avvisi di HP e Sha-Chi bassi. Valori più alti lampeggiano più in fretta.
hud.WarnFlashAmount = Intensità lampeggio
hud.WarnFlashAmount.tip = Variazione di luminosità durante gli avvisi di valori bassi. 0 disattiva il lampeggio.

hud.NativeBars = HUD di gioco
hud.NativeBars.tip = Blocca la lunghezza delle barre HP e Sha-Chi in basso a sinistra, lasciale invariate o nascondile del tutto. La lunghezza fissa si ripristina da sola quando il gioco ricrea le barre.
hud.NativeBars.pin = Lunghezza fissa
hud.NativeBars.dynamic = Invariate
hud.NativeBars.hide = Nascondi barre
hud.HudBarWidth = Larghezza fissa barre
hud.HudBarWidth.tip = -1 usa la lunghezza iniziale di ogni barra. Una larghezza personalizzata deve essere almeno 48, in unità dell'interfaccia di gioco. La lunghezza fissa si ripristina da sola quando il gioco ricrea le barre.
hud.NativePinRecover = Ripristina lunghezza fissa
hud.NativePinRecover.tip = Ripristina la lunghezza fissa se smette di funzionare, di solito in circa 1.5 s. Disattiva per registrare solo i problemi, utile per la diagnosi. Vale sia per la modalità fissa sia per quella nascosta.
hud.HudNumbers = Mostra valori barre
hud.HudNumbers.tip = Mostra valore attuale e massimo. I numeri restano visibili anche con le barre di gioco nascoste.
hud.HudNumberStyle = Stile numeri
hud.HudNumberStyle.tip = Al centro mostra testo bianco dentro ogni barra. Sopra e sotto mette gli HP sopra la barra e lo Sha-Chi sotto.
hud.HudNumberStyle.center = Al centro
hud.HudNumberStyle.side = Sopra e sotto

hud.MedicineHud = Mostra pozioni
hud.MedicineHud.tip = Mostra icone e quantità delle pozioni equipaggiate.
hud.PureIcon = Mostra Essenza di Sha-Chi
hud.PureIcon.tip = Mostra icona e quantità dell'Essenza di Sha-Chi.
hud.BulletIcon = Mostra Fonte oscura
hud.BulletIcon.tip = Mostra icona e quantità della Fonte oscura, che condivide la posizione di gruppo con l'Essenza di Sha-Chi.
hud.UltChargeBar = Mostra carica Essenza
hud.UltChargeBar.tip = Riempie l'icona dell'Essenza di Sha-Chi con l'avanzamento della carica. Non influisce sull'icona della Fonte oscura.
hud.IconScale = Scala icone
hud.IconScale.tip = Scala insieme icone, numeri e spaziature, mantenendo fisso il bordo inferiore.
hud.MedicineHudX = Gruppo pozioni X
hud.MedicineHudX.tip = Posizione orizzontale del gruppo pozioni. -1 usa la disposizione automatica in basso al centro. Regolabile anche in modalità trascinamento.
hud.MedicineHudY = Gruppo pozioni Y
hud.MedicineHudY.tip = Posizione verticale del gruppo pozioni. -1 usa la disposizione automatica in basso al centro. Regolabile anche in modalità trascinamento.
hud.UltHudX = Essenza e Fonte oscura X
hud.UltHudX.tip = Posizione orizzontale comune di Essenza di Sha-Chi e Fonte oscura. -1 usa la disposizione automatica.
hud.UltHudY = Essenza e Fonte oscura Y
hud.UltHudY.tip = Posizione verticale comune di Essenza di Sha-Chi e Fonte oscura. -1 usa la disposizione automatica.
hud.Med1OffX = Scostamento X pozione 1
hud.Med1OffX.tip = Scostamento orizzontale della prima pozione nel gruppo. In modalità trascinamento trascinala col tasto destro per regolarla da sola.
hud.Med1OffY = Scostamento Y pozione 1
hud.Med1OffY.tip = Scostamento verticale della prima pozione nel gruppo. In modalità trascinamento trascinala col tasto destro per regolarla da sola.
hud.Med2OffX = Scostamento X pozione 2
hud.Med2OffX.tip = Scostamento orizzontale della seconda pozione nel gruppo. In modalità trascinamento trascinala col tasto destro per regolarla da sola.
hud.Med2OffY = Scostamento Y pozione 2
hud.Med2OffY.tip = Scostamento verticale della seconda pozione nel gruppo. In modalità trascinamento trascinala col tasto destro per regolarla da sola.
hud.Ult1OffX = Scostamento X Essenza
hud.Ult1OffX.tip = Scostamento orizzontale dell'icona dell'Essenza di Sha-Chi nel gruppo.
hud.Ult1OffY = Scostamento Y Essenza
hud.Ult1OffY.tip = Scostamento verticale dell'icona dell'Essenza di Sha-Chi nel gruppo.
hud.Ult2OffX = Scostamento X Fonte oscura
hud.Ult2OffX.tip = Scostamento orizzontale dell'icona della Fonte oscura nel gruppo.
hud.Ult2OffY = Scostamento Y Fonte oscura
hud.Ult2OffY.tip = Scostamento verticale dell'icona della Fonte oscura nel gruppo.

hud.Debug = Log di debug
hud.Debug.tip = Scrive informazioni dettagliate in Scripts/PBZMoHUD.log. Allega questo file quando segnali un problema.
hud.DragIcons = Trascina icone
hud.DragIcons.tip = Nasconde il pannello delle impostazioni. Tasto sinistro trascina il gruppo, tasto destro una singola icona, tasto centrale ripristina le posizioni predefinite. Premi ESC per tornare al pannello.
hud.DragIcons.run = Avvia trascinamento
hud.dragTip = Premi ESC per uscire dal trascinamento
