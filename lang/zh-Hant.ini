hud.name = PBZMoHUD
hud.about = 為影之刃零顯示可個別調整的血量與殺氣弧形條，以及藥瓶、精純殺氣和暗源圖示。只讀取玩家數值，不會變更遊戲資料。
hud.group.preset = 預設方案
hud.group.behavior = 行為
hud.group.hpArc = 血量弧
hud.group.qiArc = 殺氣弧
hud.group.look = 共用外觀
hud.group.icons = 圖示
hud.group.native = 原生條
hud.group.advanced = 進階

hud.Layout = 版面配置
hud.Layout.tip = 選擇血量弧和殺氣弧的位置。
hud.Layout.normal = 標準
hud.Layout.mirror = 鏡像
hud.Layout.ipsilateral = 同側

hud.FollowCharacter = 跟隨角色
hud.FollowCharacter.tip = 弧形條跟隨角色在螢幕上的位置；關閉後改用固定的螢幕錨點。
hud.FollowSmoothing = 跟隨平滑時間
hud.FollowSmoothing.tip = 跟隨角色時的位置平滑時間；0 表示立即跟隨。
hud.FixedAnchorX = 固定錨點水平位置
hud.FixedAnchorX.tip = 不跟隨角色時，錨點佔螢幕寬度的比例；0.5 為置中。
hud.FixedAnchorY = 固定錨點垂直位置
hud.FixedAnchorY.tip = 不跟隨角色時，錨點佔螢幕高度的比例；0.5 為置中。
hud.AnchorHeight = 角色錨點高度
hud.AnchorHeight.tip = 錨點相對角色原點的世界高度偏移（UE 世界單位，1 單位約 1 公分），不是螢幕像素；正值往上抬高。
hud.AnchorOffsetX = 整體水平偏移
hud.AnchorOffsetX.tip = 兩條弧一起水平移動，正值向右；會與各弧自身的偏移疊加。
hud.AnchorOffsetY = 整體垂直偏移
hud.AnchorOffsetY.tip = 兩條弧一起垂直移動，正值向下；會與各弧自身的偏移疊加。
hud.Visibility = 顯示時機
hud.Visibility.tip = 跟隨遊戲介面顯示或隱藏，或另外將持續全滿的弧形條個別隱藏；不影響圖示在全滿時的顯示。
hud.Visibility.hud = 跟隨遊戲介面
hud.Visibility.dynamic = 全滿後隱藏
hud.HideDelay = 全滿隱藏延遲
hud.HideDelay.tip = 每條弧維持全滿多久後隱藏；數值減少時會重新顯示。

hud.HpArcEnabled = 顯示血量弧
hud.HpArcEnabled.tip = 顯示血量弧形條，不影響圖示和遊戲原生條。
hud.HpArcSide = 血量弧位置
hud.HpArcSide.tip = 選擇旋轉前的弧形位置；兩條弧可放在同一側，再用半徑或偏移區隔。
hud.HpArcSide.left = 左側
hud.HpArcSide.right = 右側
hud.HpRadius = 血量弧半徑
hud.HpRadius.tip = 血量弧到圓心的距離；數值越大，弧形越寬。
hud.HpThickness = 血量弧粗細
hud.HpThickness.tip = 血量弧筆觸的寬度。
hud.HpArcSpan = 血量弧跨度
hud.HpArcSpan.tip = 血量弧涵蓋的角度；數值越大，弧形越長。
hud.HpSegments = 血量弧分段數
hud.HpSegments.tip = 分段越多，弧形越圓滑，但也更耗效能。
hud.HpRotation = 血量弧旋轉
hud.HpRotation.tip = 繞弧心旋轉整條血量弧，殘影和筆鋒一併旋轉；正值為順時針。
hud.HpFillDirection = 血量弧填充方向
hud.HpFillDirection.tip = 正向依弧線預設的分段順序填充，反向則依相反順序填充；旋轉不會改變所選順序。
hud.HpFillDirection.normal = 正向
hud.HpFillDirection.reverse = 反向
hud.HpOffsetX = 血量弧水平偏移
hud.HpOffsetX.tip = 旋轉後再水平移動血量弧，正值向右；以 1080p 為基準，隨介面縮放。
hud.HpOffsetY = 血量弧垂直偏移
hud.HpOffsetY.tip = 旋轉後再垂直移動血量弧，正值向下；以 1080p 為基準，隨介面縮放。
hud.HpColor = 血量顏色
hud.HpColor.tip = 血量弧的基本顏色；預設為淡銀色。
hud.HpTrackColor = 血量弧底軌顏色
hud.HpTrackColor.tip = 血量弧未填滿部分的底軌顏色。
hud.HpWarnColor = 低血量警告色
hud.HpWarnColor.tip = 血量低於警告門檻時使用的顏色。
hud.WarnThresholdHp = 低血量門檻
hud.WarnThresholdHp.tip = 血量比例低於此值時改用警告色；預設 30%。
hud.HpBarOpacity = 血量弧不透明度
hud.HpBarOpacity.tip = 血量弧已填充部分的不透明度；數值越大越清楚。
hud.HpTrackOpacity = 血量弧底軌不透明度
hud.HpTrackOpacity.tip = 血量弧底軌的不透明度；0 為完全透明。
hud.HpShowGhost = 顯示血量殘影
hud.HpShowGhost.tip = 血量減少時保留一段逐漸收回的殘影，方便看清損失量。
hud.HpGhostOpacity = 血量殘影不透明度
hud.HpGhostOpacity.tip = 血量減少時殘影的不透明度。
hud.HpGhostColor = 血量殘影顏色
hud.HpGhostColor.tip = 血量減少時殘影的顏色；預設為暗紅色。
hud.HpVirtualColor = 臨時損血顏色
hud.HpVirtualColor.tip = 斬馬刀受擊後尚未真正扣除的血量，接在血量填充末端顯示；預設為血紅色。
hud.HpShowTip = 顯示血量筆鋒
hud.HpShowTip.tip = 在血量弧的填充端顯示筆鋒；血量歸零時仍會保留筆鋒。
hud.HpTipScale = 血量筆鋒大小
hud.HpTipScale.tip = 血量弧填充端筆鋒的縮放倍率。
hud.HpTipAngle = 血量筆鋒角度
hud.HpTipAngle.tip = 血量筆鋒相對弧線切線的角度。

hud.QiArcEnabled = 顯示殺氣弧
hud.QiArcEnabled.tip = 顯示殺氣弧形條，不影響圖示和遊戲原生條。
hud.QiArcSide = 殺氣弧位置
hud.QiArcSide.tip = 選擇旋轉前的弧形位置；兩條弧可放在同一側，再用半徑或偏移區隔。
hud.QiArcSide.left = 左側
hud.QiArcSide.right = 右側
hud.QiRadius = 殺氣弧半徑
hud.QiRadius.tip = 殺氣弧到圓心的距離；同側雙弧可用不同半徑區隔。
hud.QiThickness = 殺氣弧粗細
hud.QiThickness.tip = 殺氣弧筆觸的寬度。
hud.QiArcSpan = 殺氣弧跨度
hud.QiArcSpan.tip = 殺氣弧涵蓋的角度；數值越大，弧形越長。
hud.QiSegments = 殺氣弧分段數
hud.QiSegments.tip = 分段越多，弧形越圓滑，但也更耗效能。
hud.QiRotation = 殺氣弧旋轉
hud.QiRotation.tip = 繞弧心旋轉整條殺氣弧，殘影和筆鋒一併旋轉；正值為順時針。
hud.QiFillDirection = 殺氣弧填充方向
hud.QiFillDirection.tip = 正向依弧線預設的分段順序填充，反向則依相反順序填充；旋轉不會改變所選順序。
hud.QiFillDirection.normal = 正向
hud.QiFillDirection.reverse = 反向
hud.QiOffsetX = 殺氣弧水平偏移
hud.QiOffsetX.tip = 旋轉後再水平移動殺氣弧，正值向右；以 1080p 為基準，隨介面縮放。
hud.QiOffsetY = 殺氣弧垂直偏移
hud.QiOffsetY.tip = 旋轉後再垂直移動殺氣弧，正值向下；以 1080p 為基準，隨介面縮放。
hud.QiColor = 殺氣顏色
hud.QiColor.tip = 殺氣弧的基本顏色；預設為金色。
hud.QiTrackColor = 殺氣弧底軌顏色
hud.QiTrackColor.tip = 殺氣弧未填滿部分的底軌顏色。
hud.QiWarnColor = 低殺氣警告色
hud.QiWarnColor.tip = 殺氣低於警告門檻時使用的顏色；破防提示優先。
hud.WarnThresholdQi = 低殺氣門檻
hud.WarnThresholdQi.tip = 殺氣比例低於此值時改用警告色；預設 25%。
hud.QiBarOpacity = 殺氣弧不透明度
hud.QiBarOpacity.tip = 殺氣弧已填充部分的不透明度；數值越大越清楚。
hud.QiTrackOpacity = 殺氣弧底軌不透明度
hud.QiTrackOpacity.tip = 殺氣弧底軌的不透明度；0 為完全透明。
hud.QiShowGhost = 顯示殺氣殘影
hud.QiShowGhost.tip = 殺氣減少時保留一段逐漸收回的殘影，方便看清損失量。
hud.QiGhostOpacity = 殺氣殘影不透明度
hud.QiGhostOpacity.tip = 殺氣減少時殘影的不透明度。
hud.QiGhostColor = 殺氣殘影顏色
hud.QiGhostColor.tip = 殺氣減少時殘影的顏色；預設為暗金色。破防期間改用破防顏色。
hud.QiShowTip = 顯示殺氣筆鋒
hud.QiShowTip.tip = 在殺氣弧的填充端顯示筆鋒；殺氣歸零時仍會保留筆鋒。
hud.QiTipScale = 殺氣筆鋒大小
hud.QiTipScale.tip = 殺氣弧填充端筆鋒的縮放倍率。
hud.QiTipAngle = 殺氣筆鋒角度
hud.QiTipAngle.tip = 殺氣筆鋒相對弧線切線的角度。
hud.BreakHint = 破防提示
hud.BreakHint.tip = 角色破防時改變殺氣弧顏色，恢復後立即還原；關閉後不偵測破防。
hud.QiBreakColor = 破防顏色
hud.QiBreakColor.tip = 破防期間殺氣弧使用的顏色，優先於低殺氣警告色。
hud.QiBreakTrackColor = 破防底軌顏色
hud.QiBreakTrackColor.tip = 破防期間殺氣弧底軌使用的顏色；破防結束後恢復為底軌顏色。
hud.BreakDemo = 預覽破防顏色
hud.BreakDemo.tip = 暫時收起面板，清空殺氣弧並顯示破防顏色 3 秒，之後自動還原並重新開啟面板；不會讓角色真的破防。
hud.BreakDemo.run = 開始示範

hud.BrushJitter = 筆觸抖動
hud.BrushJitter.tip = 兩條弧筆觸的隨機變化幅度；0 時邊緣最整齊。
hud.StrokeOverlap = 筆觸重疊倍率
hud.StrokeOverlap.tip = 每段筆刷長度相對分段長度的倍率；調大可蓋住接縫，調小會讓分段更明顯。
hud.GhostSpeed = 殘影收回時間
hud.GhostSpeed.tip = 兩條弧殘影的收回時間；越小越快追上目前數值。
hud.GhostDelay = 殘影收回延遲
hud.GhostDelay.tip = 受到損失後殘影先停留這段時間再開始收回，方便看清這次損失多少；連續受擊會重新計時，0 表示立即收回。
hud.WarnFlashSpeed = 警告閃爍速度
hud.WarnFlashSpeed.tip = 低血量與低殺氣警告的閃爍頻率；數值越大閃得越快。
hud.WarnFlashAmount = 警告閃爍幅度
hud.WarnFlashAmount.tip = 低數值警告時的明暗變化幅度；0 表示不閃爍。

hud.NativeBars = 遊戲原生 HUD
hud.NativeBars.tip = 遊戲左下角的血條和殺氣條可固定長度、維持原樣或整條隱藏。遊戲重建元件後會自動恢復固定長度。
hud.NativeBars.pin = 固定長度
hud.NativeBars.dynamic = 維持原樣
hud.NativeBars.hide = 整條隱藏
hud.HudBarWidth = 原生條固定寬度
hud.HudBarWidth.tip = -1 使用兩條各自的遊戲初始長度；自訂寬度至少為 48，單位為遊戲介面單位。遊戲重建元件後會自動恢復固定長度。
hud.NativePinRecover = 固定長度自動恢復
hud.NativePinRecover.tip = 固定長度失效時嘗試自動恢復，通常約 1.5 秒。關閉後只記錄異常，適合排除問題；固定與隱藏模式皆適用。
hud.HudNumbers = 顯示條上數值
hud.HudNumbers.tip = 顯示目前值與最大值；隱藏遊戲原生條後仍可顯示。
hud.HudNumberStyle = 數值樣式
hud.HudNumberStyle.tip = 置中樣式在條內顯示白字；上下樣式將血量放在條上方、殺氣放在條下方。
hud.HudNumberStyle.center = 條內置中
hud.HudNumberStyle.side = 條外上下

hud.MedicineHud = 顯示藥瓶
hud.MedicineHud.tip = 顯示已裝備藥瓶的圖示與數量。
hud.PureIcon = 顯示精純殺氣
hud.PureIcon.tip = 顯示精純殺氣的圖示與數量。
hud.BulletIcon = 顯示暗源
hud.BulletIcon.tip = 顯示暗源的圖示與數量，與精純殺氣共用同一組位置。
hud.UltChargeBar = 顯示精純殺氣充能
hud.UltChargeBar.tip = 將充能進度填入精純殺氣圖示內，不影響暗源圖示。
hud.IconScale = 圖示縮放
hud.IconScale.tip = 一併縮放圖示、數字與間距，並維持底邊位置。
hud.MedicineHudX = 藥瓶組水平位置
hud.MedicineHudX.tip = 藥瓶組的水平位置；-1 使用螢幕底部置中的自動配置。也可進入拖曳模式調整。
hud.MedicineHudY = 藥瓶組垂直位置
hud.MedicineHudY.tip = 藥瓶組的垂直位置；-1 使用螢幕底部置中的自動配置。也可進入拖曳模式調整。
hud.UltHudX = 精純殺氣與暗源水平位置
hud.UltHudX.tip = 精純殺氣與暗源共用的水平位置；-1 使用自動配置。
hud.UltHudY = 精純殺氣與暗源垂直位置
hud.UltHudY.tip = 精純殺氣與暗源共用的垂直位置；-1 使用自動配置。
hud.Med1OffX = 藥瓶一水平偏移
hud.Med1OffX.tip = 第一個藥瓶相對藥瓶組的水平偏移；拖曳模式下可用滑鼠右鍵單獨調整。
hud.Med1OffY = 藥瓶一垂直偏移
hud.Med1OffY.tip = 第一個藥瓶相對藥瓶組的垂直偏移；拖曳模式下可用滑鼠右鍵單獨調整。
hud.Med2OffX = 藥瓶二水平偏移
hud.Med2OffX.tip = 第二個藥瓶相對藥瓶組的水平偏移；拖曳模式下可用滑鼠右鍵單獨調整。
hud.Med2OffY = 藥瓶二垂直偏移
hud.Med2OffY.tip = 第二個藥瓶相對藥瓶組的垂直偏移；拖曳模式下可用滑鼠右鍵單獨調整。
hud.Ult1OffX = 精純殺氣水平偏移
hud.Ult1OffX.tip = 精純殺氣圖示相對組位置的水平偏移。
hud.Ult1OffY = 精純殺氣垂直偏移
hud.Ult1OffY.tip = 精純殺氣圖示相對組位置的垂直偏移。
hud.Ult2OffX = 暗源水平偏移
hud.Ult2OffX.tip = 暗源圖示相對組位置的水平偏移。
hud.Ult2OffY = 暗源垂直偏移
hud.Ult2OffY.tip = 暗源圖示相對組位置的垂直偏移。

hud.Debug = 除錯記錄
hud.Debug.tip = 將詳細執行資訊記錄到 Scripts/PBZMoHUD.log，回報問題時可提供此檔案。
hud.DragIcons = 拖曳圖示
hud.DragIcons.tip = 暫時收起設定介面：左鍵拖曳整組圖示，右鍵拖曳單一圖示，中鍵恢復預設位置。按 ESC 返回設定面板。
hud.DragIcons.run = 開始拖曳
hud.dragTip = 按 ESC 結束拖曳模式
