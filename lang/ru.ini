hud.name = PBZMoHUD
hud.about = Настраиваемые по отдельности дуги ОЗ и Ша-Ци для Phantom Blade Zero, а также значки зелий, эссенции Ша-Ци и Тёмного источника. Мод только считывает показатели игрока и не меняет данные игры.
hud.group.preset = Пресеты
hud.group.behavior = Поведение
hud.group.hpArc = Дуга ОЗ
hud.group.qiArc = Дуга Ша-Ци
hud.group.look = Общий вид
hud.group.icons = Значки
hud.group.native = Шкалы игры
hud.group.advanced = Дополнительно

hud.Layout = Расположение
hud.Layout.tip = Выберите, где разместить дуги ОЗ и Ша-Ци.
hud.Layout.normal = Обычное
hud.Layout.mirror = Зеркальное
hud.Layout.ipsilateral = С одной стороны

hud.FollowCharacter = Следовать за персонажем
hud.FollowCharacter.tip = Дуги перемещаются вслед за персонажем на экране. Если выключить, используется фиксированная точка привязки.
hud.FollowSmoothing = Сглаживание следования
hud.FollowSmoothing.tip = Время сглаживания позиции при следовании за персонажем. 0 — следовать мгновенно.
hud.FixedAnchorX = Точка привязки X
hud.FixedAnchorX.tip = Положение точки привязки по горизонтали в долях ширины экрана, когда следование выключено. 0.5 — по центру.
hud.FixedAnchorY = Точка привязки Y
hud.FixedAnchorY.tip = Положение точки привязки по вертикали в долях высоты экрана, когда следование выключено. 0.5 — по центру.
hud.AnchorHeight = Высота привязки
hud.AnchorHeight.tip = Смещение по высоте над точкой отсчёта персонажа в игровом мире (единицы Unreal, примерно 1 см каждая), а не в пикселях экрана. Положительные значения поднимают точку.
hud.AnchorOffsetX = Общее смещение по горизонтали
hud.AnchorOffsetX.tip = Сдвигает обе дуги по горизонтали, положительные значения — вправо. Складывается с собственным смещением каждой дуги.
hud.AnchorOffsetY = Общее смещение по вертикали
hud.AnchorOffsetY.tip = Сдвигает обе дуги по вертикали, положительные значения — вниз. Складывается с собственным смещением каждой дуги.
hud.Visibility = Когда показывать
hud.Visibility.tip = Следовать видимости интерфейса игры или дополнительно скрывать каждую дугу, пока она заполнена. На показ значков это не влияет.
hud.Visibility.hud = Как интерфейс игры
hud.Visibility.dynamic = Скрывать при полной
hud.HideDelay = Задержка скрытия
hud.HideDelay.tip = Сколько дуга должна оставаться полной, прежде чем скрыться. Она снова появится, когда значение уменьшится.

hud.HpArcEnabled = Показывать дугу ОЗ
hud.HpArcEnabled.tip = Показывает дугу ОЗ, не затрагивая значки и шкалы игры.
hud.HpArcSide = Сторона дуги ОЗ
hud.HpArcSide.tip = Сторона дуги до поворота. Обе дуги можно разместить с одной стороны и развести радиусом или смещением.
hud.HpArcSide.left = Слева
hud.HpArcSide.right = Справа
hud.HpRadius = Радиус дуги ОЗ
hud.HpRadius.tip = Расстояние от дуги ОЗ до её центра. Чем больше значение, тем шире дуга.
hud.HpThickness = Толщина дуги ОЗ
hud.HpThickness.tip = Ширина мазков кисти дуги ОЗ.
hud.HpArcSpan = Длина дуги ОЗ
hud.HpArcSpan.tip = Угол, который охватывает дуга ОЗ. Чем больше значение, тем длиннее дуга.
hud.HpSegments = Сегменты дуги ОЗ
hud.HpSegments.tip = Больше сегментов — плавнее дуга, но выше нагрузка.
hud.HpRotation = Поворот дуги ОЗ
hud.HpRotation.tip = Поворачивает всю дугу ОЗ вокруг центра вместе со шлейфом и кончиком кисти. Положительные значения — по часовой стрелке.
hud.HpFillDirection = Направление заполнения ОЗ
hud.HpFillDirection.tip = «Обычное» заполняет сегменты дуги в исходном порядке, «Обратное» — в противоположном. Поворот не меняет выбранный порядок.
hud.HpFillDirection.normal = Обычное
hud.HpFillDirection.reverse = Обратное
hud.HpOffsetX = Смещение ОЗ по горизонтали
hud.HpOffsetX.tip = Сдвигает дугу ОЗ по горизонтали после поворота, положительные значения — вправо. Рассчитано на 1080p и учитывает масштаб интерфейса.
hud.HpOffsetY = Смещение ОЗ по вертикали
hud.HpOffsetY.tip = Сдвигает дугу ОЗ по вертикали после поворота, положительные значения — вниз. Рассчитано на 1080p и учитывает масштаб интерфейса.
hud.HpColor = Цвет ОЗ
hud.HpColor.tip = Основной цвет дуги ОЗ. По умолчанию бледно-серебристый.
hud.HpTrackColor = Цвет подложки ОЗ
hud.HpTrackColor.tip = Цвет подложки под дугой ОЗ.
hud.HpWarnColor = Цвет при низких ОЗ
hud.HpWarnColor.tip = Цвет, когда ОЗ опускаются ниже порога предупреждения.
hud.WarnThresholdHp = Порог низких ОЗ
hud.WarnThresholdHp.tip = Ниже этой доли ОЗ используется цвет предупреждения. По умолчанию 30%.
hud.HpBarOpacity = Непрозрачность ОЗ
hud.HpBarOpacity.tip = Непрозрачность заполненной части дуги ОЗ. Чем больше, тем заметнее.
hud.HpTrackOpacity = Непрозрачность подложки ОЗ
hud.HpTrackOpacity.tip = Непрозрачность подложки ОЗ. 0 — полностью прозрачная.
hud.HpShowGhost = Шлейф ОЗ
hud.HpShowGhost.tip = При потере ОЗ остаётся постепенно сокращающийся шлейф, чтобы было видно, сколько потеряно.
hud.HpGhostOpacity = Непрозрачность шлейфа ОЗ
hud.HpGhostOpacity.tip = Непрозрачность шлейфа, остающегося при потере ОЗ.
hud.HpGhostColor = Цвет шлейфа ОЗ
hud.HpGhostColor.tip = Цвет шлейфа, остающегося при потере ОЗ. По умолчанию тёмно-красный.
hud.HpShowTip = Кончик кисти ОЗ
hud.HpShowTip.tip = Показывает кончик кисти на конце заполнения ОЗ. Он остаётся видимым даже при нуле ОЗ.
hud.HpTipScale = Размер кончика ОЗ
hud.HpTipScale.tip = Масштаб кончика кисти на конце заполнения ОЗ.
hud.HpTipAngle = Угол кончика ОЗ
hud.HpTipAngle.tip = Угол кончика кисти ОЗ относительно касательной к дуге.

hud.QiArcEnabled = Показывать дугу Ша-Ци
hud.QiArcEnabled.tip = Показывает дугу Ша-Ци, не затрагивая значки и шкалы игры.
hud.QiArcSide = Сторона дуги Ша-Ци
hud.QiArcSide.tip = Сторона дуги до поворота. Обе дуги можно разместить с одной стороны и развести радиусом или смещением.
hud.QiArcSide.left = Слева
hud.QiArcSide.right = Справа
hud.QiRadius = Радиус дуги Ша-Ци
hud.QiRadius.tip = Расстояние от дуги Ша-Ци до её центра. Разные радиусы помогают развести дуги на одной стороне.
hud.QiThickness = Толщина дуги Ша-Ци
hud.QiThickness.tip = Ширина мазков кисти дуги Ша-Ци.
hud.QiArcSpan = Длина дуги Ша-Ци
hud.QiArcSpan.tip = Угол, который охватывает дуга Ша-Ци. Чем больше значение, тем длиннее дуга.
hud.QiSegments = Сегменты дуги Ша-Ци
hud.QiSegments.tip = Больше сегментов — плавнее дуга, но выше нагрузка.
hud.QiRotation = Поворот дуги Ша-Ци
hud.QiRotation.tip = Поворачивает всю дугу Ша-Ци вокруг центра вместе со шлейфом и кончиком кисти. Положительные значения — по часовой стрелке.
hud.QiFillDirection = Направление заполнения Ша-Ци
hud.QiFillDirection.tip = «Обычное» заполняет сегменты дуги в исходном порядке, «Обратное» — в противоположном. Поворот не меняет выбранный порядок.
hud.QiFillDirection.normal = Обычное
hud.QiFillDirection.reverse = Обратное
hud.QiOffsetX = Смещение Ша-Ци по горизонтали
hud.QiOffsetX.tip = Сдвигает дугу Ша-Ци по горизонтали после поворота, положительные значения — вправо. Рассчитано на 1080p и учитывает масштаб интерфейса.
hud.QiOffsetY = Смещение Ша-Ци по вертикали
hud.QiOffsetY.tip = Сдвигает дугу Ша-Ци по вертикали после поворота, положительные значения — вниз. Рассчитано на 1080p и учитывает масштаб интерфейса.
hud.QiColor = Цвет Ша-Ци
hud.QiColor.tip = Основной цвет дуги Ша-Ци. По умолчанию золотой.
hud.QiTrackColor = Цвет подложки Ша-Ци
hud.QiTrackColor.tip = Цвет подложки под дугой Ша-Ци.
hud.QiWarnColor = Цвет при низком Ша-Ци
hud.QiWarnColor.tip = Цвет, когда Ша-Ци ниже порога предупреждения. Индикация пробития защиты важнее.
hud.WarnThresholdQi = Порог низкого Ша-Ци
hud.WarnThresholdQi.tip = Ниже этой доли Ша-Ци используется цвет предупреждения. По умолчанию 25%.
hud.QiBarOpacity = Непрозрачность Ша-Ци
hud.QiBarOpacity.tip = Непрозрачность заполненной части дуги Ша-Ци. Чем больше, тем заметнее.
hud.QiTrackOpacity = Непрозрачность подложки Ша-Ци
hud.QiTrackOpacity.tip = Непрозрачность подложки Ша-Ци. 0 — полностью прозрачная.
hud.QiShowGhost = Шлейф Ша-Ци
hud.QiShowGhost.tip = При потере Ша-Ци остаётся постепенно сокращающийся шлейф, чтобы было видно, сколько потеряно.
hud.QiGhostOpacity = Непрозрачность шлейфа Ша-Ци
hud.QiGhostOpacity.tip = Непрозрачность шлейфа, остающегося при потере Ша-Ци.
hud.QiGhostColor = Цвет шлейфа Ша-Ци
hud.QiGhostColor.tip = Цвет шлейфа, остающегося при потере Ша-Ци. По умолчанию тёмно-золотой. При пробитой защите используется цвет пробития защиты.
hud.QiShowTip = Кончик кисти Ша-Ци
hud.QiShowTip.tip = Показывает кончик кисти на конце заполнения Ша-Ци. Он остаётся видимым даже при нуле Ша-Ци.
hud.QiTipScale = Размер кончика Ша-Ци
hud.QiTipScale.tip = Масштаб кончика кисти на конце заполнения Ша-Ци.
hud.QiTipAngle = Угол кончика Ша-Ци
hud.QiTipAngle.tip = Угол кончика кисти Ша-Ци относительно касательной к дуге.
hud.BreakHint = Индикация пробития защиты
hud.BreakHint.tip = Меняет цвет дуги Ша-Ци, пока защита персонажа пробита, и сразу возвращает его после восстановления. Если выключить, пробитие не отслеживается.
hud.QiBreakColor = Цвет пробития защиты
hud.QiBreakColor.tip = Цвет дуги Ша-Ци при пробитой защите. Важнее цвета низкого Ша-Ци.
hud.QiBreakTrackColor = Подложка при пробитии
hud.QiBreakTrackColor.tip = Цвет подложки дуги Ша-Ци при пробитой защите. После восстановления возвращается обычный цвет подложки.
hud.BreakDemo = Просмотр цвета пробития
hud.BreakDemo.tip = Временно скрывает панель, опустошает дугу Ша-Ци и на 3 секунды показывает цвет пробития защиты, затем всё восстанавливает и снова открывает панель. Защита персонажа на самом деле не пробивается.
hud.BreakDemo.run = Запустить

hud.BrushJitter = Дрожание кисти
hud.BrushJitter.tip = Случайные колебания мазков обеих дуг. 0 — самые ровные края.
hud.StrokeOverlap = Перекрытие мазков
hud.StrokeOverlap.tip = Длина мазка относительно длины сегмента. Увеличьте, чтобы скрыть стыки; уменьшите, чтобы сегменты были заметнее.
hud.GhostSpeed = Время сокращения шлейфа
hud.GhostSpeed.tip = Время сокращения шлейфа обеих дуг. Чем меньше, тем быстрее он догоняет текущее значение.
hud.GhostDelay = Задержка шлейфа
hud.GhostDelay.tip = После потери шлейф держится столько времени, прежде чем начать сокращаться, чтобы было видно, сколько потеряно. Повторные удары продлевают задержку; 0 — сокращать сразу.
hud.WarnFlashSpeed = Скорость мигания
hud.WarnFlashSpeed.tip = Частота мигания при низких ОЗ и Ша-Ци. Чем больше, тем быстрее мигание.
hud.WarnFlashAmount = Сила мигания
hud.WarnFlashAmount.tip = Перепад яркости при предупреждении о низком значении. 0 — без мигания.

hud.NativeBars = Шкалы интерфейса игры
hud.NativeBars.tip = Зафиксировать длину шкал ОЗ и Ша-Ци в левом нижнем углу, оставить их как есть или полностью скрыть. Фиксированная длина восстанавливается автоматически, когда игра пересоздаёт шкалы.
hud.NativeBars.pin = Фиксированная длина
hud.NativeBars.dynamic = Без изменений
hud.NativeBars.hide = Скрыть полностью
hud.HudBarWidth = Фиксированная ширина шкал
hud.HudBarWidth.tip = -1 — исходная длина каждой шкалы в игре. Своя ширина должна быть не меньше 48 единиц интерфейса игры. Фиксированная длина восстанавливается, когда игра пересоздаёт шкалы.
hud.NativePinRecover = Восстанавливать длину
hud.NativePinRecover.tip = Пытается восстановить фиксированную длину, если она перестала действовать, обычно примерно за 1.5 секунды. Если выключить, проблемы только записываются в журнал — удобно для диагностики. Работает в режимах фиксации и скрытия.
hud.HudNumbers = Значения на шкалах
hud.HudNumbers.tip = Показывает текущее и максимальное значения. Числа могут оставаться видимыми и при скрытых шкалах игры.
hud.HudNumberStyle = Стиль чисел
hud.HudNumberStyle.tip = «По центру» — белый текст внутри каждой шкалы. «Над и под» — ОЗ над своей шкалой, Ша-Ци под своей.
hud.HudNumberStyle.center = По центру
hud.HudNumberStyle.side = Над и под

hud.MedicineHud = Показывать зелья
hud.MedicineHud.tip = Показывает значки и количество экипированных зелий.
hud.PureIcon = Эссенция Ша-Ци
hud.PureIcon.tip = Показывает значок и количество эссенции Ша-Ци.
hud.BulletIcon = Тёмный источник
hud.BulletIcon.tip = Показывает значок и количество Тёмного источника; позиция группы общая с эссенцией Ша-Ци.
hud.UltChargeBar = Заряд эссенции
hud.UltChargeBar.tip = Заполняет значок эссенции Ша-Ци по мере заряда. На значок Тёмного источника не влияет.
hud.IconScale = Масштаб значков
hud.IconScale.tip = Масштабирует значки, числа и отступы вместе, сохраняя положение нижнего края.
hud.MedicineHudX = Группа зелий X
hud.MedicineHudX.tip = Положение группы зелий по горизонтали. -1 — автоматически по центру внизу экрана. Можно также настроить в режиме перетаскивания.
hud.MedicineHudY = Группа зелий Y
hud.MedicineHudY.tip = Положение группы зелий по вертикали. -1 — автоматически по центру внизу экрана. Можно также настроить в режиме перетаскивания.
hud.UltHudX = Эссенция и Тёмный источник X
hud.UltHudX.tip = Общее положение эссенции Ша-Ци и Тёмного источника по горизонтали. -1 — автоматически.
hud.UltHudY = Эссенция и Тёмный источник Y
hud.UltHudY.tip = Общее положение эссенции Ша-Ци и Тёмного источника по вертикали. -1 — автоматически.
hud.Med1OffX = Зелье 1: смещение по горизонтали
hud.Med1OffX.tip = Смещение первого зелья внутри группы по горизонтали. В режиме перетаскивания значок можно двигать отдельно правой кнопкой.
hud.Med1OffY = Зелье 1: смещение по вертикали
hud.Med1OffY.tip = Смещение первого зелья внутри группы по вертикали. В режиме перетаскивания значок можно двигать отдельно правой кнопкой.
hud.Med2OffX = Зелье 2: смещение по горизонтали
hud.Med2OffX.tip = Смещение второго зелья внутри группы по горизонтали. В режиме перетаскивания значок можно двигать отдельно правой кнопкой.
hud.Med2OffY = Зелье 2: смещение по вертикали
hud.Med2OffY.tip = Смещение второго зелья внутри группы по вертикали. В режиме перетаскивания значок можно двигать отдельно правой кнопкой.
hud.Ult1OffX = Эссенция: смещение по горизонтали
hud.Ult1OffX.tip = Смещение значка эссенции Ша-Ци внутри группы по горизонтали.
hud.Ult1OffY = Эссенция: смещение по вертикали
hud.Ult1OffY.tip = Смещение значка эссенции Ша-Ци внутри группы по вертикали.
hud.Ult2OffX = Тёмный источник: смещение по горизонтали
hud.Ult2OffX.tip = Смещение значка Тёмного источника внутри группы по горизонтали.
hud.Ult2OffY = Тёмный источник: смещение по вертикали
hud.Ult2OffY.tip = Смещение значка Тёмного источника внутри группы по вертикали.

hud.Debug = Журнал отладки
hud.Debug.tip = Записывает подробные сведения о работе в Scripts/PBZMoHUD.log. Приложите этот файл, сообщая о проблеме.
hud.DragIcons = Перетаскивание значков
hud.DragIcons.tip = Временно скрывает панель настроек. Левая кнопка перемещает всю группу значков, правая — отдельный значок, средняя возвращает позиции по умолчанию. Нажмите ESC, чтобы вернуться к панели.
hud.DragIcons.run = Начать
hud.dragTip = Нажмите ESC, чтобы выйти из режима перетаскивания
