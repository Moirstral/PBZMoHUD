hud.name = PBZMoHUD
hud.about = 为影之刃零显示可独立调整的血量与杀气弧形条，以及药瓶、精纯杀气和暗源图标。只读取玩家数值，不改变游戏数据。
hud.group.preset = 预设
hud.group.behavior = 行为
hud.group.hpArc = 血量弧
hud.group.qiArc = 杀气弧
hud.group.look = 共享外观
hud.group.icons = 图标
hud.group.native = 原生条
hud.group.advanced = 高级

hud.Layout = 布局
hud.Layout.tip = 选择血量弧和杀气弧的位置
hud.Layout.normal = 正常
hud.Layout.mirror = 镜像
hud.Layout.ipsilateral = 同侧

hud.FollowCharacter = 跟随人物
hud.FollowCharacter.tip = 弧形条跟随人物的屏幕位置；关闭后使用固定屏幕锚点。
hud.FollowSmoothing = 跟随平滑时间
hud.FollowSmoothing.tip = 跟随人物时的位置平滑时间；0 表示立即跟随。
hud.FixedAnchorX = 固定锚点横向位置
hud.FixedAnchorX.tip = 不跟随人物时，锚点在屏幕宽度中的比例；0.5 为居中。
hud.FixedAnchorY = 固定锚点纵向位置
hud.FixedAnchorY.tip = 不跟随人物时，锚点在屏幕高度中的比例；0.5 为居中。
hud.AnchorHeight = 人物锚点高度
hud.AnchorHeight.tip = 锚点相对人物原点的世界高度偏移（UE 世界单位，1 单位约等于 1 厘米），不是屏幕像素；正值抬高。
hud.AnchorOffsetX = 整体横向偏移
hud.AnchorOffsetX.tip = 两条弧一起横向移动，正值向右；与每条弧自己的偏移叠加。
hud.AnchorOffsetY = 整体纵向偏移
hud.AnchorOffsetY.tip = 两条弧一起纵向移动，正值向下；与每条弧自己的偏移叠加。
hud.Visibility = 显示时机
hud.Visibility.tip = 跟随游戏界面显隐，或在此基础上分别隐藏持续满值的弧形条；不影响图标的满值显示。
hud.Visibility.hud = 跟随游戏界面
hud.Visibility.dynamic = 满值后隐藏
hud.HideDelay = 满值隐藏延迟
hud.HideDelay.tip = 每条弧保持满值多久后隐藏；数值减少时重新显示。

hud.HpArcEnabled = 显示血量弧
hud.HpArcEnabled.tip = 显示血量弧形条，不影响图标和游戏原生条。
hud.HpArcSide = 血量弧位置
hud.HpArcSide.tip = 选择旋转前的弧形位置；两条弧可放在同一侧，用半径或偏移分开。
hud.HpArcSide.left = 左侧
hud.HpArcSide.right = 右侧
hud.HpRadius = 血量弧半径
hud.HpRadius.tip = 血量弧到圆心的距离；增大后弧形更宽。
hud.HpThickness = 血量弧粗细
hud.HpThickness.tip = 血量弧笔触的宽度。
hud.HpArcSpan = 血量弧跨度
hud.HpArcSpan.tip = 血量弧覆盖的角度；数值越大，弧形越长。
hud.HpSegments = 血量弧分段数
hud.HpSegments.tip = 分段越多，弧形越圆滑，但也更耗性能。
hud.HpRotation = 血量弧旋转
hud.HpRotation.tip = 绕弧心旋转整条血量弧，残影和笔锋一起旋转；正值为顺时针。
hud.HpFillDirection = 血量弧填充方向
hud.HpFillDirection.tip = 正向按弧线默认段序填充，反向按相反段序填充；旋转不改变所选顺序。
hud.HpFillDirection.normal = 正向
hud.HpFillDirection.reverse = 反向
hud.HpOffsetX = 血量弧横向偏移
hud.HpOffsetX.tip = 旋转完成后横向移动血量弧，正值向右；以 1080p 为基准，随界面缩放。
hud.HpOffsetY = 血量弧纵向偏移
hud.HpOffsetY.tip = 旋转完成后纵向移动血量弧，正值向下；以 1080p 为基准，随界面缩放。
hud.HpColor = 血量颜色
hud.HpColor.tip = 血量弧的基础颜色；默认是淡银色。
hud.HpTrackColor = 血量弧底轨颜色
hud.HpTrackColor.tip = 血量弧未填满部分的底轨颜色。
hud.HpWarnColor = 低血量警告色
hud.HpWarnColor.tip = 血量低于警告阈值时使用的颜色。
hud.WarnThresholdHp = 低血量阈值
hud.WarnThresholdHp.tip = 血量比例低于此值时变为警告色；默认 30%。
hud.HpBarOpacity = 血量弧不透明度
hud.HpBarOpacity.tip = 血量弧已填充部分的不透明度；越大越清晰。
hud.HpTrackOpacity = 血量弧底轨不透明度
hud.HpTrackOpacity.tip = 血量弧底轨的不透明度；0 为完全透明。
hud.HpShowGhost = 显示血量残影
hud.HpShowGhost.tip = 血量减少时保留一段逐渐回收的残影，便于看清损失量。
hud.HpGhostOpacity = 血量残影不透明度
hud.HpGhostOpacity.tip = 血量减少时残影的不透明度。
hud.HpGhostColor = 血量残影颜色
hud.HpGhostColor.tip = 血量减少时残影的颜色；默认是暗红色。
hud.HpShowTip = 显示血量笔锋
hud.HpShowTip.tip = 在血量弧的填充端显示笔锋；血量归零时仍保留笔锋。
hud.HpTipScale = 血量笔锋大小
hud.HpTipScale.tip = 血量弧填充端笔锋的缩放倍数。
hud.HpTipAngle = 血量笔锋角度
hud.HpTipAngle.tip = 血量笔锋相对弧线切线的角度。

hud.QiArcEnabled = 显示杀气弧
hud.QiArcEnabled.tip = 显示杀气弧形条，不影响图标和游戏原生条。
hud.QiArcSide = 杀气弧位置
hud.QiArcSide.tip = 选择旋转前的弧形位置；两条弧可放在同一侧，用半径或偏移分开。
hud.QiArcSide.left = 左侧
hud.QiArcSide.right = 右侧
hud.QiRadius = 杀气弧半径
hud.QiRadius.tip = 杀气弧到圆心的距离；同侧双弧可用不同半径区分。
hud.QiThickness = 杀气弧粗细
hud.QiThickness.tip = 杀气弧笔触的宽度。
hud.QiArcSpan = 杀气弧跨度
hud.QiArcSpan.tip = 杀气弧覆盖的角度；数值越大，弧形越长。
hud.QiSegments = 杀气弧分段数
hud.QiSegments.tip = 分段越多，弧形越圆滑，但也更耗性能。
hud.QiRotation = 杀气弧旋转
hud.QiRotation.tip = 绕弧心旋转整条杀气弧，残影和笔锋一起旋转；正值为顺时针。
hud.QiFillDirection = 杀气弧填充方向
hud.QiFillDirection.tip = 正向按弧线默认段序填充，反向按相反段序填充；旋转不改变所选顺序。
hud.QiFillDirection.normal = 正向
hud.QiFillDirection.reverse = 反向
hud.QiOffsetX = 杀气弧横向偏移
hud.QiOffsetX.tip = 旋转完成后横向移动杀气弧，正值向右；以 1080p 为基准，随界面缩放。
hud.QiOffsetY = 杀气弧纵向偏移
hud.QiOffsetY.tip = 旋转完成后纵向移动杀气弧，正值向下；以 1080p 为基准，随界面缩放。
hud.QiColor = 杀气颜色
hud.QiColor.tip = 杀气弧的基础颜色；默认是金色。
hud.QiTrackColor = 杀气弧底轨颜色
hud.QiTrackColor.tip = 杀气弧未填满部分的底轨颜色。
hud.QiWarnColor = 低杀气警告色
hud.QiWarnColor.tip = 杀气低于警告阈值时使用的颜色；破防提示优先。
hud.WarnThresholdQi = 低杀气阈值
hud.WarnThresholdQi.tip = 杀气比例低于此值时变为警告色；默认 25%。
hud.QiBarOpacity = 杀气弧不透明度
hud.QiBarOpacity.tip = 杀气弧已填充部分的不透明度；越大越清晰。
hud.QiTrackOpacity = 杀气弧底轨不透明度
hud.QiTrackOpacity.tip = 杀气弧底轨的不透明度；0 为完全透明。
hud.QiShowGhost = 显示杀气残影
hud.QiShowGhost.tip = 杀气减少时保留一段逐渐回收的残影，便于看清损失量。
hud.QiGhostOpacity = 杀气残影不透明度
hud.QiGhostOpacity.tip = 杀气减少时残影的不透明度。
hud.QiGhostColor = 杀气残影颜色
hud.QiGhostColor.tip = 杀气减少时残影的颜色；默认是暗金色。破防期间改用破防颜色。
hud.QiShowTip = 显示杀气笔锋
hud.QiShowTip.tip = 在杀气弧的填充端显示笔锋；杀气归零时仍保留笔锋。
hud.QiTipScale = 杀气笔锋大小
hud.QiTipScale.tip = 杀气弧填充端笔锋的缩放倍数。
hud.QiTipAngle = 杀气笔锋角度
hud.QiTipAngle.tip = 杀气笔锋相对弧线切线的角度。
hud.BreakHint = 破防提示
hud.BreakHint.tip = 人物破防时改变杀气弧颜色，恢复后立即还原；关闭后不检测破防。
hud.QiBreakColor = 破防颜色
hud.QiBreakColor.tip = 破防期间杀气弧使用的颜色，优先于低杀气警告色。
hud.QiBreakTrackColor = 破防底条颜色
hud.QiBreakTrackColor.tip = 破防期间杀气弧底条使用的颜色；破防结束后恢复为底条颜色。
hud.BreakDemo = 预览破防颜色
hud.BreakDemo.tip = 临时收起面板，清空杀气弧并显示破防颜色 3 秒，然后自动恢复并放回面板；不会让人物真的破防。
hud.BreakDemo.run = 开始演示

hud.BrushJitter = 笔触抖动
hud.BrushJitter.tip = 两条弧的笔触随机变化幅度；0 的边缘最整齐。
hud.StrokeOverlap = 笔触重叠倍数
hud.StrokeOverlap.tip = 每段笔刷相对段长的倍数；增大可盖住接缝，减小会让分段更明显。
hud.GhostSpeed = 残影回收时间
hud.GhostSpeed.tip = 两条弧的残影回收时间；越小追上当前值越快。
hud.GhostDelay = 残影回收延迟
hud.GhostDelay.tip = 掉血后残影先保持这么久再开始回收，便于看清本次掉了多少；连续掉血会刷新保持时间，0 表示立即回收。
hud.WarnFlashSpeed = 警告闪烁速度
hud.WarnFlashSpeed.tip = 低血量和低杀气警告的闪烁频率；越大闪烁越快。
hud.WarnFlashAmount = 警告闪烁幅度
hud.WarnFlashAmount.tip = 低量警告时的明暗变化幅度；0 表示不闪烁。

hud.NativeBars = 游戏原生HUD
hud.NativeBars.tip = 游戏左下角的血条和杀气条可固定长度、保持原样或整条隐藏。固定长度会在游戏重建控件后自动恢复。
hud.NativeBars.pin = 固定长度
hud.NativeBars.dynamic = 保持原样
hud.NativeBars.hide = 整条隐藏
hud.HudBarWidth = 原生条固定宽度
hud.HudBarWidth.tip = -1 使用两条各自的游戏初始长度；指定宽度需至少为 48，单位为游戏界面单位。游戏重建控件后自动恢复固定长度。
hud.NativePinRecover = 固定长度自动恢复
hud.NativePinRecover.tip = 固定长度失效时尝试自动恢复，通常约 1.5 秒。关闭后仅记录异常，适合排查问题；固定和隐藏模式都可用。
hud.HudNumbers = 显示条上数值
hud.HudNumbers.tip = 显示当前值和最大值；隐藏游戏原生条后仍可显示。
hud.HudNumberStyle = 数值样式
hud.HudNumberStyle.tip = 居中样式在条内显示白字；上下样式将血量放在条上方、杀气放在条下方。
hud.HudNumberStyle.center = 条内居中
hud.HudNumberStyle.side = 条外上下

hud.MedicineHud = 显示药瓶
hud.MedicineHud.tip = 显示已装备药瓶的图标和数量。
hud.PureIcon = 显示精纯杀气
hud.PureIcon.tip = 显示精纯杀气图标和数量。
hud.BulletIcon = 显示暗源
hud.BulletIcon.tip = 显示暗源图标和数量，与精纯杀气共用一组位置。
hud.UltChargeBar = 显示精纯杀气充能
hud.UltChargeBar.tip = 将充能进度填充在精纯杀气图标内，不影响暗源图标。
hud.IconScale = 图标缩放
hud.IconScale.tip = 一起缩放图标、数字与间距，保持底边位置。
hud.MedicineHudX = 药瓶组横向位置
hud.MedicineHudX.tip = 药瓶组的横向位置；-1 使用屏幕底部居中的自动布局。也可进入拖动模式调整。
hud.MedicineHudY = 药瓶组纵向位置
hud.MedicineHudY.tip = 药瓶组的纵向位置；-1 使用屏幕底部居中的自动布局。也可进入拖动模式调整。
hud.UltHudX = 精纯杀气与暗源横向位置
hud.UltHudX.tip = 精纯杀气和暗源共用的横向位置；-1 使用自动布局。
hud.UltHudY = 精纯杀气与暗源纵向位置
hud.UltHudY.tip = 精纯杀气和暗源共用的纵向位置；-1 使用自动布局。
hud.Med1OffX = 药瓶一横向偏移
hud.Med1OffX.tip = 第一个药瓶相对药瓶组的横向偏移；拖动模式下可用右键单独调整。
hud.Med1OffY = 药瓶一纵向偏移
hud.Med1OffY.tip = 第一个药瓶相对药瓶组的纵向偏移；拖动模式下可用右键单独调整。
hud.Med2OffX = 药瓶二横向偏移
hud.Med2OffX.tip = 第二个药瓶相对药瓶组的横向偏移；拖动模式下可用右键单独调整。
hud.Med2OffY = 药瓶二纵向偏移
hud.Med2OffY.tip = 第二个药瓶相对药瓶组的纵向偏移；拖动模式下可用右键单独调整。
hud.Ult1OffX = 精纯杀气横向偏移
hud.Ult1OffX.tip = 精纯杀气图标相对组位置的横向偏移。
hud.Ult1OffY = 精纯杀气纵向偏移
hud.Ult1OffY.tip = 精纯杀气图标相对组位置的纵向偏移。
hud.Ult2OffX = 暗源横向偏移
hud.Ult2OffX.tip = 暗源图标相对组位置的横向偏移。
hud.Ult2OffY = 暗源纵向偏移
hud.Ult2OffY.tip = 暗源图标相对组位置的纵向偏移。

hud.Debug = 调试日志
hud.Debug.tip = 记录详细运行信息到 Scripts/PBZMoHUD.log，反馈问题时可提供此文件。
hud.DragIcons = 拖动图标
hud.DragIcons.tip = 临时收起配置界面：左键拖动整组图标，右键拖动单个图标，中键恢复默认位置。按 ESC 返回配置面板。
hud.DragIcons.run = 进入拖动模式
hud.dragTip = 按 ESC 退出拖动模式
