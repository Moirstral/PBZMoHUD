hud.QiGhostOpacity = ความทึบเงาค้าง Sha-Chi
hud.QiGhostOpacity.tip = ความทึบของเงาค้างที่เหลือเมื่อ Sha-Chi ลดลง
hud.QiGhostColor = สีเงาค้าง Sha-Chi
