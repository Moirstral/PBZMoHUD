hud.QiTipScale = ขนาดปลายพู่กัน Sha-Chi
hud.QiTipScale.tip = อัตราขยายของปลายพู่กันที่ปลายส่วนเติม Sha-Chi
hud.QiTipAngle = มุมปลายพู่กัน Sha-Chi
hud.QiTipAngle.tip = มุมของปลายพู่กัน Sha-Chi เทียบกับเส้นสัมผัสของส่วนโค้ง
hud.BreakHint = แจ้งเตือนการ์ดแตก
hud.BreakHint.tip = เปลี่ยนสีส่วนโค้ง Sha-Chi ขณะการ์ดของตัวละครแตก และคืนสีทันทีเมื่อฟื้นตัว ปิดเพื่อหยุดการตรวจจับ
hud.QiBreakColor = สีการ์ดแตก
hud.QiBreakColor.tip = สีของส่วนโค้ง Sha-Chi ระหว่างการ์ดแตก ใช้ก่อนสีเตือน Sha-Chi ต่ำ
hud.QiBreakTrackColor = สีรางพื้นขณะการ์ดแตก
hud.QiBreakTrackColor.tip = สีรางพื้นของส่วนโค้ง Sha-Chi ระหว่างการ์ดแตก และกลับเป็นสีรางพื้นปกติเมื่อการ์ดแตกสิ้นสุด
hud.BreakDemo = ดูตัวอย่างสีการ์ดแตก
