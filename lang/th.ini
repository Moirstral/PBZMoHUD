hud.BreakDemo.run = เริ่มสาธิต

hud.BrushJitter = การสั่นของฝีแปรง
hud.BrushJitter.tip = ความแปรผันแบบสุ่มของฝีแปรงในส่วนโค้งทั้งสอง ตั้งเป็น 0 เพื่อให้ขอบเรียบที่สุด
hud.StrokeOverlap = การซ้อนฝีแปรง
hud.StrokeOverlap.tip = ความยาวแปรงเป็นจำนวนเท่าของความยาวช่วง เพิ่มเพื่อปิดรอยต่อ ลดเพื่อให้เห็นแต่ละช่วงชัดขึ้น
hud.GhostSpeed = เวลาหดเงาค้าง
hud.GhostSpeed.tip = เวลาที่เงาค้างของส่วนโค้งทั้งสองใช้หดกลับ ค่ายิ่งน้อยยิ่งตามทันค่าปัจจุบันเร็ว
hud.GhostDelay = หน่วงเวลาหดเงาค้าง
hud.GhostDelay.tip = หลังค่าลดลง เงาค้างจะค้างไว้ตามเวลานี้ก่อนเริ่มหด เพื่อให้เห็นว่าเสียไปเท่าใด การโดนต่อเนื่องจะเริ่มนับเวลาค้างใหม่ 0 คือหดทันที
hud.WarnFlashSpeed = ความเร็วกะพริบเตือน
hud.WarnFlashSpeed.tip = ความถี่การกะพริบเตือนเมื่อ HP และ Sha-Chi ต่ำ ค่ายิ่งมากยิ่งกะพริบเร็ว
hud.WarnFlashAmount = ความแรงกะพริบเตือน
hud.WarnFlashAmount.tip = ระดับการเปลี่ยนความสว่างขณะเตือนค่าต่ำ ตั้งเป็น 0 เพื่อไม่ให้กะพริบ

hud.NativeBars = HUD ดั้งเดิมของเกม
