hud.name = PBZMoHUD
hud.about = ส่วนโค้ง HP และ Sha-Chi ที่ปรับแยกกันได้สำหรับ Phantom Blade Zero พร้อมไอคอนขวดยา แก่น Sha-Chi และต้นกำเนิดมืด อ่านค่าของผู้เล่นเท่านั้น ไม่เปลี่ยนข้อมูลเกม
hud.group.preset = พรีเซ็ต
hud.group.behavior = พฤติกรรม
hud.group.hpArc = ส่วนโค้ง HP
hud.group.qiArc = ส่วนโค้ง Sha-Chi
hud.group.look = รูปลักษณ์ร่วม
hud.group.icons = ไอคอน
hud.group.native = แถบดั้งเดิม
hud.group.advanced = ขั้นสูง

hud.Layout = เลย์เอาต์
hud.Layout.tip = เลือกตำแหน่งของส่วนโค้ง HP และส่วนโค้ง Sha-Chi
hud.Layout.normal = ปกติ
hud.Layout.mirror = สะท้อน
hud.Layout.ipsilateral = ด้านเดียวกัน

hud.FollowCharacter = ติดตามตัวละคร
hud.FollowCharacter.tip = ให้ส่วนโค้งเคลื่อนตามตำแหน่งของตัวละครบนจอ ปิดเพื่อใช้จุดยึดคงที่บนจอ
hud.FollowSmoothing = เวลาปรับนุ่มการติดตาม
hud.FollowSmoothing.tip = เวลาปรับตำแหน่งให้นุ่มนวลขณะติดตามตัวละคร 0 คือติดตามทันที
hud.FixedAnchorX = จุดยึดคงที่แนวนอน
hud.FixedAnchorX.tip = ตำแหน่งจุดยึดเป็นสัดส่วนของความกว้างจอเมื่อไม่ติดตามตัวละคร 0.5 คือกึ่งกลาง
hud.FixedAnchorY = จุดยึดคงที่แนวตั้ง
hud.FixedAnchorY.tip = ตำแหน่งจุดยึดเป็นสัดส่วนของความสูงจอเมื่อไม่ติดตามตัวละคร 0.5 คือกึ่งกลาง
hud.AnchorHeight = ความสูงจุดยึดตัวละคร
hud.AnchorHeight.tip = ระยะยกจุดยึดเหนือจุดกำเนิดของตัวละครในโลกเกม (หน่วยโลกของ Unreal ราว 1 ซม. ต่อหน่วย) ไม่ใช่พิกเซลบนจอ ค่าบวกยกจุดยึดขึ้น
hud.AnchorOffsetX = ระยะเลื่อนแนวนอนรวม
hud.AnchorOffsetX.tip = เลื่อนส่วนโค้งทั้งสองในแนวนอน ค่าบวกเลื่อนไปทางขวา และบวกรวมกับระยะเลื่อนของแต่ละส่วนโค้ง
hud.AnchorOffsetY = ระยะเลื่อนแนวตั้งรวม
hud.AnchorOffsetY.tip = เลื่อนส่วนโค้งทั้งสองในแนวตั้ง ค่าบวกเลื่อนลง และบวกรวมกับระยะเลื่อนของแต่ละส่วนโค้ง
hud.Visibility = การแสดงผล
hud.Visibility.tip = แสดงตาม HUD ของเกม หรือซ่อนแต่ละส่วนโค้งเพิ่มเติมเมื่อเต็มค้างไว้ ไม่มีผลกับการแสดงไอคอน
hud.Visibility.hud = ตาม HUD ของเกม
hud.Visibility.dynamic = ซ่อนเมื่อเต็ม
hud.HideDelay = หน่วงเวลาซ่อนเมื่อเต็ม
hud.HideDelay.tip = เวลาที่แต่ละส่วนโค้งต้องเต็มค้างไว้ก่อนซ่อน และจะแสดงอีกครั้งเมื่อค่าลดลง

hud.HpArcEnabled = แสดงส่วนโค้ง HP
hud.HpArcEnabled.tip = แสดงส่วนโค้ง HP โดยไม่มีผลกับไอคอนหรือแถบดั้งเดิมของเกม
hud.HpArcSide = ด้านส่วนโค้ง HP
hud.HpArcSide.tip = เลือกด้านของส่วนโค้งก่อนหมุน ส่วนโค้งทั้งสองอยู่ด้านเดียวกันได้ โดยแยกด้วยรัศมีหรือระยะเลื่อน
hud.HpArcSide.left = ซ้าย
hud.HpArcSide.right = ขวา
hud.HpRadius = รัศมีส่วนโค้ง HP
hud.HpRadius.tip = ระยะจากส่วนโค้ง HP ถึงจุดศูนย์กลาง ค่ายิ่งมากส่วนโค้งยิ่งกว้าง
hud.HpThickness = ความหนาส่วนโค้ง HP
hud.HpThickness.tip = ความกว้างของฝีแปรงในส่วนโค้ง HP
hud.HpArcSpan = มุมกว้างส่วนโค้ง HP
hud.HpArcSpan.tip = มุมที่ส่วนโค้ง HP ครอบคลุม ค่ายิ่งมากส่วนโค้งยิ่งยาว
hud.HpSegments = จำนวนช่วงส่วนโค้ง HP
hud.HpSegments.tip = ยิ่งมีหลายช่วง ส่วนโค้งยิ่งเรียบ แต่ใช้ทรัพยากรมากขึ้น
hud.HpRotation = การหมุนส่วนโค้ง HP
hud.HpRotation.tip = หมุนส่วนโค้ง HP ทั้งเส้นรอบจุดศูนย์กลาง รวมถึงเงาค้างและปลายพู่กัน ค่าบวกหมุนตามเข็มนาฬิกา
hud.HpFillDirection = ทิศทางการเติม HP
hud.HpFillDirection.tip = ปกติจะเติมตามลำดับช่วงเริ่มต้นของส่วนโค้ง กลับด้านจะเติมตามลำดับตรงข้าม การหมุนไม่เปลี่ยนลำดับที่เลือก
hud.HpFillDirection.normal = ปกติ
hud.HpFillDirection.reverse = กลับด้าน
hud.HpOffsetX = ระยะเลื่อน HP แนวนอน
hud.HpOffsetX.tip = เลื่อนส่วนโค้ง HP ในแนวนอนหลังหมุน ค่าบวกเลื่อนไปทางขวา อิงความละเอียด 1080p และปรับตามสเกล UI
hud.HpOffsetY = ระยะเลื่อน HP แนวตั้ง
hud.HpOffsetY.tip = เลื่อนส่วนโค้ง HP ในแนวตั้งหลังหมุน ค่าบวกเลื่อนลง อิงความละเอียด 1080p และปรับตามสเกล UI
hud.HpColor = สี HP
hud.HpColor.tip = สีหลักของส่วนโค้ง HP ค่าเริ่มต้นเป็นสีเงินอ่อน
hud.HpTrackColor = สีรางพื้น HP
hud.HpTrackColor.tip = สีของรางพื้นหลังในส่วนที่ยังไม่เต็มของส่วนโค้ง HP
hud.HpWarnColor = สีเตือน HP ต่ำ
hud.HpWarnColor.tip = สีที่ใช้เมื่อ HP ต่ำกว่าเกณฑ์เตือน
hud.WarnThresholdHp = เกณฑ์ HP ต่ำ
hud.WarnThresholdHp.tip = ใช้สีเตือนเมื่อสัดส่วน HP ต่ำกว่าค่านี้ ค่าเริ่มต้นคือ 30%
hud.HpBarOpacity = ความทึบส่วนเติม HP
hud.HpBarOpacity.tip = ความทึบของส่วนที่เติมแล้วในส่วนโค้ง HP ค่ายิ่งมากยิ่งเห็นชัด
hud.HpTrackOpacity = ความทึบรางพื้น HP
hud.HpTrackOpacity.tip = ความทึบของรางพื้นหลัง HP ตั้งเป็น 0 เพื่อให้โปร่งใสทั้งหมด
hud.HpShowGhost = แสดงเงาค้าง HP
hud.HpShowGhost.tip = ทิ้งเงาค้างที่ค่อยๆ หดลงเมื่อ HP ลด เพื่อให้เห็นปริมาณที่เสียไปได้ชัดขึ้น
hud.HpGhostOpacity = ความทึบเงาค้าง HP
hud.HpGhostOpacity.tip = ความทึบของเงาค้างที่เหลือเมื่อ HP ลดลง
hud.HpGhostColor = สีเงาค้าง HP
hud.HpGhostColor.tip = สีของเงาค้างที่เหลือเมื่อ HP ลดลง ค่าเริ่มต้นเป็นสีแดงเข้ม
hud.HpVirtualColor = สีความเสียหาย HP ที่รอหัก
hud.HpVirtualColor.tip = ความเสียหายแบบหน่วงเวลาที่ยังไม่ถูกหักจริง แสดงที่ปลายแถบ HP ค่าเริ่มต้นเป็นสีแดงเลือด
hud.HpShowTip = แสดงปลายพู่กัน HP
hud.HpShowTip.tip = แสดงปลายพู่กันที่ปลายส่วนเติม HP และยังคงแสดงอยู่แม้ HP เป็นศูนย์
hud.HpTipScale = ขนาดปลายพู่กัน HP
hud.HpTipScale.tip = อัตราขยายของปลายพู่กันที่ปลายส่วนเติม HP
hud.HpTipAngle = มุมปลายพู่กัน HP
hud.HpTipAngle.tip = มุมของปลายพู่กัน HP เทียบกับเส้นสัมผัสของส่วนโค้ง

hud.QiArcEnabled = แสดงส่วนโค้ง Sha-Chi
