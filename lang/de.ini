hud.name = PBZMoHUD
hud.about = Einzeln anpassbare HP- und Sha-Chi-Bögen für Phantom Blade Zero, dazu Symbole für Tränke, Sha-Chi-Essenz und Dunkle Quelle. Liest nur Spielerwerte und ändert keine Spieldaten.
hud.group.preset = Vorlagen
hud.group.behavior = Verhalten
hud.group.hpArc = HP-Bogen
hud.group.qiArc = Sha-Chi-Bogen
hud.group.look = Gemeinsames Aussehen
hud.group.icons = Symbole
hud.group.native = Spielleisten
hud.group.advanced = Erweitert

hud.Layout = Anordnung
hud.Layout.tip = Legt fest, wo HP- und Sha-Chi-Bogen platziert werden.
hud.Layout.normal = Normal
hud.Layout.mirror = Gespiegelt
hud.Layout.ipsilateral = Gleiche Seite

hud.FollowCharacter = Figur folgen
hud.FollowCharacter.tip = Die Bögen folgen der Bildschirmposition der Figur. Aus: fester Bildschirmanker.
hud.FollowSmoothing = Glättungszeit
hud.FollowSmoothing.tip = Glättung der Position beim Folgen der Figur. 0 folgt sofort.
hud.FixedAnchorX = Fester Anker X
hud.FixedAnchorX.tip = Horizontale Ankerposition als Anteil der Bildschirmbreite, wenn der Figur nicht gefolgt wird. 0.5 ist mittig.
hud.FixedAnchorY = Fester Anker Y
hud.FixedAnchorY.tip = Vertikale Ankerposition als Anteil der Bildschirmhöhe, wenn der Figur nicht gefolgt wird. 0.5 ist mittig.
hud.AnchorHeight = Ankerhöhe an Figur
hud.AnchorHeight.tip = Höhenversatz über dem Ursprung der Figur in Weltkoordinaten (Unreal-Einheiten, etwa 1 cm je Einheit), keine Bildschirmpixel. Positive Werte heben den Anker an.
hud.AnchorOffsetX = Gesamtversatz horizontal
hud.AnchorOffsetX.tip = Verschiebt beide Bögen horizontal, positive Werte nach rechts. Der eigene Versatz jedes Bogens wird addiert.
hud.AnchorOffsetY = Gesamtversatz vertikal
hud.AnchorOffsetY.tip = Verschiebt beide Bögen vertikal, positive Werte nach unten. Der eigene Versatz jedes Bogens wird addiert.
hud.Visibility = Anzeige
hud.Visibility.tip = Folgt der Sichtbarkeit des Spiel-HUDs oder blendet zusätzlich jeden Bogen aus, der voll bleibt. Symbole werden bei vollen Werten nicht ausgeblendet.
hud.Visibility.hud = Wie Spiel-HUD
hud.Visibility.dynamic = Bei voll ausblenden
hud.HideDelay = Ausblendverzögerung
hud.HideDelay.tip = Wie lange ein Bogen voll bleiben muss, bevor er ausgeblendet wird. Sinkt der Wert, erscheint er wieder.

hud.HpArcEnabled = HP-Bogen anzeigen
hud.HpArcEnabled.tip = Zeigt den HP-Bogen an, ohne Symbole oder Spielleisten zu beeinflussen.
hud.HpArcSide = HP-Bogen-Seite
hud.HpArcSide.tip = Seite des Bogens vor der Drehung. Beide Bögen können auf einer Seite liegen; trenne sie über Radius oder Versatz.
hud.HpArcSide.left = Links
hud.HpArcSide.right = Rechts
hud.HpRadius = HP-Bogen-Radius
hud.HpRadius.tip = Abstand des HP-Bogens zu seinem Mittelpunkt. Größere Werte machen den Bogen weiter.
hud.HpThickness = HP-Bogen-Stärke
hud.HpThickness.tip = Breite der Pinselstriche des HP-Bogens.
hud.HpArcSpan = HP-Bogen-Spanne
hud.HpArcSpan.tip = Winkel, den der HP-Bogen abdeckt. Größere Werte machen den Bogen länger.
hud.HpSegments = HP-Bogen-Segmente
hud.HpSegments.tip = Mehr Segmente ergeben einen runderen Bogen, kosten aber mehr Leistung.
hud.HpRotation = HP-Bogen-Drehung
hud.HpRotation.tip = Dreht den ganzen HP-Bogen samt Verlustspur und Pinselspitze um seinen Mittelpunkt. Positive Werte drehen im Uhrzeigersinn.
hud.HpFillDirection = HP-Füllrichtung
hud.HpFillDirection.tip = Normal folgt der Standardreihenfolge der Bogensegmente, Umgekehrt der entgegengesetzten Reihenfolge. Die Drehung ändert diese Wahl nicht.
hud.HpFillDirection.normal = Normal
hud.HpFillDirection.reverse = Umgekehrt
hud.HpOffsetX = HP-Versatz horizontal
hud.HpOffsetX.tip = Verschiebt den HP-Bogen nach der Drehung horizontal, positive Werte nach rechts. Basis 1080p, skaliert mit der Oberfläche.
hud.HpOffsetY = HP-Versatz vertikal
hud.HpOffsetY.tip = Verschiebt den HP-Bogen nach der Drehung vertikal, positive Werte nach unten. Basis 1080p, skaliert mit der Oberfläche.
hud.HpColor = HP-Farbe
hud.HpColor.tip = Grundfarbe des HP-Bogens. Standard ist ein blasses Silber.
hud.HpTrackColor = HP-Hintergrundfarbe
hud.HpTrackColor.tip = Farbe der Hintergrundspur hinter dem HP-Bogen.
hud.HpWarnColor = Warnfarbe niedrige HP
hud.HpWarnColor.tip = Farbe, wenn die HP unter die Warnschwelle fallen.
hud.WarnThresholdHp = Schwelle niedrige HP
hud.WarnThresholdHp.tip = Unter diesem HP-Anteil wird die Warnfarbe genutzt. Standard ist 30%.
hud.HpBarOpacity = HP-Deckkraft
hud.HpBarOpacity.tip = Deckkraft des gefüllten HP-Bogens. Höhere Werte sind deutlicher sichtbar.
hud.HpTrackOpacity = HP-Hintergrunddeckkraft
hud.HpTrackOpacity.tip = Deckkraft der HP-Hintergrundspur. 0 ist völlig transparent.
hud.HpShowGhost = HP-Verlustspur anzeigen
hud.HpShowGhost.tip = Bei sinkenden HP bleibt eine schrumpfende Spur zurück, die den Verlust gut erkennbar macht.
hud.HpGhostOpacity = HP-Verlustspur-Deckkraft
hud.HpGhostOpacity.tip = Deckkraft der Spur, die bei sinkenden HP zurückbleibt.
hud.HpGhostColor = HP-Verlustspur-Farbe
hud.HpGhostColor.tip = Farbe der Spur, die bei sinkenden HP zurückbleibt. Standard ist Dunkelrot.
hud.HpVirtualColor = Farbe für ausstehenden HP-Schaden
hud.HpVirtualColor.tip = Verzögerter Schaden, der noch nicht abgezogen wurde; wird am Ende der HP-Füllung angezeigt. Standard ist Blutrot.
hud.HpShowTip = HP-Pinselspitze anzeigen
hud.HpShowTip.tip = Zeigt eine Pinselspitze am Ende der HP-Füllung. Sie bleibt auch bei 0 HP sichtbar.
hud.HpTipScale = HP-Pinselspitze Größe
hud.HpTipScale.tip = Skalierung der Pinselspitze am Ende der HP-Füllung.
hud.HpTipAngle = HP-Pinselspitze Winkel
hud.HpTipAngle.tip = Winkel der HP-Pinselspitze relativ zur Tangente des Bogens.

hud.QiArcEnabled = Sha-Chi-Bogen anzeigen
hud.QiArcEnabled.tip = Zeigt den Sha-Chi-Bogen an, ohne Symbole oder Spielleisten zu beeinflussen.
hud.QiArcSide = Sha-Chi-Bogen-Seite
hud.QiArcSide.tip = Seite des Bogens vor der Drehung. Beide Bögen können auf einer Seite liegen; trenne sie über Radius oder Versatz.
hud.QiArcSide.left = Links
hud.QiArcSide.right = Rechts
hud.QiRadius = Sha-Chi-Bogen-Radius
hud.QiRadius.tip = Abstand des Sha-Chi-Bogens zu seinem Mittelpunkt. Unterschiedliche Radien trennen Bögen auf derselben Seite.
hud.QiThickness = Sha-Chi-Bogen-Stärke
hud.QiThickness.tip = Breite der Pinselstriche des Sha-Chi-Bogens.
hud.QiArcSpan = Sha-Chi-Bogen-Spanne
hud.QiArcSpan.tip = Winkel, den der Sha-Chi-Bogen abdeckt. Größere Werte machen den Bogen länger.
hud.QiSegments = Sha-Chi-Bogen-Segmente
hud.QiSegments.tip = Mehr Segmente ergeben einen runderen Bogen, kosten aber mehr Leistung.
hud.QiRotation = Sha-Chi-Bogen-Drehung
hud.QiRotation.tip = Dreht den ganzen Sha-Chi-Bogen samt Verlustspur und Pinselspitze um seinen Mittelpunkt. Positive Werte drehen im Uhrzeigersinn.
hud.QiFillDirection = Sha-Chi-Füllrichtung
hud.QiFillDirection.tip = Normal folgt der Standardreihenfolge der Bogensegmente, Umgekehrt der entgegengesetzten Reihenfolge. Die Drehung ändert diese Wahl nicht.
hud.QiFillDirection.normal = Normal
hud.QiFillDirection.reverse = Umgekehrt
hud.QiOffsetX = Sha-Chi-Versatz horizontal
hud.QiOffsetX.tip = Verschiebt den Sha-Chi-Bogen nach der Drehung horizontal, positive Werte nach rechts. Basis 1080p, skaliert mit der Oberfläche.
hud.QiOffsetY = Sha-Chi-Versatz vertikal
hud.QiOffsetY.tip = Verschiebt den Sha-Chi-Bogen nach der Drehung vertikal, positive Werte nach unten. Basis 1080p, skaliert mit der Oberfläche.
hud.QiColor = Sha-Chi-Farbe
hud.QiColor.tip = Grundfarbe des Sha-Chi-Bogens. Standard ist Gold.
hud.QiTrackColor = Sha-Chi-Hintergrundfarbe
hud.QiTrackColor.tip = Farbe der Hintergrundspur hinter dem Sha-Chi-Bogen.
hud.QiWarnColor = Warnfarbe niedriges Sha-Chi
hud.QiWarnColor.tip = Farbe unter der Sha-Chi-Warnschwelle. Der Deckungsbruch-Hinweis hat Vorrang.
hud.WarnThresholdQi = Schwelle niedriges Sha-Chi
hud.WarnThresholdQi.tip = Unter diesem Sha-Chi-Anteil wird die Warnfarbe genutzt. Standard ist 25%.
hud.QiBarOpacity = Sha-Chi-Deckkraft
hud.QiBarOpacity.tip = Deckkraft des gefüllten Sha-Chi-Bogens. Höhere Werte sind deutlicher sichtbar.
hud.QiTrackOpacity = Sha-Chi-Hintergrunddeckkraft
hud.QiTrackOpacity.tip = Deckkraft der Sha-Chi-Hintergrundspur. 0 ist völlig transparent.
hud.QiShowGhost = Sha-Chi-Verlustspur anzeigen
hud.QiShowGhost.tip = Bei sinkendem Sha-Chi bleibt eine schrumpfende Spur zurück, die den Verlust gut erkennbar macht.
hud.QiGhostOpacity = Sha-Chi-Verlustspur-Deckkraft
hud.QiGhostOpacity.tip = Deckkraft der Spur, die bei sinkendem Sha-Chi zurückbleibt.
hud.QiGhostColor = Sha-Chi-Verlustspur-Farbe
hud.QiGhostColor.tip = Farbe der Spur, die bei sinkendem Sha-Chi zurückbleibt. Standard ist Dunkelgold. Während eines Deckungsbruchs wird die Deckungsbruch-Farbe verwendet.
hud.QiShowTip = Sha-Chi-Pinselspitze anzeigen
hud.QiShowTip.tip = Zeigt eine Pinselspitze am Ende der Sha-Chi-Füllung. Sie bleibt auch bei 0 Sha-Chi sichtbar.
hud.QiTipScale = Sha-Chi-Pinselspitze Größe
hud.QiTipScale.tip = Skalierung der Pinselspitze am Ende der Sha-Chi-Füllung.
hud.QiTipAngle = Sha-Chi-Pinselspitze Winkel
hud.QiTipAngle.tip = Winkel der Sha-Chi-Pinselspitze relativ zur Tangente des Bogens.
hud.BreakHint = Deckungsbruch-Hinweis
hud.BreakHint.tip = Ändert die Farbe des Sha-Chi-Bogens, solange die Deckung der Figur gebrochen ist, und stellt sie danach sofort wieder her. Aus: keine Erkennung.
hud.QiBreakColor = Deckungsbruch-Farbe
hud.QiBreakColor.tip = Farbe des Sha-Chi-Bogens während eines Deckungsbruchs. Hat Vorrang vor der Warnfarbe für niedriges Sha-Chi.
hud.QiBreakTrackColor = Deckungsbruch-Hintergrund
hud.QiBreakTrackColor.tip = Hintergrundfarbe des Sha-Chi-Bogens während eines Deckungsbruchs. Danach gilt wieder die normale Hintergrundfarbe.
hud.BreakDemo = Deckungsbruch-Vorschau
hud.BreakDemo.tip = Blendet das Fenster kurz aus, leert den Sha-Chi-Bogen und zeigt 3 Sekunden lang die Deckungsbruch-Farbe, dann wird alles samt Fenster wiederhergestellt. Die Deckung der Figur wird nicht wirklich gebrochen.
hud.BreakDemo.run = Vorschau starten

hud.BrushJitter = Pinselzittern
hud.BrushJitter.tip = Zufällige Abweichung der Pinselstriche beider Bögen. 0 ergibt die saubersten Kanten.
hud.StrokeOverlap = Strichüberlappung
hud.StrokeOverlap.tip = Strichlänge als Vielfaches der Segmentlänge. Höher verdeckt Nahtstellen, niedriger macht Segmente sichtbar.
hud.GhostSpeed = Verlustspur-Rücklaufzeit
hud.GhostSpeed.tip = Rücklaufzeit der Verlustspur beider Bögen. Niedrigere Werte holen den aktuellen Wert schneller ein.
hud.GhostDelay = Verlustspur-Verzögerung
hud.GhostDelay.tip = Nach einem Verlust bleibt die Spur so lange stehen, damit der Verlust erkennbar ist. Weitere Treffer verlängern die Wartezeit; 0 läuft sofort zurück.
hud.WarnFlashSpeed = Warnblinken Tempo
hud.WarnFlashSpeed.tip = Blinkfrequenz der Warnungen bei niedrigen HP und niedrigem Sha-Chi. Höhere Werte blinken schneller.
hud.WarnFlashAmount = Warnblinken Stärke
hud.WarnFlashAmount.tip = Helligkeitsschwankung bei Warnungen für niedrige Werte. 0 deaktiviert das Blinken.

hud.NativeBars = Spiel-HUD
hud.NativeBars.tip = Die HP- und Sha-Chi-Leiste des Spiels unten links auf feste Länge setzen, unverändert lassen oder ganz ausblenden. Die feste Länge wird automatisch wiederhergestellt, wenn das Spiel die Leisten neu erstellt.
hud.NativeBars.pin = Feste Länge
hud.NativeBars.dynamic = Unverändert
hud.NativeBars.hide = Ausblenden
hud.HudBarWidth = Feste Leistenbreite
hud.HudBarWidth.tip = -1 nutzt die ursprüngliche Spiellänge jeder Leiste. Eigene Breiten müssen mindestens 48 betragen, in UI-Einheiten des Spiels. Die feste Länge wird nach dem Neuaufbau der Leisten automatisch wiederhergestellt.
hud.NativePinRecover = Feste Länge wiederherstellen
hud.NativePinRecover.tip = Stellt die feste Länge automatisch wieder her, falls sie verloren geht, meist innerhalb von etwa 1.5 s. Aus: Probleme nur protokollieren, hilfreich zur Fehlersuche. Gilt für Fest und Ausblenden.
hud.HudNumbers = Leistenwerte anzeigen
hud.HudNumbers.tip = Zeigt aktuellen und maximalen Wert. Die Zahlen bleiben auch bei ausgeblendeten Spielleisten sichtbar.
hud.HudNumberStyle = Zahlenstil
hud.HudNumberStyle.tip = Mittig zeigt weiße Zahlen in jeder Leiste. Oben/unten setzt HP über und Sha-Chi unter die jeweilige Leiste.
hud.HudNumberStyle.center = Mittig in Leiste
hud.HudNumberStyle.side = Oben und unten

hud.MedicineHud = Tränke anzeigen
hud.MedicineHud.tip = Zeigt Symbole und Anzahl der ausgerüsteten Tränke.
hud.PureIcon = Sha-Chi-Essenz anzeigen
hud.PureIcon.tip = Zeigt Symbol und Anzahl der Sha-Chi-Essenz.
hud.BulletIcon = Dunkle Quelle anzeigen
hud.BulletIcon.tip = Zeigt Symbol und Anzahl der Dunklen Quelle; teilt sich die Gruppenposition mit der Sha-Chi-Essenz.
hud.UltChargeBar = Essenz-Aufladung anzeigen
hud.UltChargeBar.tip = Füllt das Symbol der Sha-Chi-Essenz mit dem Ladefortschritt. Das Symbol der Dunklen Quelle bleibt unberührt.
hud.IconScale = Symbolgröße
hud.IconScale.tip = Skaliert Symbole, Zahlen und Abstände gemeinsam; die Unterkante bleibt an ihrer Position.
hud.MedicineHudX = Trankgruppe X
hud.MedicineHudX.tip = Horizontale Position der Trankgruppe. -1 nutzt die automatische Anordnung unten mittig. Auch im Ziehmodus anpassbar.
hud.MedicineHudY = Trankgruppe Y
hud.MedicineHudY.tip = Vertikale Position der Trankgruppe. -1 nutzt die automatische Anordnung unten mittig. Auch im Ziehmodus anpassbar.
hud.UltHudX = Essenz und Dunkle Quelle X
hud.UltHudX.tip = Gemeinsame horizontale Position von Sha-Chi-Essenz und Dunkler Quelle. -1 nutzt die automatische Anordnung.
hud.UltHudY = Essenz und Dunkle Quelle Y
hud.UltHudY.tip = Gemeinsame vertikale Position von Sha-Chi-Essenz und Dunkler Quelle. -1 nutzt die automatische Anordnung.
hud.Med1OffX = Trank 1 Versatz horizontal
hud.Med1OffX.tip = Horizontaler Versatz des ersten Tranks in seiner Gruppe. Im Ziehmodus mit Rechtsziehen einzeln anpassen.
hud.Med1OffY = Trank 1 Versatz vertikal
hud.Med1OffY.tip = Vertikaler Versatz des ersten Tranks in seiner Gruppe. Im Ziehmodus mit Rechtsziehen einzeln anpassen.
hud.Med2OffX = Trank 2 Versatz horizontal
hud.Med2OffX.tip = Horizontaler Versatz des zweiten Tranks in seiner Gruppe. Im Ziehmodus mit Rechtsziehen einzeln anpassen.
hud.Med2OffY = Trank 2 Versatz vertikal
hud.Med2OffY.tip = Vertikaler Versatz des zweiten Tranks in seiner Gruppe. Im Ziehmodus mit Rechtsziehen einzeln anpassen.
hud.Ult1OffX = Essenz Versatz horizontal
hud.Ult1OffX.tip = Horizontaler Versatz des Sha-Chi-Essenz-Symbols in seiner Gruppe.
hud.Ult1OffY = Essenz Versatz vertikal
hud.Ult1OffY.tip = Vertikaler Versatz des Sha-Chi-Essenz-Symbols in seiner Gruppe.
hud.Ult2OffX = Dunkle Quelle Versatz horizontal
hud.Ult2OffX.tip = Horizontaler Versatz des Symbols der Dunklen Quelle in seiner Gruppe.
hud.Ult2OffY = Dunkle Quelle Versatz vertikal
hud.Ult2OffY.tip = Vertikaler Versatz des Symbols der Dunklen Quelle in seiner Gruppe.

hud.Debug = Debug-Protokoll
hud.Debug.tip = Schreibt ausführliche Laufzeitinfos in Scripts/PBZMoHUD.log. Füge diese Datei bei Fehlermeldungen bei.
hud.DragIcons = Symbole ziehen
hud.DragIcons.tip = Blendet das Einstellungsfenster kurz aus. Linksziehen bewegt die ganze Gruppe, Rechtsziehen ein einzelnes Symbol, Mittelklick setzt auf Standard zurück. ESC kehrt zum Einstellungsfenster zurück.
hud.DragIcons.run = Ziehen starten
hud.dragTip = ESC drücken, um den Ziehmodus zu beenden
