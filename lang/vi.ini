hud.name = PBZMoHUD
hud.about = Cung HP và Sát khí điều chỉnh riêng cho Phantom Blade Zero, kèm biểu tượng bình thuốc, Sát khí tinh thuần và Ám nguyên. Chỉ đọc chỉ số người chơi, không thay đổi dữ liệu game.
hud.group.preset = Cấu hình mẫu
hud.group.behavior = Hoạt động
hud.group.hpArc = Cung HP
hud.group.qiArc = Cung Sát khí
hud.group.look = Giao diện chung
hud.group.icons = Biểu tượng
hud.group.native = HUD gốc
hud.group.advanced = Nâng cao

hud.Layout = Bố cục
hud.Layout.tip = Chọn vị trí đặt cung HP và cung Sát khí.
hud.Layout.normal = Thường
hud.Layout.mirror = Đối xứng
hud.Layout.ipsilateral = Cùng bên

hud.FollowCharacter = Theo nhân vật
hud.FollowCharacter.tip = Các cung di chuyển theo vị trí nhân vật trên màn hình. Tắt để dùng điểm neo cố định.
hud.FollowSmoothing = Thời gian làm mượt
hud.FollowSmoothing.tip = Thời gian làm mượt vị trí khi đi theo nhân vật. Đặt 0 để theo ngay lập tức.
hud.FixedAnchorX = Điểm neo cố định X
hud.FixedAnchorX.tip = Vị trí ngang của điểm neo theo tỷ lệ chiều rộng màn hình khi không theo nhân vật. 0.5 là chính giữa.
hud.FixedAnchorY = Điểm neo cố định Y
hud.FixedAnchorY.tip = Vị trí dọc của điểm neo theo tỷ lệ chiều cao màn hình khi không theo nhân vật. 0.5 là chính giữa.
hud.AnchorHeight = Độ cao điểm neo
hud.AnchorHeight.tip = Độ cao so với gốc nhân vật trong không gian thế giới (đơn vị UE, khoảng 1 cm mỗi đơn vị), không phải pixel màn hình. Giá trị dương nâng điểm neo lên.
hud.AnchorOffsetX = Dịch ngang chung
hud.AnchorOffsetX.tip = Dịch cả hai cung theo chiều ngang, giá trị dương sang phải; cộng dồn với độ dịch riêng của từng cung.
hud.AnchorOffsetY = Dịch dọc chung
hud.AnchorOffsetY.tip = Dịch cả hai cung theo chiều dọc, giá trị dương xuống dưới; cộng dồn với độ dịch riêng của từng cung.
hud.Visibility = Thời điểm hiển thị
hud.Visibility.tip = Ẩn hiện theo HUD của game, hoặc ẩn thêm từng cung khi nó đầy liên tục. Không ảnh hưởng đến biểu tượng khi đầy.
hud.Visibility.hud = Theo HUD game
hud.Visibility.dynamic = Ẩn khi đầy
hud.HideDelay = Độ trễ ẩn khi đầy
hud.HideDelay.tip = Thời gian mỗi cung phải đầy trước khi ẩn. Cung hiện lại khi giá trị giảm.

hud.HpArcEnabled = Hiện cung HP
hud.HpArcEnabled.tip = Hiện cung HP, không ảnh hưởng đến biểu tượng hay thanh gốc của game.
hud.HpArcSide = Bên cung HP
hud.HpArcSide.tip = Chọn bên đặt cung trước khi xoay. Hai cung có thể cùng một bên, tách ra bằng bán kính hoặc độ dịch.
hud.HpArcSide.left = Trái
hud.HpArcSide.right = Phải
hud.HpRadius = Bán kính cung HP
hud.HpRadius.tip = Khoảng cách từ cung HP đến tâm. Giá trị lớn hơn làm cung rộng hơn.
hud.HpThickness = Độ dày cung HP
hud.HpThickness.tip = Độ rộng nét bút của cung HP.
hud.HpArcSpan = Độ phủ cung HP
hud.HpArcSpan.tip = Góc mà cung HP bao phủ. Giá trị lớn hơn làm cung dài hơn.
hud.HpSegments = Số đoạn cung HP
hud.HpSegments.tip = Càng nhiều đoạn, cung càng mượt nhưng càng tốn hiệu năng.
hud.HpRotation = Xoay cung HP
hud.HpRotation.tip = Xoay toàn bộ cung HP quanh tâm, kèm cả tàn ảnh và đầu bút. Giá trị dương xoay theo chiều kim đồng hồ.
hud.HpFillDirection = Chiều lấp đầy HP
hud.HpFillDirection.tip = Thuận theo thứ tự đoạn mặc định của cung; Đảo ngược dùng thứ tự ngược lại. Xoay cung không làm thay đổi lựa chọn này.
hud.HpFillDirection.normal = Thuận
hud.HpFillDirection.reverse = Đảo ngược
hud.HpOffsetX = Dịch ngang cung HP
hud.HpOffsetX.tip = Dịch cung HP theo chiều ngang sau khi xoay, giá trị dương sang phải. Lấy 1080p làm chuẩn và theo tỷ lệ giao diện.
hud.HpOffsetY = Dịch dọc cung HP
hud.HpOffsetY.tip = Dịch cung HP theo chiều dọc sau khi xoay, giá trị dương xuống dưới. Lấy 1080p làm chuẩn và theo tỷ lệ giao diện.
hud.HpColor = Màu HP
hud.HpColor.tip = Màu cơ bản của cung HP. Mặc định là bạc nhạt.
hud.HpTrackColor = Màu rãnh nền HP
hud.HpTrackColor.tip = Màu rãnh nền phía sau phần chưa đầy của cung HP.
hud.HpWarnColor = Màu cảnh báo HP thấp
hud.HpWarnColor.tip = Màu dùng khi HP xuống dưới ngưỡng cảnh báo.
hud.WarnThresholdHp = Ngưỡng HP thấp
hud.WarnThresholdHp.tip = Dùng màu cảnh báo khi tỷ lệ HP thấp hơn giá trị này. Mặc định là 30%.
hud.HpBarOpacity = Độ đục cung HP
hud.HpBarOpacity.tip = Độ đục của phần đã lấp đầy trên cung HP. Giá trị càng cao càng rõ.
hud.HpTrackOpacity = Độ đục rãnh nền HP
hud.HpTrackOpacity.tip = Độ đục của rãnh nền HP. Đặt 0 để trong suốt hoàn toàn.
hud.HpShowGhost = Hiện tàn ảnh HP
hud.HpShowGhost.tip = Khi HP giảm, giữ lại một vệt tàn ảnh thu dần để dễ thấy lượng đã mất.
hud.HpGhostOpacity = Độ đục tàn ảnh HP
hud.HpGhostOpacity.tip = Độ đục của tàn ảnh khi HP giảm.
hud.HpGhostColor = Màu tàn ảnh HP
hud.HpGhostColor.tip = Màu của tàn ảnh khi HP giảm. Mặc định là đỏ sẫm.
hud.HpVirtualColor = Màu sát thương HP chờ trừ
hud.HpVirtualColor.tip = Sát thương trễ chưa bị trừ thật, hiển thị ở cuối thanh HP. Mặc định là đỏ máu.
hud.HpShowTip = Hiện đầu bút HP
hud.HpShowTip.tip = Hiện đầu bút ở cuối phần lấp đầy của cung HP. Đầu bút vẫn hiện khi HP về 0.
hud.HpTipScale = Cỡ đầu bút HP
hud.HpTipScale.tip = Tỷ lệ phóng to của đầu bút ở cuối phần lấp đầy HP.
hud.HpTipAngle = Góc đầu bút HP
hud.HpTipAngle.tip = Góc của đầu bút HP so với tiếp tuyến của cung.

hud.QiArcEnabled = Hiện cung Sát khí
hud.QiArcEnabled.tip = Hiện cung Sát khí, không ảnh hưởng đến biểu tượng hay thanh gốc của game.
hud.QiArcSide = Bên cung Sát khí
hud.QiArcSide.tip = Chọn bên đặt cung trước khi xoay. Hai cung có thể cùng một bên, tách ra bằng bán kính hoặc độ dịch.
hud.QiArcSide.left = Trái
hud.QiArcSide.right = Phải
hud.QiRadius = Bán kính cung Sát khí
hud.QiRadius.tip = Khoảng cách từ cung Sát khí đến tâm. Dùng bán kính khác nhau để tách hai cung cùng bên.
hud.QiThickness = Độ dày cung Sát khí
hud.QiThickness.tip = Độ rộng nét bút của cung Sát khí.
hud.QiArcSpan = Độ phủ cung Sát khí
hud.QiArcSpan.tip = Góc mà cung Sát khí bao phủ. Giá trị lớn hơn làm cung dài hơn.
hud.QiSegments = Số đoạn cung Sát khí
hud.QiSegments.tip = Càng nhiều đoạn, cung càng mượt nhưng càng tốn hiệu năng.
hud.QiRotation = Xoay cung Sát khí
hud.QiRotation.tip = Xoay toàn bộ cung Sát khí quanh tâm, kèm cả tàn ảnh và đầu bút. Giá trị dương xoay theo chiều kim đồng hồ.
hud.QiFillDirection = Chiều lấp đầy Sát khí
hud.QiFillDirection.tip = Thuận theo thứ tự đoạn mặc định của cung; Đảo ngược dùng thứ tự ngược lại. Xoay cung không làm thay đổi lựa chọn này.
hud.QiFillDirection.normal = Thuận
hud.QiFillDirection.reverse = Đảo ngược
hud.QiOffsetX = Dịch ngang cung Sát khí
hud.QiOffsetX.tip = Dịch cung Sát khí theo chiều ngang sau khi xoay, giá trị dương sang phải. Lấy 1080p làm chuẩn và theo tỷ lệ giao diện.
hud.QiOffsetY = Dịch dọc cung Sát khí
hud.QiOffsetY.tip = Dịch cung Sát khí theo chiều dọc sau khi xoay, giá trị dương xuống dưới. Lấy 1080p làm chuẩn và theo tỷ lệ giao diện.
hud.QiColor = Màu Sát khí
hud.QiColor.tip = Màu cơ bản của cung Sát khí. Mặc định là vàng kim.
hud.QiTrackColor = Màu rãnh nền Sát khí
hud.QiTrackColor.tip = Màu rãnh nền phía sau phần chưa đầy của cung Sát khí.
hud.QiWarnColor = Màu cảnh báo Sát khí thấp
hud.QiWarnColor.tip = Màu dùng khi Sát khí xuống dưới ngưỡng cảnh báo. Báo hiệu phá thế thủ được ưu tiên.
hud.WarnThresholdQi = Ngưỡng Sát khí thấp
hud.WarnThresholdQi.tip = Dùng màu cảnh báo khi tỷ lệ Sát khí thấp hơn giá trị này. Mặc định là 25%.
hud.QiBarOpacity = Độ đục cung Sát khí
hud.QiBarOpacity.tip = Độ đục của phần đã lấp đầy trên cung Sát khí. Giá trị càng cao càng rõ.
hud.QiTrackOpacity = Độ đục rãnh nền Sát khí
hud.QiTrackOpacity.tip = Độ đục của rãnh nền Sát khí. Đặt 0 để trong suốt hoàn toàn.
hud.QiShowGhost = Hiện tàn ảnh Sát khí
hud.QiShowGhost.tip = Khi Sát khí giảm, giữ lại một vệt tàn ảnh thu dần để dễ thấy lượng đã mất.
hud.QiGhostOpacity = Độ đục tàn ảnh Sát khí
hud.QiGhostOpacity.tip = Độ đục của tàn ảnh khi Sát khí giảm.
hud.QiGhostColor = Màu tàn ảnh Sát khí
hud.QiGhostColor.tip = Màu của tàn ảnh khi Sát khí giảm. Mặc định là vàng sẫm. Khi bị phá thế thủ sẽ dùng màu phá thế thủ.
hud.QiShowTip = Hiện đầu bút Sát khí
hud.QiShowTip.tip = Hiện đầu bút ở cuối phần lấp đầy của cung Sát khí. Đầu bút vẫn hiện khi Sát khí về 0.
hud.QiTipScale = Cỡ đầu bút Sát khí
hud.QiTipScale.tip = Tỷ lệ phóng to của đầu bút ở cuối phần lấp đầy Sát khí.
hud.QiTipAngle = Góc đầu bút Sát khí
hud.QiTipAngle.tip = Góc của đầu bút Sát khí so với tiếp tuyến của cung.
hud.BreakHint = Báo hiệu phá thế thủ
hud.BreakHint.tip = Đổi màu cung Sát khí khi nhân vật bị phá thế thủ và trả lại ngay khi hồi phục. Tắt để ngừng phát hiện.
hud.QiBreakColor = Màu phá thế thủ
hud.QiBreakColor.tip = Màu cung Sát khí khi bị phá thế thủ, ưu tiên hơn màu cảnh báo Sát khí thấp.
hud.QiBreakTrackColor = Màu rãnh nền phá thế thủ
hud.QiBreakTrackColor.tip = Màu rãnh nền cung Sát khí khi bị phá thế thủ. Trở lại màu rãnh nền khi trạng thái kết thúc.
hud.BreakDemo = Xem trước màu phá thế thủ
hud.BreakDemo.tip = Tạm ẩn bảng cài đặt, làm trống cung Sát khí và hiện màu phá thế thủ trong 3 giây, sau đó tự khôi phục và mở lại bảng. Nhân vật không thật sự bị phá thế thủ.
hud.BreakDemo.run = Chạy thử

hud.BrushJitter = Độ rung nét bút
hud.BrushJitter.tip = Mức biến đổi ngẫu nhiên của nét bút trên cả hai cung. Đặt 0 để viền gọn nhất.
hud.StrokeOverlap = Độ chồng nét
hud.StrokeOverlap.tip = Độ dài nét bút tính theo bội số độ dài đoạn. Tăng để che đường nối, giảm để lộ rõ từng đoạn.
hud.GhostSpeed = Thời gian thu tàn ảnh
hud.GhostSpeed.tip = Thời gian thu tàn ảnh của cả hai cung. Giá trị càng nhỏ, tàn ảnh bắt kịp giá trị hiện tại càng nhanh.
hud.GhostDelay = Độ trễ thu tàn ảnh
hud.GhostDelay.tip = Sau khi mất lượng, tàn ảnh giữ nguyên trong khoảng này rồi mới thu lại để bạn thấy đã mất bao nhiêu. Trúng đòn liên tiếp sẽ tính lại thời gian giữ; 0 là thu ngay.
hud.WarnFlashSpeed = Tốc độ nhấp nháy cảnh báo
hud.WarnFlashSpeed.tip = Tần số nhấp nháy của cảnh báo HP thấp và Sát khí thấp. Giá trị càng cao nháy càng nhanh.
hud.WarnFlashAmount = Cường độ nhấp nháy
hud.WarnFlashAmount.tip = Mức thay đổi độ sáng khi cảnh báo giá trị thấp. Đặt 0 để tắt nhấp nháy.

hud.ToggleNativeHudKey = Phím bật/tắt HUD gốc
hud.ToggleNativeHudKey.tip = Bật/tắt công tắc ẩn HUD gốc, áp dụng cùng quy tắc liên kết hiển thị số. Mặc định chưa gán phím. Không hoạt động khi mở bảng cài đặt hoặc kéo; thay đổi không được tự động lưu.
hud.HideNativeHud = Ẩn HUD gốc
hud.HideNativeHud.tip = Ẩn bình thuốc, thanh máu, thanh sát khí và vũ khí của HUD gốc, không bao gồm thanh máu của trùm. Khi bật, số máu và sát khí sẽ tắt nhưng bạn có thể tự bật lại. Tắt tùy chọn này sẽ bật lại các số đó.
hud.NativeBars = HUD gốc của game
hud.NativeBars.tip = Cố định độ dài thanh HP và Sát khí ở góc dưới trái của game, giữ nguyên hoặc ẩn hẳn. Độ dài cố định tự khôi phục khi game tạo lại thanh.
hud.NativeBars.pin = Cố định độ dài
hud.NativeBars.dynamic = Giữ nguyên
hud.NativeBars.hide = Ẩn hẳn
hud.HudBarWidth = Độ rộng cố định thanh gốc
hud.HudBarWidth.tip = -1 dùng độ dài ban đầu của từng thanh trong game. Độ rộng tùy chỉnh tối thiểu là 48, tính theo đơn vị giao diện game. Độ dài cố định tự khôi phục khi game tạo lại thanh.
hud.NativePinRecover = Tự khôi phục độ dài
hud.NativePinRecover.tip = Thử khôi phục độ dài cố định khi bị mất, thường trong khoảng 1.5 giây. Tắt để chỉ ghi lại lỗi, tiện cho việc xử lý sự cố. Dùng được ở cả chế độ cố định và ẩn.
hud.HudNumbers = Hiện số trên thanh
hud.HudNumbers.tip = Hiện giá trị hiện tại và tối đa. Số vẫn có thể hiện sau khi ẩn thanh gốc.
hud.HudNumberStyle = Kiểu hiển thị số
hud.HudNumberStyle.tip = Giữa thanh hiện chữ trắng bên trong mỗi thanh. Trên và dưới đặt số HP phía trên thanh và số Sát khí phía dưới thanh.
hud.HudNumberStyle.center = Giữa thanh
hud.HudNumberStyle.side = Trên và dưới
hud.HideNativeMedicine = Ẩn bình thuốc gốc
hud.HideNativeMedicine.tip = Ẩn khu vực bình thuốc trên HUD gốc của trò chơi, không ảnh hưởng đến biểu tượng của bản mod này.
hud.HideNativeMainWeapon = Ẩn vũ khí gốc
hud.HideNativeMainWeapon.tip = Ẩn khu vực vũ khí trên HUD gốc của trò chơi, không ảnh hưởng đến biểu tượng của bản mod này.
hud.HideNativePhantomEdges = Ẩn VŨ KHÍ PHANTOM gốc
hud.HideNativePhantomEdges.tip = Ẩn khu vực VŨ KHÍ PHANTOM trên HUD gốc của trò chơi, không ảnh hưởng đến biểu tượng của bản mod này.

hud.MedicineHud = Hiện bình thuốc
hud.MedicineHud.tip = Hiện biểu tượng và số lượng bình thuốc đã trang bị.
hud.PureIcon = Hiện Sát khí tinh thuần
hud.PureIcon.tip = Hiện biểu tượng và số lượng Sát khí tinh thuần.
hud.MainWeaponIcon = Hiện vũ khí
hud.MainWeaponIcon.tip = Thay biểu tượng Sát khí tinh thuần bằng biểu tượng vũ khí hiện tại. Tắt để khôi phục biểu tượng gốc.
hud.BulletIcon = Hiện Ám nguyên
hud.BulletIcon.tip = Hiện biểu tượng và số lượng Ám nguyên, dùng chung vị trí nhóm với Sát khí tinh thuần.
hud.PhantomEdgesIcon = Hiện VŨ KHÍ PHANTOM
hud.PhantomEdgesIcon.tip = Thay biểu tượng Ám nguyên bằng biểu tượng VŨ KHÍ PHANTOM hiện tại. Tắt để khôi phục biểu tượng gốc.
hud.UltChargeBar = Hiện tích năng tinh thuần
hud.UltChargeBar.tip = Làm sáng dần từ dưới lên biểu tượng Sát khí tinh thuần (hoặc biểu tượng vũ khí thay thế) theo tiến độ tích năng. Không ảnh hưởng đến Ám nguyên hay biểu tượng vũ khí của nó.
hud.WeaponCooldown = Hồi chiêu đổi vũ khí
hud.WeaponCooldown.tip = Hiển thị vòng hồi chiêu khi đổi vũ khí và ẩn khi hoàn tất. Trong bảng cài đặt, bản xem trước lặp lại mỗi 3 giây. Chế độ kéo hiển thị cả vòng; kéo bằng nút trái hoặc phải để di chuyển riêng, không ảnh hưởng biểu tượng khác.
hud.WeaponCooldownX = Vòng hồi chiêu X
hud.WeaponCooldownX.tip = Tọa độ X của góc trên bên trái. -1 bám theo trung điểm phía trong cung Sát khí. Kéo để đặt vị trí cố định.
hud.WeaponCooldownY = Vòng hồi chiêu Y
hud.WeaponCooldownY.tip = Tọa độ Y của góc trên bên trái. -1 bám theo trung điểm phía trong cung Sát khí. Nhấp chuột giữa để khôi phục vị trí mặc định.
hud.IconScale = Tỷ lệ biểu tượng
hud.IconScale.tip = Phóng to thu nhỏ biểu tượng, số và khoảng cách cùng lúc, giữ nguyên cạnh dưới.
hud.MedicineHudX = Nhóm bình thuốc X
hud.MedicineHudX.tip = Vị trí ngang của nhóm bình thuốc. -1 dùng bố cục tự động ở giữa đáy màn hình. Cũng có thể chỉnh trong chế độ kéo.
hud.MedicineHudY = Nhóm bình thuốc Y
hud.MedicineHudY.tip = Vị trí dọc của nhóm bình thuốc. -1 dùng bố cục tự động ở giữa đáy màn hình. Cũng có thể chỉnh trong chế độ kéo.
hud.UltHudX = Tinh thuần và Ám nguyên X
hud.UltHudX.tip = Vị trí ngang dùng chung cho Sát khí tinh thuần và Ám nguyên. -1 dùng bố cục tự động.
hud.UltHudY = Tinh thuần và Ám nguyên Y
hud.UltHudY.tip = Vị trí dọc dùng chung cho Sát khí tinh thuần và Ám nguyên. -1 dùng bố cục tự động.
hud.Med1OffX = Dịch ngang bình thuốc 1
hud.Med1OffX.tip = Độ dịch ngang của bình thuốc thứ nhất trong nhóm. Kéo chuột phải trong chế độ kéo để chỉnh riêng.
hud.Med1OffY = Dịch dọc bình thuốc 1
hud.Med1OffY.tip = Độ dịch dọc của bình thuốc thứ nhất trong nhóm. Kéo chuột phải trong chế độ kéo để chỉnh riêng.
hud.Med2OffX = Dịch ngang bình thuốc 2
hud.Med2OffX.tip = Độ dịch ngang của bình thuốc thứ hai trong nhóm. Kéo chuột phải trong chế độ kéo để chỉnh riêng.
hud.Med2OffY = Dịch dọc bình thuốc 2
hud.Med2OffY.tip = Độ dịch dọc của bình thuốc thứ hai trong nhóm. Kéo chuột phải trong chế độ kéo để chỉnh riêng.
hud.Ult1OffX = Dịch ngang tinh thuần
hud.Ult1OffX.tip = Độ dịch ngang của biểu tượng Sát khí tinh thuần trong nhóm.
hud.Ult1OffY = Dịch dọc tinh thuần
hud.Ult1OffY.tip = Độ dịch dọc của biểu tượng Sát khí tinh thuần trong nhóm.
hud.Ult2OffX = Dịch ngang Ám nguyên
hud.Ult2OffX.tip = Độ dịch ngang của biểu tượng Ám nguyên trong nhóm.
hud.Ult2OffY = Dịch dọc Ám nguyên
hud.Ult2OffY.tip = Độ dịch dọc của biểu tượng Ám nguyên trong nhóm.

hud.Debug = Nhật ký gỡ lỗi
hud.Debug.tip = Ghi thông tin chạy chi tiết vào Scripts/PBZMoHUD.log. Gửi kèm tệp này khi báo lỗi.
hud.DragIcons = Kéo biểu tượng
hud.DragIcons.tip = Tạm ẩn bảng cài đặt. Kéo chuột trái để di chuyển cả nhóm biểu tượng, kéo chuột phải để di chuyển một biểu tượng, nhấn chuột giữa để về vị trí mặc định. Nhấn ESC để quay lại bảng cài đặt.
hud.DragIcons.run = Bắt đầu kéo
hud.dragTip = Nhấn ESC để thoát chế độ kéo
