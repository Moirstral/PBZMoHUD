hud.name = PBZMoHUD
hud.about = Phantom Blade Zero 用に、個別に調整できる HP と殺気のアークゲージ、および薬瓶・純殺気・暗源のアイコンを表示します。プレイヤーの数値を読み取るだけで、ゲームデータは変更しません。
hud.group.preset = プリセット
hud.group.behavior = 動作
hud.group.hpArc = HPアーク
hud.group.qiArc = 殺気アーク
hud.group.look = 共通の外観
hud.group.icons = アイコン
hud.group.native = 標準ゲージ
hud.group.advanced = 詳細

hud.Layout = レイアウト
hud.Layout.tip = HPアークと殺気アークの配置を選びます。
hud.Layout.normal = 標準
hud.Layout.mirror = 反転
hud.Layout.ipsilateral = 同じ側

hud.FollowCharacter = キャラクターに追従
hud.FollowCharacter.tip = アークがキャラクターの画面上の位置に追従します。オフにすると固定の画面アンカーを使います。
hud.FollowSmoothing = 追従の補間時間
hud.FollowSmoothing.tip = キャラクター追従時の位置の補間時間です。0 で即座に追従します。
hud.FixedAnchorX = 固定アンカー横位置
hud.FixedAnchorX.tip = 追従しないときのアンカー位置を画面幅に対する比率で指定します。0.5 で中央です。
hud.FixedAnchorY = 固定アンカー縦位置
hud.FixedAnchorY.tip = 追従しないときのアンカー位置を画面高さに対する比率で指定します。0.5 で中央です。
hud.AnchorHeight = キャラクターアンカーの高さ
hud.AnchorHeight.tip = キャラクター原点からのワールド上の高さオフセットです（UE のワールド単位、1 単位は約 1 cm）。画面ピクセルではありません。正の値で上がります。
hud.AnchorOffsetX = 全体の横オフセット
hud.AnchorOffsetX.tip = 両方のアークをまとめて横に動かします。正の値で右へ移動し、各アーク個別のオフセットと加算されます。
hud.AnchorOffsetY = 全体の縦オフセット
hud.AnchorOffsetY.tip = 両方のアークをまとめて縦に動かします。正の値で下へ移動し、各アーク個別のオフセットと加算されます。
hud.Visibility = 表示タイミング
hud.Visibility.tip = ゲームのHUD表示に合わせるか、さらに満タンが続いたアークを個別に隠します。アイコンは満タンでも隠れません。
hud.Visibility.hud = ゲームのHUDに合わせる
hud.Visibility.dynamic = 満タンで非表示
hud.HideDelay = 満タン非表示の遅延
hud.HideDelay.tip = 各アークが満タンのままこの時間が経つと非表示になります。数値が減ると再び表示されます。

hud.HpArcEnabled = HPアークを表示
hud.HpArcEnabled.tip = HPアークを表示します。アイコンやゲームの標準ゲージには影響しません。
hud.HpArcSide = HPアークの位置
hud.HpArcSide.tip = 回転前のアークの位置を選びます。両方のアークを同じ側に置き、半径やオフセットで離すこともできます。
hud.HpArcSide.left = 左
hud.HpArcSide.right = 右
hud.HpRadius = HPアークの半径
hud.HpRadius.tip = HPアークから中心までの距離です。大きくするとアークが広がります。
hud.HpThickness = HPアークの太さ
hud.HpThickness.tip = HPアークの筆致の幅です。
hud.HpArcSpan = HPアークの範囲
hud.HpArcSpan.tip = HPアークが覆う角度です。大きいほどアークが長くなります。
hud.HpSegments = HPアークの分割数
hud.HpSegments.tip = 分割数が多いほどアークは滑らかになりますが、負荷も増えます。
hud.HpRotation = HPアークの回転
hud.HpRotation.tip = HPアーク全体を中心のまわりに回転させます。残像と筆先も一緒に回転し、正の値で時計回りです。
hud.HpFillDirection = HPの充填方向
hud.HpFillDirection.tip = 正方向はアーク既定の区間順で、逆方向はその逆の順で塗ります。回転しても選んだ順序は変わりません。
hud.HpFillDirection.normal = 正方向
hud.HpFillDirection.reverse = 逆方向
hud.HpOffsetX = HPアーク横オフセット
hud.HpOffsetX.tip = 回転後にHPアークを横に動かします。正の値で右へ。1080p 基準で、UIスケールに合わせて拡縮します。
hud.HpOffsetY = HPアーク縦オフセット
hud.HpOffsetY.tip = 回転後にHPアークを縦に動かします。正の値で下へ。1080p 基準で、UIスケールに合わせて拡縮します。
hud.HpColor = HPの色
hud.HpColor.tip = HPアークの基本色です。初期値は淡い銀色です。
hud.HpTrackColor = HP下地の色
hud.HpTrackColor.tip = HPアークの未充填部分に表示される下地の色です。
hud.HpWarnColor = HP低下の警告色
hud.HpWarnColor.tip = HPが警告しきい値を下回ったときに使う色です。
hud.WarnThresholdHp = HP低下のしきい値
hud.WarnThresholdHp.tip = HPの割合がこの値を下回ると警告色になります。初期値は 30% です。
hud.HpBarOpacity = HPアークの不透明度
hud.HpBarOpacity.tip = HPアークの充填部分の不透明度です。大きいほどはっきり見えます。
hud.HpTrackOpacity = HP下地の不透明度
hud.HpTrackOpacity.tip = HPアークの下地の不透明度です。0 で完全に透明になります。
hud.HpShowGhost = HPの残像を表示
hud.HpShowGhost.tip = HPが減ったとき、徐々に縮む残像を残して減少量を見やすくします。
hud.HpGhostOpacity = HP残像の不透明度
hud.HpGhostOpacity.tip = HPが減ったときに残る残像の不透明度です。
hud.HpGhostColor = HP残像の色
hud.HpGhostColor.tip = HPが減ったときに残る残像の色です。初期値は暗い赤です。
hud.HpVirtualColor = HP保留ダメージの色
hud.HpVirtualColor.tip = 斬馬刀で被弾後、まだ実際に差し引かれていないHPです。HPゲージの末端に表示されます。初期値は血のような赤です。
hud.HpShowTip = HPの筆先を表示
hud.HpShowTip.tip = HPアークの充填端に筆先を表示します。HPが 0 になっても筆先は残ります。
hud.HpTipScale = HP筆先のサイズ
hud.HpTipScale.tip = HPアークの充填端にある筆先の拡大率です。
hud.HpTipAngle = HP筆先の角度
hud.HpTipAngle.tip = アークの接線に対するHP筆先の角度です。

hud.QiArcEnabled = 殺気アークを表示
hud.QiArcEnabled.tip = 殺気アークを表示します。アイコンやゲームの標準ゲージには影響しません。
hud.QiArcSide = 殺気アークの位置
hud.QiArcSide.tip = 回転前のアークの位置を選びます。両方のアークを同じ側に置き、半径やオフセットで離すこともできます。
hud.QiArcSide.left = 左
hud.QiArcSide.right = 右
hud.QiRadius = 殺気アークの半径
hud.QiRadius.tip = 殺気アークから中心までの距離です。同じ側に並べる場合は半径を変えて区別できます。
hud.QiThickness = 殺気アークの太さ
hud.QiThickness.tip = 殺気アークの筆致の幅です。
hud.QiArcSpan = 殺気アークの範囲
hud.QiArcSpan.tip = 殺気アークが覆う角度です。大きいほどアークが長くなります。
hud.QiSegments = 殺気アークの分割数
hud.QiSegments.tip = 分割数が多いほどアークは滑らかになりますが、負荷も増えます。
hud.QiRotation = 殺気アークの回転
hud.QiRotation.tip = 殺気アーク全体を中心のまわりに回転させます。残像と筆先も一緒に回転し、正の値で時計回りです。
hud.QiFillDirection = 殺気の充填方向
hud.QiFillDirection.tip = 正方向はアーク既定の区間順で、逆方向はその逆の順で塗ります。回転しても選んだ順序は変わりません。
hud.QiFillDirection.normal = 正方向
hud.QiFillDirection.reverse = 逆方向
hud.QiOffsetX = 殺気アーク横オフセット
hud.QiOffsetX.tip = 回転後に殺気アークを横に動かします。正の値で右へ。1080p 基準で、UIスケールに合わせて拡縮します。
hud.QiOffsetY = 殺気アーク縦オフセット
hud.QiOffsetY.tip = 回転後に殺気アークを縦に動かします。正の値で下へ。1080p 基準で、UIスケールに合わせて拡縮します。
hud.QiColor = 殺気の色
hud.QiColor.tip = 殺気アークの基本色です。初期値は金色です。
hud.QiTrackColor = 殺気下地の色
hud.QiTrackColor.tip = 殺気アークの未充填部分に表示される下地の色です。
hud.QiWarnColor = 殺気低下の警告色
hud.QiWarnColor.tip = 殺気が警告しきい値を下回ったときに使う色です。ガードブレイク表示が優先されます。
hud.WarnThresholdQi = 殺気低下のしきい値
hud.WarnThresholdQi.tip = 殺気の割合がこの値を下回ると警告色になります。初期値は 25% です。
hud.QiBarOpacity = 殺気アークの不透明度
hud.QiBarOpacity.tip = 殺気アークの充填部分の不透明度です。大きいほどはっきり見えます。
hud.QiTrackOpacity = 殺気下地の不透明度
hud.QiTrackOpacity.tip = 殺気アークの下地の不透明度です。0 で完全に透明になります。
hud.QiShowGhost = 殺気の残像を表示
hud.QiShowGhost.tip = 殺気が減ったとき、徐々に縮む残像を残して減少量を見やすくします。
hud.QiGhostOpacity = 殺気残像の不透明度
hud.QiGhostOpacity.tip = 殺気が減ったときに残る残像の不透明度です。
hud.QiGhostColor = 殺気残像の色
hud.QiGhostColor.tip = 殺気が減ったときに残る残像の色です。初期値は暗い金色です。ガードブレイク中はガードブレイク時の色を使います。
hud.QiShowTip = 殺気の筆先を表示
hud.QiShowTip.tip = 殺気アークの充填端に筆先を表示します。殺気が 0 になっても筆先は残ります。
hud.QiTipScale = 殺気筆先のサイズ
hud.QiTipScale.tip = 殺気アークの充填端にある筆先の拡大率です。
hud.QiTipAngle = 殺気筆先の角度
hud.QiTipAngle.tip = アークの接線に対する殺気筆先の角度です。
hud.BreakHint = ガードブレイク表示
hud.BreakHint.tip = キャラクターがガードブレイクされている間、殺気アークの色を変え、回復するとすぐ元に戻します。オフにするとガードブレイクを検出しません。
hud.QiBreakColor = ガードブレイク時の色
hud.QiBreakColor.tip = ガードブレイク中に殺気アークに使う色です。殺気低下の警告色より優先されます。
hud.QiBreakTrackColor = ガードブレイク時の下地色
hud.QiBreakTrackColor.tip = ガードブレイク中に殺気アークの下地に使う色です。終了すると通常の下地色に戻ります。
hud.BreakDemo = ガードブレイク色をプレビュー
hud.BreakDemo.tip = パネルを一時的に閉じ、殺気アークを空にしてガードブレイク色を 3 秒間表示した後、自動で元に戻してパネルを再表示します。実際にガードブレイクは起きません。
hud.BreakDemo.run = デモ開始

hud.BrushJitter = 筆致の揺らぎ
hud.BrushJitter.tip = 両アークの筆致がランダムに変化する幅です。0 で縁が最も整います。
hud.StrokeOverlap = 筆致の重なり倍率
hud.StrokeOverlap.tip = 区間の長さに対する各筆致の長さの倍率です。大きくすると継ぎ目が隠れ、小さくすると区切りが目立ちます。
hud.GhostSpeed = 残像の回収時間
hud.GhostSpeed.tip = 両アークの残像が縮みきるまでの時間です。小さいほど現在値に早く追いつきます。
hud.GhostDelay = 残像の回収遅延
hud.GhostDelay.tip = 減少後、残像はこの時間とどまってから縮み始め、減少量を確認しやすくします。続けて減ると時間がリセットされ、0 で即座に縮みます。
hud.WarnFlashSpeed = 警告の点滅速度
hud.WarnFlashSpeed.tip = HP低下と殺気低下の警告の点滅頻度です。大きいほど速く点滅します。
hud.WarnFlashAmount = 警告の点滅幅
hud.WarnFlashAmount.tip = 低下警告時の明暗の変化幅です。0 で点滅しません。

hud.NativeBars = ゲーム標準HUD
hud.NativeBars.tip = 画面左下のゲーム標準のHPゲージと殺気ゲージを、長さ固定・そのまま・非表示から選べます。長さ固定はゲームがゲージを再生成しても自動で復元されます。
hud.NativeBars.pin = 長さ固定
hud.NativeBars.dynamic = そのまま
hud.NativeBars.hide = 非表示
hud.HudBarWidth = 標準ゲージの固定幅
hud.HudBarWidth.tip = -1 で各ゲージのゲーム本来の長さを使います。指定する場合はゲームUI単位で 48 以上にしてください。ゲームがゲージを再生成しても固定長は自動で復元されます。
hud.NativePinRecover = 固定長の自動復元
hud.NativePinRecover.tip = 固定長が効かなくなったとき自動復元を試みます。通常は約 1.5 秒です。オフにすると異常を記録するだけで、問題の調査に向いています。固定・非表示のどちらでも使えます。
hud.HudNumbers = ゲージに数値を表示
hud.HudNumbers.tip = 現在値と最大値を表示します。標準ゲージを非表示にしても数値は表示できます。
hud.HudNumberStyle = 数値の表示形式
hud.HudNumberStyle.tip = 中央はゲージ内に白文字で表示し、上下はHPをゲージの上、殺気をゲージの下に表示します。
hud.HudNumberStyle.center = ゲージ内中央
hud.HudNumberStyle.side = ゲージの上下

hud.MedicineHud = 薬瓶を表示
hud.MedicineHud.tip = 装備中の薬瓶のアイコンと数を表示します。
hud.PureIcon = 純殺気を表示
hud.PureIcon.tip = 純殺気のアイコンと数を表示します。
hud.BulletIcon = 暗源を表示
hud.BulletIcon.tip = 暗源のアイコンと数を表示します。純殺気と同じグループ位置を共有します。
hud.UltChargeBar = 純殺気のチャージを表示
hud.UltChargeBar.tip = チャージの進行度を純殺気アイコン内に塗って表示します。暗源アイコンには影響しません。
hud.IconScale = アイコンの拡大率
hud.IconScale.tip = アイコン・数字・間隔をまとめて拡縮し、下端の位置を保ちます。
hud.MedicineHudX = 薬瓶グループの横位置
hud.MedicineHudX.tip = 薬瓶グループの横位置です。-1 で画面下中央の自動配置を使います。ドラッグモードでも調整できます。
hud.MedicineHudY = 薬瓶グループの縦位置
hud.MedicineHudY.tip = 薬瓶グループの縦位置です。-1 で画面下中央の自動配置を使います。ドラッグモードでも調整できます。
hud.UltHudX = 純殺気・暗源の横位置
hud.UltHudX.tip = 純殺気と暗源が共有する横位置です。-1 で自動配置を使います。
hud.UltHudY = 純殺気・暗源の縦位置
hud.UltHudY.tip = 純殺気と暗源が共有する縦位置です。-1 で自動配置を使います。
hud.Med1OffX = 薬瓶1の横オフセット
hud.Med1OffX.tip = 薬瓶グループに対する1つ目の薬瓶の横オフセットです。ドラッグモードで右ドラッグすると個別に調整できます。
hud.Med1OffY = 薬瓶1の縦オフセット
hud.Med1OffY.tip = 薬瓶グループに対する1つ目の薬瓶の縦オフセットです。ドラッグモードで右ドラッグすると個別に調整できます。
hud.Med2OffX = 薬瓶2の横オフセット
hud.Med2OffX.tip = 薬瓶グループに対する2つ目の薬瓶の横オフセットです。ドラッグモードで右ドラッグすると個別に調整できます。
hud.Med2OffY = 薬瓶2の縦オフセット
hud.Med2OffY.tip = 薬瓶グループに対する2つ目の薬瓶の縦オフセットです。ドラッグモードで右ドラッグすると個別に調整できます。
hud.Ult1OffX = 純殺気の横オフセット
hud.Ult1OffX.tip = グループ位置に対する純殺気アイコンの横オフセットです。
hud.Ult1OffY = 純殺気の縦オフセット
hud.Ult1OffY.tip = グループ位置に対する純殺気アイコンの縦オフセットです。
hud.Ult2OffX = 暗源の横オフセット
hud.Ult2OffX.tip = グループ位置に対する暗源アイコンの横オフセットです。
hud.Ult2OffY = 暗源の縦オフセット
hud.Ult2OffY.tip = グループ位置に対する暗源アイコンの縦オフセットです。

hud.Debug = デバッグログ
hud.Debug.tip = 詳細な動作情報を Scripts/PBZMoHUD.log に記録します。不具合を報告するときはこのファイルを添えてください。
hud.DragIcons = アイコンをドラッグ
hud.DragIcons.tip = 設定画面を一時的に閉じます。左ドラッグでアイコングループ全体、右ドラッグで個別のアイコンを移動し、中クリックで初期位置に戻します。ESC で設定パネルに戻ります。
hud.DragIcons.run = ドラッグ開始
hud.dragTip = ESC でドラッグモードを終了
