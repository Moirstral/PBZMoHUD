hud.name = PBZMoHUD
hud.about = 팬텀 블레이드 제로에서 개별 조정 가능한 HP·살기 호 게이지와 약병·순수 살기·암원 아이콘을 표시합니다. 플레이어 수치만 읽으며 게임 데이터는 변경하지 않습니다.
hud.group.preset = 프리셋
hud.group.behavior = 동작
hud.group.hpArc = HP 호
hud.group.qiArc = 살기 호
hud.group.look = 공통 외형
hud.group.icons = 아이콘
hud.group.native = 기본 게이지
hud.group.advanced = 고급

hud.Layout = 레이아웃
hud.Layout.tip = HP 호와 살기 호의 배치를 선택합니다.
hud.Layout.normal = 기본
hud.Layout.mirror = 반전
hud.Layout.ipsilateral = 같은 쪽

hud.FollowCharacter = 캐릭터 따라가기
hud.FollowCharacter.tip = 호 게이지가 캐릭터의 화면 위치를 따라갑니다. 끄면 고정된 화면 기준점을 사용합니다.
hud.FollowSmoothing = 따라가기 보정 시간
hud.FollowSmoothing.tip = 캐릭터를 따라갈 때의 위치 보정 시간입니다. 0이면 즉시 따라갑니다.
hud.FixedAnchorX = 고정 기준점 가로 위치
hud.FixedAnchorX.tip = 캐릭터를 따라가지 않을 때 화면 너비 대비 기준점 위치입니다. 0.5는 가운데입니다.
hud.FixedAnchorY = 고정 기준점 세로 위치
hud.FixedAnchorY.tip = 캐릭터를 따라가지 않을 때 화면 높이 대비 기준점 위치입니다. 0.5는 가운데입니다.
hud.AnchorHeight = 캐릭터 기준점 높이
hud.AnchorHeight.tip = 캐릭터 원점에서 기준점까지의 월드 높이 오프셋입니다(UE 월드 단위, 1단위는 약 1cm). 화면 픽셀이 아니며, 양수면 위로 올라갑니다.
hud.AnchorOffsetX = 전체 가로 오프셋
hud.AnchorOffsetX.tip = 두 호를 함께 가로로 이동합니다. 양수면 오른쪽이며, 각 호의 개별 오프셋과 합산됩니다.
hud.AnchorOffsetY = 전체 세로 오프셋
hud.AnchorOffsetY.tip = 두 호를 함께 세로로 이동합니다. 양수면 아래쪽이며, 각 호의 개별 오프셋과 합산됩니다.
hud.Visibility = 표시 시점
hud.Visibility.tip = 게임 HUD 표시에 맞추거나, 추가로 가득 찬 상태가 유지되는 호를 개별로 숨깁니다. 아이콘은 가득 차도 숨겨지지 않습니다.
hud.Visibility.hud = 게임 HUD 따름
hud.Visibility.dynamic = 가득 차면 숨김
hud.HideDelay = 가득 참 숨김 지연
hud.HideDelay.tip = 각 호가 가득 찬 상태로 이 시간이 지나면 숨겨집니다. 수치가 줄면 다시 표시됩니다.

hud.HpArcEnabled = HP 호 표시
hud.HpArcEnabled.tip = HP 호 게이지를 표시합니다. 아이콘과 게임 기본 게이지에는 영향을 주지 않습니다.
hud.HpArcSide = HP 호 위치
hud.HpArcSide.tip = 회전 전 호의 위치를 선택합니다. 두 호를 같은 쪽에 두고 반지름이나 오프셋으로 구분할 수 있습니다.
hud.HpArcSide.left = 왼쪽
hud.HpArcSide.right = 오른쪽
hud.HpRadius = HP 호 반지름
hud.HpRadius.tip = HP 호에서 중심까지의 거리입니다. 값이 클수록 호가 넓어집니다.
hud.HpThickness = HP 호 두께
hud.HpThickness.tip = HP 호 붓질의 너비입니다.
hud.HpArcSpan = HP 호 범위
hud.HpArcSpan.tip = HP 호가 차지하는 각도입니다. 값이 클수록 호가 길어집니다.
hud.HpSegments = HP 호 분할 수
hud.HpSegments.tip = 분할이 많을수록 호가 매끄러워지지만 성능 부담도 커집니다.
hud.HpRotation = HP 호 회전
hud.HpRotation.tip = HP 호 전체를 중심을 기준으로 회전하며, 잔상과 붓끝도 함께 회전합니다. 양수면 시계 방향입니다.
hud.HpFillDirection = HP 채우기 방향
hud.HpFillDirection.tip = 정방향은 호의 기본 구간 순서로, 역방향은 반대 순서로 채웁니다. 회전해도 선택한 순서는 바뀌지 않습니다.
hud.HpFillDirection.normal = 정방향
hud.HpFillDirection.reverse = 역방향
hud.HpOffsetX = HP 호 가로 오프셋
hud.HpOffsetX.tip = 회전 후 HP 호를 가로로 이동합니다. 양수면 오른쪽이며, 1080p 기준으로 UI 배율에 맞춰 조정됩니다.
hud.HpOffsetY = HP 호 세로 오프셋
hud.HpOffsetY.tip = 회전 후 HP 호를 세로로 이동합니다. 양수면 아래쪽이며, 1080p 기준으로 UI 배율에 맞춰 조정됩니다.
hud.HpColor = HP 색상
hud.HpColor.tip = HP 호의 기본 색상입니다. 기본값은 옅은 은색입니다.
hud.HpTrackColor = HP 바탕 색상
hud.HpTrackColor.tip = HP 호에서 채워지지 않은 바탕 부분의 색상입니다.
hud.HpWarnColor = HP 부족 경고 색상
hud.HpWarnColor.tip = HP가 경고 기준치 아래로 떨어졌을 때 사용하는 색상입니다.
hud.WarnThresholdHp = HP 부족 기준치
hud.WarnThresholdHp.tip = HP 비율이 이 값보다 낮으면 경고 색상으로 바뀝니다. 기본값은 30%입니다.
hud.HpBarOpacity = HP 호 불투명도
hud.HpBarOpacity.tip = HP 호에서 채워진 부분의 불투명도입니다. 높을수록 선명합니다.
hud.HpTrackOpacity = HP 바탕 불투명도
hud.HpTrackOpacity.tip = HP 호 바탕의 불투명도입니다. 0이면 완전히 투명합니다.
hud.HpShowGhost = HP 잔상 표시
hud.HpShowGhost.tip = HP가 줄어들 때 서서히 줄어드는 잔상을 남겨 손실량을 쉽게 확인할 수 있습니다.
hud.HpGhostOpacity = HP 잔상 불투명도
hud.HpGhostOpacity.tip = HP가 줄어들 때 남는 잔상의 불투명도입니다.
hud.HpGhostColor = HP 잔상 색상
hud.HpGhostColor.tip = HP가 줄어들 때 남는 잔상의 색상입니다. 기본값은 어두운 빨간색입니다.
hud.HpShowTip = HP 붓끝 표시
hud.HpShowTip.tip = HP 호의 채워진 끝에 붓끝을 표시합니다. HP가 0이 되어도 붓끝은 남습니다.
hud.HpTipScale = HP 붓끝 크기
hud.HpTipScale.tip = HP 호 끝에 있는 붓끝의 크기 배율입니다.
hud.HpTipAngle = HP 붓끝 각도
hud.HpTipAngle.tip = 호의 접선에 대한 HP 붓끝의 각도입니다.

hud.QiArcEnabled = 살기 호 표시
hud.QiArcEnabled.tip = 살기 호 게이지를 표시합니다. 아이콘과 게임 기본 게이지에는 영향을 주지 않습니다.
hud.QiArcSide = 살기 호 위치
hud.QiArcSide.tip = 회전 전 호의 위치를 선택합니다. 두 호를 같은 쪽에 두고 반지름이나 오프셋으로 구분할 수 있습니다.
hud.QiArcSide.left = 왼쪽
hud.QiArcSide.right = 오른쪽
hud.QiRadius = 살기 호 반지름
hud.QiRadius.tip = 살기 호에서 중심까지의 거리입니다. 같은 쪽에 둔 두 호는 반지름을 달리해 구분할 수 있습니다.
hud.QiThickness = 살기 호 두께
hud.QiThickness.tip = 살기 호 붓질의 너비입니다.
hud.QiArcSpan = 살기 호 범위
hud.QiArcSpan.tip = 살기 호가 차지하는 각도입니다. 값이 클수록 호가 길어집니다.
hud.QiSegments = 살기 호 분할 수
hud.QiSegments.tip = 분할이 많을수록 호가 매끄러워지지만 성능 부담도 커집니다.
hud.QiRotation = 살기 호 회전
hud.QiRotation.tip = 살기 호 전체를 중심을 기준으로 회전하며, 잔상과 붓끝도 함께 회전합니다. 양수면 시계 방향입니다.
hud.QiFillDirection = 살기 채우기 방향
hud.QiFillDirection.tip = 정방향은 호의 기본 구간 순서로, 역방향은 반대 순서로 채웁니다. 회전해도 선택한 순서는 바뀌지 않습니다.
hud.QiFillDirection.normal = 정방향
hud.QiFillDirection.reverse = 역방향
hud.QiOffsetX = 살기 호 가로 오프셋
hud.QiOffsetX.tip = 회전 후 살기 호를 가로로 이동합니다. 양수면 오른쪽이며, 1080p 기준으로 UI 배율에 맞춰 조정됩니다.
hud.QiOffsetY = 살기 호 세로 오프셋
hud.QiOffsetY.tip = 회전 후 살기 호를 세로로 이동합니다. 양수면 아래쪽이며, 1080p 기준으로 UI 배율에 맞춰 조정됩니다.
hud.QiColor = 살기 색상
hud.QiColor.tip = 살기 호의 기본 색상입니다. 기본값은 금색입니다.
hud.QiTrackColor = 살기 바탕 색상
hud.QiTrackColor.tip = 살기 호에서 채워지지 않은 바탕 부분의 색상입니다.
hud.QiWarnColor = 살기 부족 경고 색상
hud.QiWarnColor.tip = 살기가 경고 기준치 아래로 떨어졌을 때 사용하는 색상입니다. 가드 브레이크 표시가 우선합니다.
hud.WarnThresholdQi = 살기 부족 기준치
hud.WarnThresholdQi.tip = 살기 비율이 이 값보다 낮으면 경고 색상으로 바뀝니다. 기본값은 25%입니다.
hud.QiBarOpacity = 살기 호 불투명도
hud.QiBarOpacity.tip = 살기 호에서 채워진 부분의 불투명도입니다. 높을수록 선명합니다.
hud.QiTrackOpacity = 살기 바탕 불투명도
hud.QiTrackOpacity.tip = 살기 호 바탕의 불투명도입니다. 0이면 완전히 투명합니다.
hud.QiShowGhost = 살기 잔상 표시
hud.QiShowGhost.tip = 살기가 줄어들 때 서서히 줄어드는 잔상을 남겨 손실량을 쉽게 확인할 수 있습니다.
hud.QiGhostOpacity = 살기 잔상 불투명도
hud.QiGhostOpacity.tip = 살기가 줄어들 때 남는 잔상의 불투명도입니다.
hud.QiGhostColor = 살기 잔상 색상
hud.QiGhostColor.tip = 살기가 줄어들 때 남는 잔상의 색상입니다. 기본값은 어두운 금색이며, 가드 브레이크 중에는 가드 브레이크 색상을 사용합니다.
hud.QiShowTip = 살기 붓끝 표시
hud.QiShowTip.tip = 살기 호의 채워진 끝에 붓끝을 표시합니다. 살기가 0이 되어도 붓끝은 남습니다.
hud.QiTipScale = 살기 붓끝 크기
hud.QiTipScale.tip = 살기 호 끝에 있는 붓끝의 크기 배율입니다.
hud.QiTipAngle = 살기 붓끝 각도
hud.QiTipAngle.tip = 호의 접선에 대한 살기 붓끝의 각도입니다.
hud.BreakHint = 가드 브레이크 표시
hud.BreakHint.tip = 캐릭터의 가드가 깨진 동안 살기 호 색상을 바꾸고, 회복하면 즉시 되돌립니다. 끄면 가드 브레이크를 감지하지 않습니다.
hud.QiBreakColor = 가드 브레이크 색상
hud.QiBreakColor.tip = 가드 브레이크 중 살기 호에 사용하는 색상으로, 살기 부족 경고 색상보다 우선합니다.
hud.QiBreakTrackColor = 가드 브레이크 바탕 색상
hud.QiBreakTrackColor.tip = 가드 브레이크 중 살기 호 바탕에 사용하는 색상입니다. 끝나면 원래 바탕 색상으로 돌아갑니다.
hud.BreakDemo = 가드 브레이크 색상 미리보기
hud.BreakDemo.tip = 패널을 잠시 닫고 살기 호를 비운 뒤 가드 브레이크 색상을 3초간 표시하고, 자동으로 복원한 후 패널을 다시 엽니다. 실제로 가드가 깨지지는 않습니다.
hud.BreakDemo.run = 데모 시작

hud.BrushJitter = 붓질 흔들림
hud.BrushJitter.tip = 두 호의 붓질이 무작위로 변하는 정도입니다. 0이면 가장자리가 가장 깔끔합니다.
hud.StrokeOverlap = 붓질 겹침 배율
hud.StrokeOverlap.tip = 구간 길이에 대한 각 붓질 길이의 배율입니다. 늘리면 이음새가 가려지고, 줄이면 구간이 더 잘 드러납니다.
hud.GhostSpeed = 잔상 회수 시간
hud.GhostSpeed.tip = 두 호의 잔상이 회수되는 시간입니다. 작을수록 현재 값을 더 빨리 따라잡습니다.
hud.GhostDelay = 잔상 회수 지연
hud.GhostDelay.tip = 감소 후 잔상이 이 시간만큼 유지된 뒤 회수되어 이번 손실량을 확인하기 쉽습니다. 연속으로 줄면 유지 시간이 갱신되며, 0이면 즉시 회수합니다.
hud.WarnFlashSpeed = 경고 깜빡임 속도
hud.WarnFlashSpeed.tip = HP 부족 및 살기 부족 경고의 깜빡임 빈도입니다. 클수록 빠르게 깜빡입니다.
hud.WarnFlashAmount = 경고 깜빡임 강도
hud.WarnFlashAmount.tip = 부족 경고 시 밝기 변화 폭입니다. 0이면 깜빡이지 않습니다.

hud.NativeBars = 게임 기본 HUD
hud.NativeBars.tip = 화면 왼쪽 아래의 게임 기본 HP 게이지와 살기 게이지를 길이 고정, 그대로 유지, 숨김 중에서 고릅니다. 길이 고정은 게임이 게이지를 다시 만들어도 자동으로 복원됩니다.
hud.NativeBars.pin = 길이 고정
hud.NativeBars.dynamic = 그대로 유지
hud.NativeBars.hide = 숨김
hud.HudBarWidth = 기본 게이지 고정 너비
hud.HudBarWidth.tip = -1이면 각 게이지의 게임 초기 길이를 사용합니다. 직접 지정할 때는 게임 UI 단위로 48 이상이어야 하며, 게임이 게이지를 다시 만들어도 고정 길이가 자동 복원됩니다.
hud.NativePinRecover = 고정 길이 자동 복원
hud.NativePinRecover.tip = 고정 길이가 풀리면 자동 복원을 시도하며, 보통 약 1.5초 걸립니다. 끄면 이상만 기록해 문제 확인에 유용하며, 고정과 숨김 모드 모두에서 동작합니다.
hud.HudNumbers = 게이지 수치 표시
hud.HudNumbers.tip = 현재값과 최대값을 표시합니다. 게임 기본 게이지를 숨겨도 표시할 수 있습니다.
hud.HudNumberStyle = 수치 스타일
hud.HudNumberStyle.tip = 가운데는 게이지 안에 흰 글자로 표시하고, 위아래는 HP를 게이지 위에, 살기를 게이지 아래에 표시합니다.
hud.HudNumberStyle.center = 게이지 안 가운데
hud.HudNumberStyle.side = 게이지 위아래

hud.MedicineHud = 약병 표시
hud.MedicineHud.tip = 장착한 약병의 아이콘과 개수를 표시합니다.
hud.PureIcon = 순수 살기 표시
hud.PureIcon.tip = 순수 살기 아이콘과 개수를 표시합니다.
hud.BulletIcon = 암원 표시
hud.BulletIcon.tip = 암원 아이콘과 개수를 표시합니다. 순수 살기와 같은 그룹 위치를 사용합니다.
hud.UltChargeBar = 순수 살기 충전 표시
hud.UltChargeBar.tip = 충전 진행도를 순수 살기 아이콘 안에 채워 표시합니다. 암원 아이콘에는 영향을 주지 않습니다.
hud.IconScale = 아이콘 크기
hud.IconScale.tip = 아이콘, 숫자, 간격을 함께 조정하며 아래쪽 가장자리 위치는 유지합니다.
hud.MedicineHudX = 약병 그룹 가로 위치
