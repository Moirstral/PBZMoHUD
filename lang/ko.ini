hud.Debug = 디버그 로그
hud.Debug.tip = 자세한 실행 정보를 Scripts/PBZMoHUD.log 에 기록합니다. 문제를 제보할 때 이 파일을 첨부해 주세요.
hud.DragIcons = 아이콘 드래그
hud.DragIcons.tip = 설정 화면을 잠시 닫습니다. 왼쪽 드래그로 아이콘 그룹 전체를, 오른쪽 드래그로 개별 아이콘을 옮기고, 가운데 클릭으로 기본 위치로 되돌립니다. ESC를 누르면 설정 패널로 돌아갑니다.
hud.DragIcons.run = 드래그 시작
hud.dragTip = ESC를 눌러 드래그 모드 종료
