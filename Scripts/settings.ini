; PBZMoHUD 1.0.0
; HOME opens PBZMoConfig. Changes are saved only when you choose Save.
; Keep comments on separate lines, not after values.

; Preset: normal, mirror, ipsilateral
Layout = normal

; Behavior
FollowCharacter = true
FollowSmoothing = 0.10
FixedAnchorX = 0.50
FixedAnchorY = 0.55
AnchorHeight = 15
AnchorOffsetX = 0
AnchorOffsetY = 0
; Visibility: hud = follow game HUD, dynamic = also hide arcs when full
Visibility = dynamic
HideDelay = 3

; HP arc
HpArcEnabled = true
HpArcSide = left
HpRadius = 195
HpThickness = 12
HpArcSpan = 60
HpSegments = 45
HpRotation = 0
; normal = Normal, reverse = Reversed (relative to the arc)
HpFillDirection = normal
HpOffsetX = 0
HpOffsetY = 0
HpColor = #D6D2C6
HpTrackColor = #0A0908
HpWarnColor = #E0301E
WarnThresholdHp = 0.30
HpBarOpacity = 0.75
HpTrackOpacity = 0.45
HpShowGhost = true
HpGhostOpacity = 0.55
HpGhostColor = #8B1A1A
HpShowTip = true
HpTipScale = 1.80
HpTipAngle = -15

; Sha-Chi arc
QiArcEnabled = true
QiArcSide = right
QiRadius = 195
QiThickness = 12
QiArcSpan = 60
QiSegments = 45
QiRotation = 0
QiFillDirection = normal
QiOffsetX = 0
QiOffsetY = 0
QiColor = #D9A62E
QiTrackColor = #0A0908
QiWarnColor = #E0301E
WarnThresholdQi = 0.25
QiBarOpacity = 0.75
QiTrackOpacity = 0.45
QiShowGhost = true
QiGhostOpacity = 0.55
QiGhostColor = #AD8322
QiShowTip = true
QiTipScale = 1.80
QiTipAngle = -15
BreakHint = true
QiBreakColor = #FF3B30
QiBreakTrackColor = #6B1410

; Shared appearance
BrushJitter = 0
StrokeOverlap = 9.5
GhostSpeed = 0.35
GhostDelay = 0.8
WarnFlashSpeed = 1.80
WarnFlashAmount = 0.65

; Native bars: pin = fixed length, dynamic = unchanged, hide = hidden
NativeBars = pin
; -1 uses initial game lengths. Custom widths start at 48 game UI units.
HudBarWidth = -1
NativePinRecover = true
HudNumbers = true
; center = inside each bar, side = HP above / Sha-Chi below
HudNumberStyle = center

; Icons
MedicineHud = true
PureIcon = true
BulletIcon = true
UltChargeBar = true
IconScale = 1.0
; Group positions: -1 uses automatic layout. Range: -10000 to 20000 px.
MedicineHudX = -1
MedicineHudY = -1
UltHudX = -1
UltHudY = -1
; Individual offsets within each group. Range: -800 to 800 px.
Med1OffX = 0
Med1OffY = 0
Med2OffX = 0
Med2OffY = 0
Ult1OffX = 0
Ult1OffY = 0
Ult2OffX = 0
Ult2OffY = 0

; Advanced
Debug = false
