; 预设：normal 常规、mirror 镜像、ipsilateral 同侧
; Preset: normal, mirror, ipsilateral
; 此项仅影响配置面板显示，实际布局仍由各项参数决定。配置面板修改该项自动应该预设的数值。
; This option only affects the settings panel display. The actual layout is still determined by each parameter. Modifying this option in the settings panel should automatically set the preset values.
Layout = normal

; 行为 / Behavior
FollowCharacter = true
FollowSmoothing = 0.10
FixedAnchorX = 0.50
FixedAnchorY = 0.55
AnchorHeight = 15
AnchorOffsetX = 0
AnchorOffsetY = 0
; 显隐：hud 跟随游戏 HUD；dynamic 满值时还隐藏弧形条。
; Visibility: hud follows the game HUD; dynamic also hides arcs when full.
Visibility = dynamic
HideDelay = 3

; 血量弧形条 / HP arc
HpArcEnabled = true
HpArcSide = left
HpRadius = 195
HpThickness = 12
HpArcSpan = 60
HpSegments = 45
HpRotation = 0
; 填充方向：normal 与弧线同向、reverse 反向（相对弧线）。
; Fill direction: normal follows the arc, reverse is reversed relative to it.
HpFillDirection = normal
HpOffsetX = 0
HpOffsetY = 0
HpColor = #D6D2C6
HpTrackColor = #0A0908
HpWarnColor = #E0301E
WarnThresholdHp = 0.30
HpBarOpacity = 0.75
HpTrackOpacity = 0.45
HpShowGhost = true
HpGhostOpacity = 0.55
HpGhostColor = #8B1A1A
HpVirtualColor = #C8141E
HpShowTip = true
HpTipScale = 1.80
HpTipAngle = -15

; 杀气弧形条 / Sha-Chi arc
QiArcEnabled = true
QiArcSide = right
QiRadius = 195
QiThickness = 12
QiArcSpan = 60
QiSegments = 45
QiRotation = 0
QiFillDirection = normal
QiOffsetX = 0
QiOffsetY = 0
QiColor = #D9A62E
QiTrackColor = #0A0908
QiWarnColor = #E0301E
WarnThresholdQi = 0.25
QiBarOpacity = 0.75
QiTrackOpacity = 0.45
QiShowGhost = true
QiGhostOpacity = 0.55
QiGhostColor = #AD8322
QiShowTip = true
QiTipScale = 1.80
QiTipAngle = -15
BreakHint = true
QiBreakColor = #FF3B30
QiBreakTrackColor = #6B1410

; 共用外观 / Shared appearance
BrushJitter = 0
StrokeOverlap = 9.5
GhostSpeed = 0.35
GhostDelay = 0.8
WarnFlashSpeed = 1.80
WarnFlashAmount = 0.65

; 原生条：pin 固定长度、dynamic 保持原样、hide 隐藏。
; Native bars: pin = fixed length, dynamic = unchanged, hide = hidden.
NativeBars = pin
; -1 使用游戏初始长度；自定义宽度从 48 个游戏 UI 单位起。
; -1 uses initial game lengths. Custom widths start at 48 game UI units.
HudBarWidth = -1
NativePinRecover = true
HudNumbers = true
; 数字位置：center 显示在条内、side 血量在上 / 杀气在下。
; Numbers: center = inside each bar; side = HP above / Sha-Chi below.
HudNumberStyle = center

; 图标 / Icons
MedicineHud = true
PureIcon = true
BulletIcon = true
UltChargeBar = true
IconScale = 1.0
; 分组位置：-1 为自动布局；范围 -10000 ~ 20000 px。
; Group positions: -1 uses automatic layout. Range: -10000 to 20000 px.
MedicineHudX = -1
MedicineHudY = -1
UltHudX = -1
UltHudY = -1
; 组内各图标的单独偏移；范围 -800 ~ 800 px。
; Individual offsets within each group. Range: -800 to 800 px.
Med1OffX = 0
Med1OffY = 0
Med2OffX = 0
Med2OffY = 0
Ult1OffX = 0
Ult1OffY = 0
Ult2OffX = 0
Ult2OffY = 0

; 高级 / Advanced
Debug = false
